name: fetch-img
on:
  push:
    paths: ["scripts/img_urls.txt"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p img_cache
          while read u; do [ -z "$u" ] && continue; f=img_cache/$(echo "$u" | sed 's#.*/\(players/full\|500\)/##'); case "$u" in *headshots*) f="img_cache/p_$(basename $u)";; *) f="img_cache/t_$(basename $u)";; esac; curl -sfL "$u" -o "$f" || echo "fail $u"; done < scripts/img_urls.txt
          ls -la img_cache | head -40
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add img_cache && git commit -m "Cache images" && git push || true
