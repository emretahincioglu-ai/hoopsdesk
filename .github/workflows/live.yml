name: Live ESPN scores
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: live-scores
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Fetch live scores
        env:
          LEAGUES_JSON: ${{ secrets.LEAGUES_JSON }}
        run: python scripts/live.py
      - name: Commit if changed
        run: |
          git config user.name "fantasy-plus-bot"
          git config user.email "actions@users.noreply.github.com"
          git add live
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Live scores $(date -u +%H:%M)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
