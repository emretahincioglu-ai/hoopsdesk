<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Home To-Do Ideas</title>
<style>
:root{color-scheme:dark;--y:#ffc62b;--g:#4ade80;--r:#f87171;--b:#60a5fa;--p:#c4a7ff;--sub:#8e9096;--card:#141518;--line:#24252a}
*{box-sizing:border-box}body{margin:0;background:#000;color:#f2f3f5;font:14px -apple-system,system-ui,sans-serif}
.w{max-width:460px;margin:0 auto;padding:16px 12px 80px}h1{font:800 22px system-ui;margin:4px}.ld{color:var(--sub);font-size:13px;margin:0 4px 6px;line-height:1.4}
.o{margin:26px 0 0}.oh{margin:0 4px 8px;font:700 15px system-ui}.oh b{color:var(--y);margin-right:6px}.od{display:block;color:var(--sub);font:500 12px/1.35 system-ui;margin-top:2px}
.sb{background:var(--card);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;font:700 13px system-ui;color:#c9cad0;margin-bottom:8px}.sb b{font:900 22px system-ui;color:#fff}.sb .m{margin-left:auto;margin-right:auto;color:var(--g);font-size:12px}
.ic{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:15px}
.t1{font:700 13px/1.25 system-ui}.t2{font:500 11.5px/1.3 system-ui;color:var(--sub)}
.go{flex:none;border:0;border-radius:999px;padding:6px 10px;font:800 11px system-ui;background:var(--y);color:#000}
button{cursor:pointer}
@keyframes up{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,198,43,.6)}70%,100%{box-shadow:0 0 0 10px rgba(255,198,43,0)}}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes spinIn{from{transform:rotateX(-90deg);opacity:0}to{transform:none;opacity:1}}
</style></head><body><div class="w">
<h1>Home to-do · 30 ideas</h1>
<p class="ld">Same 7 alerts in every design, sitting just under the scoreboard. Most are tappable: try swiping, tapping and opening them.</p>
<div id="o"></div></div>
<script>
const T=[
 {k:"plan",ic:"📝",c:"#c4a7ff",t:"Ali added Ighodaro to the Week Plan",s:"Thu · with 2 drop options",a:"Open plan",pri:2},
 {k:"daily",ic:"🌅",c:"#fb923c",t:"New Daily story is ready",s:"Last night: you flipped 3PM, REB, TO",a:"Watch",pri:3},
 {k:"add",ic:"➕",c:"#4ade80",t:"You can add someone today",s:"1 open spot · 4 recommended players",a:"See picks",pri:1},
 {k:"watch",ic:"👀",c:"#60a5fa",t:"Watch list: Buzelis was dropped",s:"He's a free agent now",a:"Grab him",pri:1},
 {k:"irback",ic:"🩹",c:"#4ade80",t:"Embiid is back from IR",s:"Move him into your lineup",a:"Move",pri:1},
 {k:"irout",ic:"🚑",c:"#f87171",t:"Maxey is OUT",s:"Move him to IR to free a spot",a:"Move to IR",pri:1},
 {k:"fill",ic:"⚠️",c:"#ffc62b",t:"Your roster isn't full",s:"2 empty spots today",a:"Fill roster",pri:1}];
const SB=`<div class="sb"><span>Mastika</span><b>6</b><span class="m">WK 3 · 73%</span><b>3</b><span>LeTakim</span></div>`;
const row=(x,btn=1)=>`<div class="ic" style="background:${x.c}22;color:${x.c}">${x.ic}</div><div style="flex:1;min-width:0"><div class="t1">${x.t}</div><div class="t2">${x.s}</div></div>${btn?`<button class="go">${x.a}</button>`:""}`;
const O=[];const add=(n,d,h,js)=>O.push({n,d,h,js});
// 1 Wallet stack
add("Wallet stack","Cards stacked behind each other like Apple Wallet. Tap the stack to fan them all out; tap again to close.",
`<div class="ws" style="position:relative;height:96px;transition:height .45s cubic-bezier(.3,1.3,.5,1)">${T.map((x,i)=>`<div class="wc" style="position:absolute;left:0;right:0;top:0;background:#1b1c20;border:1px solid #2a2b30;border-radius:14px;padding:10px;display:flex;align-items:center;gap:10px;transition:all .45s cubic-bezier(.3,1.3,.5,1);z-index:${20-i};transform:translateY(${Math.min(i,3)*8}px) scale(${1-Math.min(i,3)*.04});opacity:${i>3?0:1}">${row(x)}</div>`).join("")}<span style="position:absolute;right:8px;top:-8px;z-index:30;background:var(--y);color:#000;font:900 11px system-ui;border-radius:999px;padding:2px 7px">7</span></div>`,
el=>{const s=el.querySelector(".ws");let o=0;s.onclick=e=>{if(e.target.closest(".go"))return;o=!o;s.style.height=o?(T.length*62)+"px":"96px";s.querySelectorAll(".wc").forEach((c,i)=>{c.style.transform=o?`translateY(${i*62}px)`:`translateY(${Math.min(i,3)*8}px) scale(${1-Math.min(i,3)*.04})`;c.style.opacity=o||i<=3?1:0})}});
// 2 Swipe deck
add("Swipe deck","Tinder-style: one card on top, swipe right to do it, left to dismiss. Counter shows what's left.",
`<div class="sd" style="position:relative;height:110px">${T.map((x,i)=>`<div class="dc" style="position:absolute;inset:0 0 auto 0;height:96px;background:#1b1c20;border:1px solid #2a2b30;border-radius:16px;padding:12px;display:flex;align-items:center;gap:10px;z-index:${20-i};transform:translateY(${i*6}px) scale(${1-i*.03});touch-action:pan-y">${row(x,0)}</div>`).join("")}</div><div style="display:flex;justify-content:space-between;font:700 11px system-ui;color:var(--sub);margin-top:4px"><span>← dismiss</span><span class="cnt">7 left</span><span>do it →</span></div>`,
el=>{const cards=[...el.querySelectorAll(".dc")];let i=0;const fly=(dx)=>{const c=cards[i];if(!c)return;c.animate([{transform:c.style.transform},{transform:`translateX(${dx*400}px) rotate(${dx*25}deg)`,opacity:0}],{duration:350,fill:"forwards"});i++;cards.slice(i).forEach((d,k)=>{d.style.transition="transform .3s";d.style.transform=`translateY(${k*6}px) scale(${1-k*.03})`});el.querySelector(".cnt").textContent=(7-i)+" left";if(i>=7)setTimeout(()=>{i=0;cards.forEach((d,k)=>{d.getAnimations().forEach(a=>a.cancel());d.style.transform=`translateY(${k*6}px) scale(${1-k*.03})`});el.querySelector(".cnt").textContent="7 left"},800)};let x0=null;el.addEventListener("pointerdown",e=>x0=e.clientX);el.addEventListener("pointerup",e=>{if(x0==null)return;const dx=e.clientX-x0;fly(Math.abs(dx)<10?1:Math.sign(dx));x0=null})});
// 3 Dynamic island pill
add("Island pill","One black pill under the scoreboard (like the iPhone Dynamic Island) that cycles alerts. Tap it to expand into the full list.",
`<div class="ip" style="margin:0 auto;width:220px;height:40px;border-radius:22px;background:#000;border:1px solid #2a2b30;display:flex;align-items:center;gap:8px;padding:0 6px 0 6px;overflow:hidden;transition:all .5s cubic-bezier(.3,1.3,.5,1);cursor:pointer"><span class="ipr" style="display:flex;align-items:center;gap:8px;flex:1;min-width:0"></span></div>`,
el=>{const p=el.querySelector(".ip"),r=el.querySelector(".ipr");let i=0,open=0;const show=()=>{if(open)return;const x=T[i%7];r.innerHTML=`<span class="ic" style="width:26px;height:26px;background:${x.c}33">${x.ic}</span><span style="font:700 12px system-ui;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${x.t}</span>`;r.animate([{opacity:0,transform:"translateY(10px)"},{opacity:1,transform:"none"}],{duration:300});i++};show();setInterval(show,2200);p.onclick=()=>{open=!open;if(open){p.style.width="100%";p.style.height=T.length*44+16+"px";p.style.borderRadius="22px";r.style.flexDirection="column";r.style.alignItems="stretch";r.innerHTML=T.map(x=>`<div style="display:flex;align-items:center;gap:8px;height:44px">${row(x)}</div>`).join("")}else{p.style.width="220px";p.style.height="40px";r.style.flexDirection="row";r.style.alignItems="center";show()}}});
// 4 Checklist with progress ring
add("Daily checklist","A to-do list with checkboxes and a progress ring. Tap an item to tick it off; the ring fills.",
`<div style="background:var(--card);border-radius:16px;padding:12px"><div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><svg width="38" height="38"><circle cx="19" cy="19" r="15" fill="none" stroke="#2a2b30" stroke-width="4"/><circle class="rg" cx="19" cy="19" r="15" fill="none" stroke="#ffc62b" stroke-width="4" stroke-linecap="round" stroke-dasharray="94.2" stroke-dashoffset="94.2" transform="rotate(-90 19 19)" style="transition:stroke-dashoffset .5s"/></svg><div><div class="t1">Today's to-do</div><div class="t2 pc">0 of 7 done</div></div></div>${T.map(x=>`<label style="display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line);cursor:pointer"><input type="checkbox" style="width:18px;height:18px;accent-color:#ffc62b"><span style="font-size:15px">${x.ic}</span><span style="flex:1"><span class="t1">${x.t}</span></span></label>`).join("")}</div>`,
el=>{const up=()=>{const n=el.querySelectorAll("input:checked").length;el.querySelector(".rg").style.strokeDashoffset=94.2*(1-n/7);el.querySelector(".pc").textContent=n+" of 7 done";el.querySelectorAll("label").forEach(l=>{l.style.opacity=l.querySelector("input").checked?.45:1;l.querySelector(".t1").style.textDecoration=l.querySelector("input").checked?"line-through":"none"})};el.querySelectorAll("input").forEach(i=>i.onchange=up)});
// 5 Horizontal carousel
add("Snap carousel","Big cards you swipe sideways, one at a time, with dots underneath. Clean and familiar.",
`<div class="cr" style="display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:4px">${T.map(x=>`<div style="flex:0 0 86%;scroll-snap-align:center;background:linear-gradient(135deg,${x.c}26,#17181b 60%);border:1px solid ${x.c}55;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px"><div style="display:flex;gap:10px;align-items:center">${row(x,0)}</div><button class="go" style="align-self:flex-start">${x.a} →</button></div>`).join("")}</div><div class="dt" style="display:flex;gap:4px;justify-content:center;margin-top:6px">${T.map((x,i)=>`<i style="width:6px;height:6px;border-radius:3px;background:${i?"#3a3b40":"#ffc62b"};transition:all .3s"></i>`).join("")}</div>`,
el=>{const c=el.querySelector(".cr"),d=[...el.querySelectorAll(".dt i")];c.onscroll=()=>{const i=Math.round(c.scrollLeft/(c.clientWidth*.86+8));d.forEach((x,k)=>{x.style.background=k===i?"#ffc62b":"#3a3b40";x.style.width=k===i?"16px":"6px"})}});
// 6 Ticker tape
add("Breaking-news ticker","A thin scrolling ticker under the scoreboard, like a sports channel. Tap to pause and open.",
`<div style="background:var(--y);color:#000;border-radius:8px;overflow:hidden;display:flex;align-items:center;height:30px"><span style="flex:none;background:#000;color:var(--y);font:900 11px system-ui;padding:0 8px;height:100%;display:grid;place-items:center;letter-spacing:.06em">ALERTS</span><div style="overflow:hidden;flex:1"><div class="tk" style="display:flex;gap:28px;white-space:nowrap;font:800 12px system-ui;animation:tick 22s linear infinite;width:max-content">${[...T,...T].map(x=>`<span>${x.ic} ${x.t}</span>`).join("")}</div></div></div>`,
el=>{const t=el.querySelector(".tk");t.parentNode.onclick=()=>{t.style.animationPlayState=t.style.animationPlayState==="paused"?"running":"paused"}});
// 7 Priority tiers
add("Priority lanes","Grouped by urgency: Do now (red), Today (yellow), FYI (grey). You know what matters first.",
`<div style="display:flex;flex-direction:column;gap:6px">${[["DO NOW","#f87171",1],["TODAY","#ffc62b",2],["FYI","#8e9096",3]].map(([l,c,p])=>`<div style="background:var(--card);border-radius:14px;border-left:3px solid ${c};padding:8px 10px"><div style="font:900 10px system-ui;letter-spacing:.1em;color:${c};margin-bottom:4px">${l} · ${T.filter(x=>x.pri===p).length}</div>${T.filter(x=>x.pri===p).map(x=>`<div style="display:flex;align-items:center;gap:8px;padding:4px 0">${row(x)}</div>`).join("")}</div>`).join("")}</div>`);
// 8 Story rings
add("Story bubbles","Round bubbles like Instagram stories, each with a coloured ring. Unseen ones glow; tap one to open it full-screen.",
`<div style="display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:4px 2px">${T.map(x=>`<button class="sbub" style="flex:none;border:0;background:none;color:#fff;display:flex;flex-direction:column;align-items:center;gap:4px;width:62px"><span style="width:56px;height:56px;border-radius:50%;padding:2.5px;background:conic-gradient(${x.c},#ffc62b,${x.c})"><span style="display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:#111;border:2px solid #000;font-size:22px">${x.ic}</span></span><span style="font:700 10px system-ui;color:#c9cad0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:62px">${x.a}</span></button>`).join("")}</div><div class="sv" style="display:none;margin-top:8px;background:#1b1c20;border-radius:16px;padding:14px;animation:up .3s"></div>`,
el=>{el.querySelectorAll(".sbub").forEach((b,i)=>b.onclick=()=>{b.firstChild.style.background="#3a3b40";const v=el.querySelector(".sv");v.style.display="flex";v.style.gap="10px";v.style.alignItems="center";v.innerHTML=row(T[i]);v.animate([{transform:"scale(.9)",opacity:0},{transform:"none",opacity:1}],{duration:250})})});
// 9 Notification center
add("Notification center","iOS lock-screen style: frosted cards stacked by app group, \"7 notifications\" collapses them.",
`<div class="nc" style="background:linear-gradient(160deg,#1a2a44,#2a1a3a);border-radius:18px;padding:10px">${T.slice(0,3).map((x,i)=>`<div style="background:rgba(255,255,255,.1);backdrop-filter:blur(10px);border-radius:14px;padding:9px;display:flex;gap:9px;align-items:center;margin-top:${i?6:0}px">${row(x,0)}<span style="font:600 10px system-ui;color:#c9cad0">now</span></div>`).join("")}<div style="background:rgba(255,255,255,.06);border-radius:14px;height:12px;margin:-4px 8px 0"></div><div style="text-align:center;font:700 11px system-ui;color:#c9cad0;margin-top:6px">+4 more</div></div>`);
// 10 Chat from Coach
add("Coach chat","Alerts arrive as chat messages from a \"Coach\" bot with typing dots. Feels alive and personal.",
`<div class="ch" style="background:var(--card);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:6px;min-height:150px"></div>`,
el=>{const c=el.querySelector(".ch");let i=0;const next=()=>{if(i>=4){c.innerHTML="";i=0}const x=T[i++];const t=document.createElement("div");t.innerHTML='<span style="display:inline-block;background:#26272c;border-radius:14px;padding:8px 12px;font:900 14px system-ui;letter-spacing:2px">···</span>';c.append(t);setTimeout(()=>{t.innerHTML=`<div style="display:flex;gap:6px;align-items:flex-end"><span style="width:22px;height:22px;border-radius:50%;background:var(--y);display:grid;place-items:center;font-size:12px;flex:none">🏀</span><span style="background:#26272c;border-radius:14px 14px 14px 4px;padding:8px 11px;font:600 12.5px/1.3 system-ui;max-width:80%">${x.ic} ${x.t}. <u style="color:var(--y);text-decoration:none;font-weight:800">${x.a} →</u></span></div>`;t.animate([{opacity:0,transform:"translateY(6px)"},{opacity:1,transform:"none"}],{duration:250})},700);setTimeout(next,2200)};next()});
// 11 Accordion count
add("One-line summary","Just one line: \"4 things need you\" with coloured dots. Tap to drop down the full list.",
`<div style="background:var(--card);border-radius:14px;overflow:hidden"><button class="sm" style="width:100%;border:0;background:none;color:#fff;display:flex;align-items:center;gap:10px;padding:12px;font:800 14px system-ui"><span style="width:10px;height:10px;border-radius:50%;background:var(--y);animation:pulse 2s infinite"></span>4 things need you today<span style="margin-left:auto;display:flex;gap:3px">${T.map(x=>`<i style="width:7px;height:7px;border-radius:50%;background:${x.c}"></i>`).join("")}</span><span class="cv" style="transition:transform .3s">⌄</span></button><div class="ac" style="max-height:0;overflow:hidden;transition:max-height .45s ease">${T.map(x=>`<div style="display:flex;gap:10px;align-items:center;padding:8px 12px;border-top:1px solid var(--line)">${row(x)}</div>`).join("")}</div></div>`,
el=>{const b=el.querySelector(".sm"),a=el.querySelector(".ac");b.onclick=()=>{const o=a.style.maxHeight!=="0px"&&a.style.maxHeight;a.style.maxHeight=o?"0px":"500px";el.querySelector(".cv").style.transform=o?"":"rotate(180deg)"}});
// 12 Sticky notes
add("Sticky notes","Coloured sticky notes pinned at slight angles, like a locker door. Fun and very glanceable.",
`<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">${T.slice(0,6).map((x,i)=>`<div style="background:${x.c};color:#111;border-radius:3px;padding:8px;min-height:84px;transform:rotate(${[-3,2,-1.5,2.5,-2,1][i]}deg);box-shadow:0 6px 14px rgba(0,0,0,.4);font:800 11px/1.25 system-ui;position:relative"><span style="position:absolute;top:-5px;left:50%;width:10px;height:10px;border-radius:50%;background:#e33;transform:translateX(-50%);box-shadow:0 2px 3px rgba(0,0,0,.4)"></span>${x.ic}<br>${x.t}</div>`).join("")}</div>`);
// 13 Bento grid
add("Bento grid","Tiles of different sizes: the most urgent alert gets the big tile, the rest fill around it.",
`<div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:62px;gap:6px">${T.map((x,i)=>{const sp=i===0?"grid-column:span 2;grid-row:span 2":i<3?"grid-column:span 2":"grid-column:span 1";return `<div style="${sp};background:linear-gradient(150deg,${x.c}30,#17181b);border:1px solid ${x.c}44;border-radius:12px;padding:8px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden"><span style="font-size:${i?16:24}px">${x.ic}</span><span style="font:800 ${i?10:13}px/1.2 system-ui">${i<3?x.t:x.a}</span></div>`}).join("")}</div>`);
// 14 Timeline
add("Today timeline","A vertical timeline with times: what happened overnight and what to do before tip-off.",
`<div style="background:var(--card);border-radius:16px;padding:10px 12px">${T.map((x,i)=>`<div style="display:flex;gap:10px"><div style="display:flex;flex-direction:column;align-items:center"><span style="width:10px;height:10px;border-radius:50%;background:${x.c};margin-top:4px"></span>${i<6?'<span style="flex:1;width:2px;background:#2a2b30;margin:2px 0"></span>':""}</div><div style="flex:1;padding-bottom:10px"><div style="font:800 10px system-ui;color:var(--sub)">${["2:14 AM","3:00 AM","9:00 AM","11:20 AM","1:05 PM","4:40 PM","Before 7 PM"][i]}</div><div class="t1">${x.t}</div></div></div>`).join("")}</div>`);
// 15 Slot machine
add("Slot machine","One line that flips through alerts like an airport departure board.",
`<div style="background:#0a0a0a;border:1px solid #2a2b30;border-radius:12px;padding:10px;display:flex;align-items:center;gap:10px;perspective:400px"><span style="font:900 10px system-ui;color:var(--y);letter-spacing:.1em">NEXT UP</span><div class="fl" style="flex:1;font:800 13px ui-monospace,monospace;color:#fff;background:#151515;border-radius:6px;padding:6px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div></div>`,
el=>{const f=el.querySelector(".fl");let i=0;const n=()=>{f.textContent=T[i++%7].ic+" "+T[(i-1)%7].t.toUpperCase();f.animate([{transform:"rotateX(-90deg)",opacity:0},{transform:"none",opacity:1}],{duration:400,easing:"ease-out"})};n();setInterval(n,2000)});
// 16 Mission board
add("Missions with XP","Each alert is a \"mission\" worth points; finishing them levels up a bar. Gamified.",
`<div style="background:var(--card);border-radius:16px;padding:12px"><div style="display:flex;justify-content:space-between;font:800 12px system-ui;margin-bottom:6px"><span>🎯 Today's missions</span><span class="xp" style="color:var(--y)">0 / 70 XP</span></div><div style="height:8px;border-radius:4px;background:#26272c;overflow:hidden;margin-bottom:8px"><i class="xb" style="display:block;height:100%;width:0;background:linear-gradient(90deg,#ffc62b,#fb923c);transition:width .5s"></i></div>${T.map(x=>`<button class="ms" style="width:100%;border:0;background:#1d1e22;color:#fff;border-radius:10px;padding:8px;margin-top:5px;display:flex;align-items:center;gap:8px;text-align:left"><span style="font-size:15px">${x.ic}</span><span class="t1" style="flex:1">${x.t}</span><span style="font:900 11px system-ui;color:var(--y)">+10</span></button>`).join("")}</div>`,
el=>{let xp=0;el.querySelectorAll(".ms").forEach(b=>b.onclick=()=>{if(b.dataset.d)return;b.dataset.d=1;xp+=10;b.style.opacity=.4;b.lastChild.textContent="✓";el.querySelector(".xb").style.width=xp/70*100+"%";el.querySelector(".xp").textContent=xp+" / 70 XP"})});
// 17 Pull tab
add("Pull-down drawer","A small tab peeks out under the scoreboard with a count; pull it down to reveal the alerts.",
`<div style="background:var(--card);border-radius:14px;overflow:hidden"><div class="dw" style="max-height:0;overflow:hidden;transition:max-height .5s cubic-bezier(.3,1.2,.5,1)">${T.map(x=>`<div style="display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)">${row(x)}</div>`).join("")}</div><button class="pt" style="width:100%;border:0;background:#1d1e22;color:#c9cad0;font:800 11px system-ui;padding:6px;display:flex;justify-content:center;gap:6px;align-items:center"><span style="width:28px;height:4px;border-radius:2px;background:#55575c"></span>7 alerts<span style="width:28px;height:4px;border-radius:2px;background:#55575c"></span></button></div>`,
el=>{const d=el.querySelector(".dw");el.querySelector(".pt").onclick=()=>d.style.maxHeight=d.style.maxHeight&&d.style.maxHeight!=="0px"?"0px":"420px"});
// 18 Fan of cards
add("Hand of cards","Alerts fanned out like a hand of playing cards. Tap a card to pull it up.",
`<div class="fan" style="position:relative;height:150px;margin-top:10px">${T.map((x,i)=>{const a=(i-3)*9;return `<div class="fc" style="position:absolute;left:50%;bottom:0;width:96px;height:132px;margin-left:-48px;transform-origin:50% 140%;transform:rotate(${a}deg);background:linear-gradient(160deg,${x.c}40,#1b1c20 55%);border:1px solid ${x.c}66;border-radius:12px;padding:8px;font:800 10.5px/1.25 system-ui;transition:transform .35s;box-shadow:0 6px 16px rgba(0,0,0,.5)" data-a="${a}"><div style="font-size:22px">${x.ic}</div>${x.t}</div>`}).join("")}</div>`,
el=>{el.querySelectorAll(".fc").forEach(c=>c.onclick=()=>{el.querySelectorAll(".fc").forEach(o=>o.style.transform=`rotate(${o.dataset.a}deg)`);c.style.transform=`rotate(${c.dataset.a}deg) translateY(-26px)`})});
// 19 Radar
add("Radar sweep","A radar circle; each alert is a blip. The sweep lights them up as it passes. Tap a blip to read it.",
`<div style="display:flex;gap:12px;align-items:center"><div class="rd" style="position:relative;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,#0f2015 0,#0a120c 70%);border:1px solid #1f3a27;overflow:hidden;flex:none"><i style="position:absolute;inset:0;background:conic-gradient(from 0deg,rgba(74,222,128,.35),transparent 25%);animation:spin 3s linear infinite;border-radius:50%"></i>${T.map((x,i)=>{const a=i/7*Math.PI*2,r=20+((i*17)%40);return `<button class="bl" style="position:absolute;left:${65+Math.cos(a)*r-6}px;top:${65+Math.sin(a)*r-6}px;width:12px;height:12px;border-radius:50%;border:0;background:${x.c};box-shadow:0 0 8px ${x.c}" data-i="${i}"></button>`}).join("")}</div><div class="rt" style="font:700 13px/1.35 system-ui;color:#c9cad0">Tap a blip</div></div><style>@keyframes spin{to{transform:rotate(360deg)}}</style>`,
el=>{el.querySelectorAll(".bl").forEach(b=>b.onclick=()=>{const x=T[+b.dataset.i];el.querySelector(".rt").innerHTML=`${x.ic} <b>${x.t}</b><br><span class="t2">${x.s}</span><br><button class="go" style="margin-top:6px">${x.a}</button>`})});
// 20 Inbox zero
add("Inbox with swipe actions","Mail-app list. Swipe a row left to reveal Done / Snooze buttons.",
`<div style="background:var(--card);border-radius:14px;overflow:hidden">${T.map(x=>`<div class="ir" style="position:relative;overflow:hidden;border-bottom:1px solid var(--line)"><div style="position:absolute;right:0;top:0;bottom:0;display:flex"><span style="width:64px;background:#3b82f6;display:grid;place-items:center;font:800 11px system-ui">Snooze</span><span style="width:64px;background:#22c55e;display:grid;place-items:center;font:800 11px system-ui;color:#000">Done</span></div><div class="ifr" style="position:relative;background:var(--card);display:flex;gap:10px;align-items:center;padding:9px 12px;transition:transform .3s;touch-action:pan-y">${row(x,0)}<span style="width:8px;height:8px;border-radius:50%;background:var(--b)"></span></div></div>`).join("")}</div>`,
el=>{el.querySelectorAll(".ifr").forEach(f=>{let x0=null;f.onpointerdown=e=>x0=e.clientX;f.onpointerup=e=>{if(x0==null)return;const dx=e.clientX-x0;f.style.transform=dx<-20||Math.abs(dx)<5&&!f.dataset.o?"translateX(-128px)":"none";f.dataset.o=f.style.transform!=="none"?1:"";x0=null}})});
// 21 Spotlight hero
add("Hero + chips","The single most important alert as a big hero card with a glow; the rest as small chips below.",
`<div style="background:radial-gradient(120% 100% at 0 0,rgba(248,113,113,.3),#17181b 60%);border:1px solid rgba(248,113,113,.5);border-radius:18px;padding:14px;box-shadow:0 0 24px rgba(248,113,113,.2)"><div style="font:900 10px system-ui;letter-spacing:.1em;color:#f87171">MOST URGENT</div><div style="display:flex;gap:10px;align-items:center;margin-top:6px">${row(T[5])}</div></div><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">${T.filter((x,i)=>i!==5).map(x=>`<span style="display:inline-flex;gap:5px;align-items:center;background:#1b1c20;border:1px solid #2a2b30;border-radius:999px;padding:5px 9px;font:700 11px system-ui">${x.ic} ${x.a}</span>`).join("")}</div>`);
// 22 Stack that auto-cycles
add("Auto-cycling stack","A 3-card stack that shuffles every few seconds: the top card slides to the back. No tapping needed.",
`<div class="cs" style="position:relative;height:96px"></div>`,
el=>{const s=el.querySelector(".cs");let k=0;const draw=()=>{s.innerHTML=[0,1,2].map(j=>{const x=T[(k+j)%7];return `<div style="position:absolute;left:0;right:0;top:0;background:#1b1c20;border:1px solid #2a2b30;border-radius:14px;padding:10px;display:flex;align-items:center;gap:10px;z-index:${10-j};transform:translateY(${j*9}px) scale(${1-j*.05});opacity:${1-j*.25};transition:all .5s">${row(x)}</div>`}).join("")};draw();setInterval(()=>{const top=s.firstChild;top.animate([{transform:"none"},{transform:"translateY(-30px) scale(.9)",opacity:0}],{duration:400,fill:"forwards"}).onfinish=()=>{k++;draw();s.firstChild.animate([{transform:"translateY(9px) scale(.95)"},{transform:"none"}],{duration:300})}},2400)});
// 23 Icons row with badges
add("Icon dock","A row of icons like an app dock, each with a red badge. Tap one to see the alert below it.",
`<div style="display:flex;justify-content:space-between;background:rgba(255,255,255,.05);border-radius:20px;padding:10px">${T.map((x,i)=>`<button class="dk" style="position:relative;border:0;width:42px;height:42px;border-radius:12px;background:${x.c}2a;font-size:20px;transition:transform .2s" data-i="${i}">${x.ic}<span style="position:absolute;top:-4px;right:-4px;width:16px;height:16px;border-radius:50%;background:#ef4444;color:#fff;font:900 9px/16px system-ui">1</span></button>`).join("")}</div><div class="dkt" style="margin-top:8px;background:var(--card);border-radius:12px;padding:10px;display:flex;gap:10px;align-items:center">${row(T[0])}</div>`,
el=>{el.querySelectorAll(".dk").forEach(b=>b.onclick=()=>{el.querySelectorAll(".dk").forEach(o=>o.style.transform="");b.style.transform="translateY(-6px) scale(1.15)";const t=el.querySelector(".dkt");t.innerHTML=row(T[+b.dataset.i]);t.animate([{opacity:0},{opacity:1}],{duration:200})})});
// 24 Before tip-off countdown
add("Before tip-off","A countdown to tonight's first game with the to-dos that must be done before it.",
`<div style="background:linear-gradient(135deg,#1f1a0a,#141518);border:1px solid #4a3a10;border-radius:16px;padding:12px"><div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font:900 11px system-ui;letter-spacing:.1em;color:var(--y)">FIRST TIP-OFF IN</span><span class="cd" style="font:900 22px ui-monospace,monospace;color:#fff">04:12:09</span></div>${T.filter(x=>x.pri===1).map(x=>`<div style="display:flex;gap:10px;align-items:center;padding:6px 0;border-top:1px solid #2a2b30;margin-top:4px">${row(x)}</div>`).join("")}</div>`,
el=>{let s=4*3600+12*60+9;setInterval(()=>{s--;el.querySelector(".cd").textContent=[s/3600|0,(s%3600)/60|0,s%60].map(v=>String(v).padStart(2,"0")).join(":")},1000)});
// 25 Kanban
add("Mini kanban","Three tiny columns (To do / Waiting / Done). Tap a card to move it along.",
`<div class="kb" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px">${["TO DO","WAITING","DONE"].map((l,c)=>`<div class="kc" data-c="${c}" style="background:var(--card);border-radius:12px;padding:6px;min-height:150px"><div style="font:900 9px system-ui;letter-spacing:.1em;color:var(--sub);margin-bottom:4px">${l}</div>${c===0?T.slice(0,5).map(x=>`<button class="kk" style="width:100%;border:0;text-align:left;background:#1d1e22;color:#fff;border-radius:8px;padding:6px;margin-top:4px;font:700 10px/1.25 system-ui;border-left:3px solid ${x.c}">${x.ic} ${x.a}</button>`).join(""):""}</div>`).join("")}</div>`,
el=>{const cols=el.querySelectorAll(".kc");el.addEventListener("click",e=>{const k=e.target.closest(".kk");if(!k)return;const c=+k.parentNode.dataset.c;if(c<2){cols[c+1].append(k);k.animate([{transform:"scale(.8)",opacity:0},{transform:"none",opacity:1}],{duration:250})}})});
// 26 Glass toast
add("Toast pop-ups","Alerts pop in one by one at the top as glass toasts, then tuck into a small pile.",
`<div class="tp" style="position:relative;height:150px;background:var(--card);border-radius:16px;overflow:hidden"></div>`,
el=>{const p=el.querySelector(".tp");let i=0;setInterval(()=>{const x=T[i++%7];const t=document.createElement("div");t.style.cssText="position:absolute;left:8px;right:8px;top:8px;background:rgba(40,41,46,.85);backdrop-filter:blur(8px);border:1px solid #3a3b40;border-radius:14px;padding:8px;display:flex;gap:8px;align-items:center;transition:all .5s";t.innerHTML=row(x);p.querySelectorAll("div[style*=absolute]").forEach((o,k,arr)=>{const d=arr.length-k;o.style.transform=`translateY(${d*62}px) scale(${1-d*.05})`;o.style.opacity=d>1?0:.6});p.append(t);t.animate([{transform:"translateY(-80px)"},{transform:"none"}],{duration:450,easing:"cubic-bezier(.3,1.4,.5,1)"});const all=p.querySelectorAll("div[style*=absolute]");if(all.length>3)all[0].remove()},1800)});
// 27 Matchup-linked
add("Inside the scoreboard","No separate panel: alerts live as small icons right on the scoreboard card's bottom edge.",
`<div style="background:var(--card);border-radius:16px;padding:12px 12px 0;overflow:hidden"><div style="display:flex;align-items:center;gap:10px;font:700 13px system-ui"><span>Mastika</span><b style="font:900 26px system-ui">6</b><span style="margin:0 auto;color:var(--g);font-size:12px">73%</span><b style="font:900 26px system-ui">3</b><span>LeTakim</span></div><div style="display:flex;gap:4px;margin:10px -12px 0;padding:8px 12px;background:#1b1c20;border-top:1px solid #26272c;overflow-x:auto;scrollbar-width:none">${T.map(x=>`<span style="flex:none;display:inline-flex;align-items:center;gap:4px;background:${x.c}22;color:${x.c};border-radius:999px;padding:4px 8px;font:800 10.5px system-ui">${x.ic} ${x.a}</span>`).join("")}</div></div>`);
// 28 Morning brief
add("Morning brief","A newspaper-style mini front page: headline + 3 bullet stories + \"also\" list.",
`<div style="background:#f3efe4;color:#1b1b1b;border-radius:10px;padding:12px;font-family:Georgia,serif"><div style="display:flex;justify-content:space-between;border-bottom:2px solid #1b1b1b;padding-bottom:4px;font:900 10px system-ui;letter-spacing:.12em"><span>THE MASTIKA TIMES</span><span>THU NOV 5</span></div><div style="font:900 20px/1.1 Georgia,serif;margin:8px 0 4px">Maxey ruled out; IR move needed</div><div style="font:13px/1.35 Georgia,serif">Embiid returns from IR, and Buzelis hits waivers.</div><div style="border-top:1px solid #1b1b1b;margin-top:8px;padding-top:6px;font:700 11px system-ui;display:flex;flex-wrap:wrap;gap:4px 12px">${T.map(x=>`<span>${x.ic} ${x.a}</span>`).join("")}</div></div>`);
// 29 Particle bell
add("Bell that rings","A bell icon swings and sprinkles particles whenever there's something new; tap it for the sheet.",
`<div style="display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:10px 12px"><button class="bell" style="position:relative;border:0;background:#1d1e22;width:44px;height:44px;border-radius:12px;font-size:22px">🔔<span style="position:absolute;top:-4px;right:-4px;background:#ef4444;color:#fff;border-radius:999px;font:900 10px system-ui;padding:2px 6px">7</span></button><div><div class="t1">7 new things</div><div class="t2">Maxey OUT · Embiid back · Buzelis dropped…</div></div></div><div class="bs" style="display:none;margin-top:8px;background:#1b1c20;border-radius:14px;padding:6px 10px">${T.map(x=>`<div style="display:flex;gap:10px;align-items:center;padding:6px 0">${row(x)}</div>`).join("")}</div>`,
el=>{const b=el.querySelector(".bell");setInterval(()=>{b.animate([{transform:"rotate(0)"},{transform:"rotate(18deg)"},{transform:"rotate(-14deg)"},{transform:"rotate(8deg)"},{transform:"rotate(0)"}],{duration:700});for(let k=0;k<8;k++){const d=document.createElement("i");d.style.cssText="position:absolute;left:20px;top:10px;width:4px;height:4px;border-radius:50%;background:#ffc62b";b.append(d);const a=Math.random()*Math.PI*2;d.animate([{transform:"none",opacity:1},{transform:`translate(${Math.cos(a)*30}px,${Math.sin(a)*30}px)`,opacity:0}],{duration:700}).onfinish=()=>d.remove()}},3000);b.onclick=()=>{const s=el.querySelector(".bs");s.style.display=s.style.display==="none"?"block":"none"}});
// 30 Holographic cards
add("Holo cards","Each alert card has a holographic shine that follows your finger, like a rare trading card.",
`<div style="display:flex;flex-direction:column;gap:6px">${T.slice(0,4).map(x=>`<div class="ho" style="position:relative;overflow:hidden;background:#17181b;border:1px solid #2a2b30;border-radius:14px;padding:10px;display:flex;gap:10px;align-items:center">${row(x)}<i style="position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at var(--x,30%) var(--y,30%),rgba(255,255,255,.18),transparent 40%),linear-gradient(115deg,transparent 30%,rgba(255,198,43,.12),rgba(196,167,255,.12),rgba(96,165,250,.12),transparent 70%);mix-blend-mode:screen"></i></div>`).join("")}</div>`,
el=>{el.querySelectorAll(".ho").forEach(h=>{h.onpointermove=e=>{const r=h.getBoundingClientRect();h.lastChild.style.setProperty("--x",(e.clientX-r.left)+"px");h.lastChild.style.setProperty("--y",(e.clientY-r.top)+"px");h.style.transform=`perspective(500px) rotateY(${(e.clientX-r.left-r.width/2)/30}deg)`};h.onpointerleave=()=>h.style.transform=""})});
document.getElementById("o").innerHTML=O.map((x,i)=>`<div class="o"><div class="oh"><b>${i+1}</b>${x.n}<span class="od">${x.d}</span></div>${SB}<div class="dm" data-i="${i}">${x.h}</div></div>`).join("");
document.querySelectorAll(".dm").forEach(d=>{const x=O[+d.dataset.i];if(x.js)try{x.js(d)}catch(e){console.error(e)}});
</script></body></html>
