<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>News on Home · 25</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700;900&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#141517;color:#fff;font-family:-apple-system,system-ui,sans-serif}h1{font:900 22px "Roboto Condensed";margin:18px 16px 2px}p.i{margin:0 16px 14px;color:#9a9ca2;font-size:13px;max-width:780px}
.grid{display:flex;flex-wrap:wrap;gap:22px;padding:0 16px 40px;align-items:flex-start}.card{width:362px}.num{font:900 12px "Roboto Condensed";color:#ffc62b}.ttl{font:800 15px system-ui;margin:2px 0}.ds{font-size:12px;color:#9a9ca2;min-height:46px;margin-bottom:8px}
.scr{background:#0b0b0d;border-radius:20px;padding:12px 10px;box-shadow:0 0 0 1px #2a2b30}.pan{background:#202124;border-radius:14px;padding:12px}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.hd b{font:800 13px "Roboto Condensed";text-transform:uppercase;letter-spacing:.4px}.hd span{font:600 11.5px system-ui;color:#8e9096}
.seg{display:flex;background:#141518;border-radius:999px;padding:2px}.seg i{font:700 10.5px system-ui;font-style:normal;padding:3px 9px;border-radius:999px;color:#8e9096;cursor:pointer}.seg i.on{background:#ffc62b;color:#111}
.av{flex:none;border-radius:50%;overflow:hidden;background:#2a2b30;display:inline-block}.av img{width:100%;height:100%;object-fit:cover;object-position:50% 12%}
.tg{font:800 9px system-ui;letter-spacing:.04em;border-radius:4px;padding:1px 5px;font-style:normal}.out{background:#ff5f5f;color:#111}.gtd{background:#ffb347;color:#111}.up{background:#3fbf6f;color:#111}.tr{background:#4aa8ff;color:#111}
.r{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid #2a2b30}.r:first-of-type{border-top:0}.r .m{flex:1;min-width:0}.r b{display:block;font:700 12.5px/1.25 system-ui}.r small{display:block;font:500 10.5px system-ui;color:#8e9096;margin-top:2px}
.th{flex:none;width:64px;height:48px;border-radius:8px;background:#2a2b30 center/cover;position:relative;overflow:hidden}
.more{display:block;text-align:center;font:700 12px system-ui;color:#ffc62b;margin-top:8px}
svg{display:block}
</style></head><body>
<h1>News on Home · 25 ideas</h1><p class="i">A news panel on Home, like the NBA News page, in 25 forms. Some show only your team, some switch between My team / League / NBA, some are league-wide. The headlines are samples to show the layout; the real panel would pull the same ESPN feed as the News page.</p>
<div class="grid" id="g"></div>
<script>
const ph=id=>`https://a.espncdn.com/combiner/i?img=/i/headshots/nba/players/full/${id}.png&w=260&h=190`;
const N=[
{p:"Tyrese Maxey",id:"4431678",t:"PHI",h:"Maxey plays 42 minutes again as 76ers lean on him",tag:["up","USAGE ↑"],src:"ESPN",ago:"2h",mine:1,imp:"+ Value"},
{p:"Joel Embiid",id:"3059318",t:"PHI",h:"Embiid listed questionable for Friday (knee management)",tag:["gtd","GTD"],src:"ESPN",ago:"3h",mine:1,imp:"Watch"},
{p:"James Harden",id:"3992",t:"CLE",h:"Harden coming off the bench in new Cavs rotation",tag:["tr","ROLE"],src:"The Athletic",ago:"5h",mine:1,imp:"− Minutes"},
{p:"Jayson Tatum",id:"4065648",t:"BOS",h:"Tatum out at least two weeks with ankle sprain",tag:["out","OUT"],src:"ESPN",ago:"6h",mine:1,imp:"− Value"},
{p:"Austin Reaves",id:"4066457",t:"LAL",h:"Reaves's usage climbs with Luka sidelined",tag:["up","UP"],src:"ESPN",ago:"8h",mine:1,imp:"+ Value"},
{p:"Victor Wembanyama",id:"5104157",t:"SA",h:"Wembanyama posts 36 and 14 in Spurs win",tag:["up","HOT"],src:"ESPN",ago:"9h",mine:0,imp:"League"}];
const M=N.filter(n=>n.mine),av=(n,s=34)=>`<span class="av" style="width:${s}px;height:${s}px"><img src="${ph(n.id)}" onerror="this.remove()"></span>`;
const tag=n=>`<i class="tg ${n.tag[0]}">${n.tag[1]}</i>`;
const row=n=>`<div class="r">${av(n)}<div class="m"><b>${n.h}</b><small>${n.src} · ${n.ago}</small></div>${tag(n)}</div>`;
const I=[];const add=(n,w,h)=>I.push({n,w,h});
const sw=`<span class="seg"><i class="on">My team</i><i>League</i><i>NBA</i></span>`;
add("Classic list + switch","Photo, headline, source and a status tag. Switch between My team / League / NBA.",`<div class="pan"><div class="hd"><b>News</b>${sw}</div>${M.slice(0,3).map(row).join("")}<span class="more">All news ›</span></div>`);
add("Hero + list","The biggest story for your team gets a hero card with the photo. Two short rows below.",`<div class="pan"><div class="hd"><b>Your team news</b><span>4 new</span></div><div style="position:relative;height:140px;border-radius:12px;overflow:hidden;background:linear-gradient(120deg,#5a1a1a,#202124)"><img src="${ph(M[3].id)}" style="position:absolute;right:-10px;bottom:0;height:140px" onerror="this.remove()"><div style="position:absolute;left:12px;bottom:12px;right:120px">${tag(M[3])}<b style="display:block;font:900 17px/1.1 'Roboto Condensed';margin-top:6px">${M[3].h}</b><small style="font:500 10px system-ui;color:#c9cacf">${M[3].src} · ${M[3].ago}</small></div></div>${M.slice(0,2).map(row).join("")}</div>`);
add("Swipe cards","Sideways cards with a big photo. Swipe through the day's stories.",`<div class="pan"><div class="hd"><b>News</b><span>Swipe →</span></div><div style="display:flex;gap:8px;overflow:hidden">${M.map(n=>`<div style="flex:none;width:150px;border-radius:12px;background:#17181b;overflow:hidden"><div style="height:80px;background:#2a2b30;position:relative">${`<img src="${ph(n.id)}" style="position:absolute;left:50%;transform:translateX(-50%);bottom:0;height:80px" onerror="this.remove()">`}<span style="position:absolute;left:6px;top:6px">${tag(n)}</span></div><div style="padding:8px"><b style="display:block;font:700 12px/1.25 system-ui">${n.h}</b><small style="font:500 10px system-ui;color:#8e9096">${n.ago}</small></div></div>`).join("")}</div></div>`);
add("Fantasy impact rows","Every story shows what it means for you: + Value, − Minutes, Watch.",`<div class="pan"><div class="hd"><b>What changed for your team</b></div>${M.map(n=>`<div class="r">${av(n)}<div class="m"><b>${n.h}</b><small>${n.ago}</small></div><span style="font:800 10.5px system-ui;color:${n.imp[0]==="+"?"#3fbf6f":n.imp[0]==="−"?"#ff6b62":"#ffb347"}">${n.imp}</span></div>`).join("")}</div>`);
add("Ticker strip","A thin scrolling ticker of your team's headlines. Tap to open.",`<div class="pan" style="padding:0;overflow:hidden"><div style="display:flex;align-items:center;height:38px"><span style="flex:none;background:#ffc62b;color:#111;font:900 10px system-ui;padding:4px 8px;margin:0 8px 0 10px;border-radius:4px">NEWS</span><div style="overflow:hidden;flex:1"><div style="display:flex;gap:24px;white-space:nowrap;animation:tk 18s linear infinite;width:max-content;font:600 12px system-ui">${[...M,...M].map(n=>`<span><b style="color:#ffc62b">${n.p.split(" ").pop()}</b> ${n.h}</span>`).join("")}</div></div></div></div><style>@keyframes tk{to{transform:translateX(-50%)}}</style>`);
add("Three tabs","Tabs for My team / League / NBA sit as underlined tabs, like the app's top nav.",`<div class="pan"><div style="display:flex;gap:16px;font:800 12px system-ui;color:#8e9096;border-bottom:1px solid #2a2b30;margin-bottom:6px"><span style="color:#fff;box-shadow:inset 0 -2px #ffc62b;padding-bottom:6px">My team</span><span>League</span><span>NBA</span></div>${M.slice(0,3).map(row).join("")}</div>`);
add("Injuries first","Injury and status news always on top with red/orange tags. Everything else below.",`<div class="pan"><div class="hd"><b>Status updates</b><span>Your team</span></div><div style="display:flex;gap:6px;margin-bottom:8px">${M.filter(n=>["out","gtd"].includes(n.tag[0])).map(n=>`<div style="flex:1;display:flex;gap:8px;align-items:center;padding:8px;border-radius:10px;background:#17181b;box-shadow:inset 3px 0 ${n.tag[0]==="out"?"#ff5f5f":"#ffb347"}">${av(n,30)}<div><b style="display:block;font:800 12px system-ui">${n.p.split(" ").pop()}</b>${tag(n)}</div></div>`).join("")}</div>${M.filter(n=>!["out","gtd"].includes(n.tag[0])).map(row).join("")}</div>`);
add("Timeline","A vertical timeline of the day: newest at the top, with times on the left.",`<div class="pan"><div class="hd"><b>Today</b><span>Your team</span></div>${M.map(n=>`<div style="display:grid;grid-template-columns:36px 14px 1fr;gap:6px;align-items:start;padding:5px 0"><small style="font:700 10px system-ui;color:#8e9096;text-align:right">${n.ago}</small><span style="position:relative;height:100%"><i style="position:absolute;left:4px;top:3px;width:7px;height:7px;border-radius:50%;background:#ffc62b"></i><i style="position:absolute;left:7px;top:12px;bottom:-12px;width:1px;background:#3a3b40"></i></span><div><b style="font:700 12px/1.25 system-ui">${n.h}</b></div></div>`).join("")}</div>`);
add("Notification stack","Stacked like iPhone notifications, with the newest on top and the rest peeking behind.",`<div class="pan" style="padding:14px 12px 22px"><div style="position:relative"><div style="position:relative;z-index:3;display:flex;gap:10px;align-items:center;padding:10px;border-radius:14px;background:#2e3036">${av(M[0],36)}<div style="flex:1"><b style="display:flex;justify-content:space-between;font:700 12.5px system-ui">${M[0].p}<small style="color:#8e9096;font:500 10px system-ui">${M[0].ago}</small></b><small style="font:500 11.5px system-ui;color:#ddd">${M[0].h}</small></div></div><div style="position:absolute;left:8px;right:8px;bottom:-8px;height:20px;border-radius:0 0 12px 12px;background:#26282d;z-index:2"></div><div style="position:absolute;left:16px;right:16px;bottom:-15px;height:20px;border-radius:0 0 12px 12px;background:#1f2125;z-index:1"></div></div></div>`);
add("Morning briefing","Three short bullet lines written for you, with no photos. Reads in five seconds.",`<div class="pan"><div class="hd"><b>Your briefing</b><span>Fri, Oct 30</span></div>${M.slice(0,4).map(n=>`<div style="display:flex;gap:8px;padding:5px 0;font:600 12.5px/1.35 system-ui"><span style="color:#ffc62b">•</span><span><b style="font-weight:800">${n.p.split(" ").pop()}:</b> ${n.h.replace(n.p.split(" ").pop(),"").trim()}</span></div>`).join("")}</div>`);
add("2×2 tiles","Four square tiles, each with a photo, tag and short headline.",`<div class="pan"><div class="hd"><b>News</b>${sw}</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">${M.slice(0,4).map(n=>`<div style="height:110px;border-radius:12px;background:#17181b;position:relative;overflow:hidden;padding:8px"><img src="${ph(n.id)}" style="position:absolute;right:-8px;bottom:0;height:70px;opacity:.85" onerror="this.remove()">${tag(n)}<b style="position:absolute;left:8px;bottom:8px;right:50px;font:800 11px/1.2 system-ui">${n.h.split(" ").slice(0,6).join(" ")}…</b></div>`).join("")}</div></div>`);
add("Player filter chips","A row of your players' faces on top. Tap a face to see only that player's news.",`<div class="pan"><div class="hd"><b>News</b><span>Tap a player</span></div><div style="display:flex;gap:8px;margin-bottom:8px">${M.map((n,i)=>`<span style="text-align:center">${`<span class="av" style="width:40px;height:40px;box-shadow:0 0 0 2px ${i===0?"#ffc62b":"#3a3b40"}"><img src="${ph(n.id)}" onerror="this.remove()"></span>`}<small style="display:block;font:700 9.5px system-ui;color:#c9cacf">${n.p.split(" ").pop()}</small></span>`).join("")}</div>${row(M[0])}</div>`);
add("Impact meter","Each story gets a small meter from \"hurts\" to \"helps\" your fantasy value.",`<div class="pan"><div class="hd"><b>Impact news</b></div>${M.map(n=>{const v={"+":.8,"−":.2,"W":.5}[n.imp[0]]||.5;return `<div class="r">${av(n,30)}<div class="m"><b>${n.h}</b><span style="display:block;height:4px;border-radius:2px;background:linear-gradient(90deg,#ff6b62,#ffb347,#3fbf6f);margin-top:5px;position:relative"><i style="position:absolute;left:${v*100}%;top:-3px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px #202124"></i></span></div></div>`}).join("")}</div>`);
add("Newspaper front page","A morning paper: one big headline and two columns of small ones.",`<div class="pan" style="background:#efe9dc;color:#111"><div style="font:900 15px Georgia,serif;border-bottom:2px solid #111;padding-bottom:3px;display:flex;justify-content:space-between">THE MASTIKA TIMES<small style="font:italic 10px Georgia">Fri, Oct 30</small></div><b style="display:block;font:900 20px/1.05 Georgia,serif;margin:6px 0">${M[3].h}</b><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;border-top:1px solid #111;padding-top:5px">${M.slice(0,2).map(n=>`<b style="font:700 11.5px/1.2 Georgia,serif">${n.h}</b>`).join("")}</div></div>`);
add("Auto carousel","One big story at a time that rotates every few seconds, with dots underneath.",`<div class="pan"><div style="position:relative;height:120px;border-radius:12px;overflow:hidden;background:linear-gradient(120deg,#16304f,#202124)"><img src="${ph(M[0].id)}" style="position:absolute;right:-6px;bottom:0;height:120px" onerror="this.remove()"><div style="position:absolute;left:12px;top:12px;right:120px">${tag(M[0])}<b style="display:block;font:900 16px/1.1 'Roboto Condensed';margin-top:6px">${M[0].h}</b></div></div><div style="display:flex;gap:4px;justify-content:center;margin-top:8px">${M.map((n,i)=>`<i style="width:${i?6:16}px;height:6px;border-radius:3px;background:${i?"#555":"#fff"}"></i>`).join("")}</div></div>`);
add("Collapsed count","Closed: \"3 updates on your team ⌄\" with tiny avatars. Opens into the list.",`<div class="pan"><div style="display:flex;align-items:center;gap:8px"><span style="display:flex">${M.slice(0,3).map((n,i)=>`<span class="av" style="width:24px;height:24px;margin-left:${i?-8:0}px;box-shadow:0 0 0 2px #202124"><img src="${ph(n.id)}" onerror="this.remove()"></span>`).join("")}</span><b style="font:700 12.5px system-ui;flex:1">3 updates on your team</b><span style="color:#8e9096">⌄</span></div></div>`);
add("Badges on your roster","Your roster's faces in a row, each with a red news count. Tap one to read.",`<div class="pan"><div class="hd"><b>Roster news</b></div><div style="display:flex;justify-content:space-between">${M.map((n,i)=>`<span style="position:relative;text-align:center">${av(n,44)}${[1,2,1,1,0][i]?`<em style="position:absolute;right:-4px;top:-4px;background:#ff3b4e;font:900 10px system-ui;font-style:normal;border-radius:9px;padding:1px 6px;border:2px solid #202124">${[1,2,1,1][i]}</em>`:""}<small style="display:block;font:700 9.5px system-ui;color:#c9cacf;margin-top:3px">${n.p.split(" ").pop()}</small></span>`).join("")}</div></div>`);
add("You vs opponent","Two columns: news for your team on the left, your opponent's on the right.",`<div class="pan"><div class="hd"><b>Matchup news</b><span>vs Dimes Square</span></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">${[M.slice(0,2),[N[5],M[4]]].map((L,j)=>`<div><small style="font:900 9.5px system-ui;color:${j?"#4aa8ff":"#ffc62b"};letter-spacing:.08em">${j?"THEM":"YOU"}</small>${L.map(n=>`<div style="display:flex;gap:6px;padding:6px 0;border-top:1px solid #2a2b30">${av(n,24)}<b style="font:700 11px/1.25 system-ui">${n.h}</b></div>`).join("")}</div>`).join("")}</div></div>`);
add("Severity bars","A colored bar on the left of each row: red = bad, orange = watch, green = good.",`<div class="pan"><div class="hd"><b>News</b>${sw}</div>${M.map(n=>`<div style="display:flex;gap:10px;padding:8px 10px;margin-bottom:5px;border-radius:10px;background:#17181b;box-shadow:inset 3px 0 ${n.imp[0]==="+"?"#3fbf6f":n.imp[0]==="−"?"#ff6b62":"#ffb347"}"><div class="m"><b style="font:700 12px/1.25 system-ui">${n.h}</b><small style="font:500 10px system-ui;color:#8e9096">${n.src} · ${n.ago}</small></div></div>`).join("")}</div>`);
add("Social post cards","Formatted like posts from beat reporters, with handle, time and text.",`<div class="pan"><div class="hd"><b>From the beat</b></div>${M.slice(0,2).map(n=>`<div style="padding:9px;border-radius:12px;background:#17181b;margin-bottom:6px"><div style="display:flex;gap:8px;align-items:center"><span class="av" style="width:26px;height:26px;background:#4aa8ff;display:grid;place-items:center;font:900 10px system-ui">${n.src[0]}</span><b style="font:800 11.5px system-ui">${n.src} NBA</b><small style="font:500 10px system-ui;color:#8e9096">· ${n.ago}</small></div><p style="margin:6px 0 0;font:500 12px/1.35 system-ui">${n.h}.</p></div>`).join("")}</div>`);
add("Since you last looked","A digest headline (\"4 things changed since last night\") then the list.",`<div class="pan"><div style="font:900 20px/1.05 'Roboto Condensed';margin-bottom:2px"><span style="color:#ffc62b">4 things</span> changed since last night</div><small style="font:500 11px system-ui;color:#8e9096">Your team · tap any to read</small>${M.map(n=>`<div class="r" style="padding:6px 0">${tag(n)}<div class="m"><b style="font-size:12px">${n.h}</b></div></div>`).join("")}</div>`);
add("Category chips","Filter chips by type: All · Injuries · Roles · Trades · Hot.",`<div class="pan"><div class="hd"><b>News</b></div><div style="display:flex;gap:5px;margin-bottom:6px">${["All","Injuries","Roles","Trades","Hot"].map((c,i)=>`<span style="font:700 11px system-ui;padding:4px 10px;border-radius:999px;background:${i?"#17181b":"#ffc62b"};color:${i?"#c9cacf":"#111"}">${c}</span>`).join("")}</div>${M.slice(0,3).map(row).join("")}</div>`);
add("Video thumbnails","Wide thumbnails with a play button, like highlight clips.",`<div class="pan"><div class="hd"><b>Highlights & news</b></div><div style="display:flex;gap:8px;overflow:hidden">${M.slice(0,3).map(n=>`<div style="flex:none;width:170px"><div style="height:96px;border-radius:10px;background:#2a2b30;position:relative;overflow:hidden"><img src="${ph(n.id)}" style="position:absolute;left:50%;transform:translateX(-50%);bottom:0;height:96px" onerror="this.remove()"><span style="position:absolute;left:8px;bottom:8px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.65);display:grid;place-items:center;font-size:10px">▶</span></div><b style="display:block;font:700 11.5px/1.25 system-ui;margin-top:5px">${n.h}</b></div>`).join("")}</div></div>`);
add("Text only","The quietest option: plain headlines with a source, no photos or tags.",`<div class="pan"><div class="hd"><b>News</b>${sw}</div>${M.map(n=>`<div style="padding:7px 0;border-top:1px solid #2a2b30"><b style="font:600 12.5px/1.3 system-ui">${n.h}</b><small style="display:block;font:500 10px system-ui;color:#8e9096;margin-top:2px">${n.src} · ${n.ago}</small></div>`).join("")}</div>`);
add("Swipe deck","One story card at a time, stacked. Swipe it away to see the next.",`<div class="pan"><div class="hd"><b>News</b><span>1 / 5</span></div><div style="position:relative;height:150px">${M.slice(0,3).reverse().map((n,i)=>`<div style="position:absolute;inset:${(2-i)*6}px ${(2-i)*8}px auto;height:130px;border-radius:14px;background:${i===2?"linear-gradient(120deg,#2b1a4a,#17181b)":"#1b1c20"};box-shadow:0 6px 14px rgba(0,0,0,.4);overflow:hidden;padding:12px;opacity:${.5+i*.25}">${i===2?`<img src="${ph(n.id)}" style="position:absolute;right:-6px;bottom:0;height:110px" onerror="this.remove()">${tag(n)}<b style="display:block;font:900 16px/1.1 'Roboto Condensed';margin-top:6px;max-width:170px">${n.h}</b>`:""}</div>`).join("")}</div></div>`);
document.getElementById("g").innerHTML=I.map((x,k)=>`<div class="card"><div class="num">#${k+1}</div><div class="ttl">${x.n}</div><div class="ds">${x.w}</div><div class="scr">${x.h}</div></div>`).join("");
</script></body></html>
