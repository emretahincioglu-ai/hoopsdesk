<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tutorial Animations</title>
<style>
:root{color-scheme:dark;--y:#ffc62b;--sub:#8e9096}*{box-sizing:border-box}body{margin:0;background:#000;color:#f2f3f5;font:14px -apple-system,system-ui,sans-serif}
.w{max-width:460px;margin:0 auto;padding:16px 12px 80px}h1{font:800 22px system-ui;margin:4px}.ld{color:var(--sub);font-size:13px;margin:0 4px 6px;line-height:1.4}
.sec{font:800 12px system-ui;letter-spacing:.1em;color:var(--y);margin:26px 4px 0}
.o{margin:18px 0 0}.oh{margin:0 4px 8px;font:700 15px system-ui}.oh b{color:var(--y);margin-right:6px}.od{display:block;color:var(--sub);font:500 12px/1.35 system-ui;margin-top:2px}
.ph{position:relative;height:260px;border-radius:22px;background:#0d0e10;border:1px solid #1d1e22;overflow:hidden;perspective:900px}
.pg{position:absolute;inset:0;padding:12px;display:flex;flex-direction:column;gap:8px;transition:none}
.top{height:16px;border-radius:5px;background:#17181b;width:45%}
.b{border-radius:12px;background:#17181b;position:relative}.b1{height:58px}.b2{height:26px}.b3{height:70px}.b4{height:40px}
.pg.alt .b1{background:#1a1626}.pg.alt .b3{background:#141d26}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.66);pointer-events:none}
.hole{position:absolute;border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.66);outline:2px solid var(--y);outline-offset:2px;transition:all .45s cubic-bezier(.25,.8,.25,1)}
.cap{position:absolute;left:10px;right:10px;background:#1d1e22;border:1px solid #2e2f35;border-radius:12px;padding:8px 10px;font:600 11px/1.3 system-ui;color:#d4d5da;transition:all .45s cubic-bezier(.25,.8,.25,1)}
.cap b{display:block;color:#fff;font:800 12px system-ui;margin-bottom:2px}.cap i{font-style:normal;color:var(--y);font:800 9px system-ui;letter-spacing:.08em}
.lbl{position:absolute;right:10px;top:8px;font:800 9px system-ui;color:#55575c;letter-spacing:.1em}
@keyframes fade{from{opacity:0}to{opacity:1}}
</style></head><body><div class="w">
<h1>Tutorial animation · 30 ideas</h1>
<p class="ld">Every demo loops by itself: 3 steps on a page, then it jumps to the next page and keeps going. Tap a demo to restart it. The ones marked <b style="color:var(--y)">⚡ light</b> are the cheapest on battery.</p>
<div id="o"></div></div>
<script>
const P=(alt)=>`<div class="pg${alt?" alt":""}"><div class="top"></div><div class="b b1"></div><div class="b b2"></div><div class="b b3"></div><div class="b b4"></div><span class="lbl">${alt?"MATCHUP":"HOME"}</span></div>`;
const STEPS=[[0,".b1","Matchup card","Your chance to win the week."],[0,".b2","Category chips","Yellow = still in play."],[0,".b3","Last night","Your best players last night."],[1,".b1","Win chance","Plays the week out 4,000 times."],[1,".b3","Category table","The % counts games left."]];
const O=[];const add=(sec,n,d,fx,light)=>O.push({sec,n,d,fx,light});
/* fx(ctx): ctx={ph,step,prev,rect,cap,hole,pages,goPage(i,dir),el} implemented per option */
const base=(cfg)=>cfg; // marker
// helpers to build effects
const E={
 move:(ph,hole,r)=>{Object.assign(hole.style,{left:r.left-4+"px",top:r.top-4+"px",width:r.width+8+"px",height:r.height+8+"px"})},
 capAt:(cap,r,ph)=>{const below=r.top+r.height+10;if(below+62<ph.clientHeight){cap.style.top=below+"px";cap.style.bottom="auto"}else{cap.style.top="auto";cap.style.bottom=(ph.clientHeight-r.top+10)+"px"}},
};
function run(box,opt){box.innerHTML=`<div class="ph"></div>`;const ph=box.firstChild;ph.innerHTML=P(0)+P(1);const pages=[...ph.querySelectorAll(".pg")];pages[1].style.visibility="hidden";
 const st={ph,pages,cur:0,i:-1,t:null};const hole=document.createElement("div");hole.className="hole";const cap=document.createElement("div");cap.className="cap";ph.append(hole,cap);st.hole=hole;st.cap=cap;
 const rectOf=(sel,pi)=>{const e=pages[pi].querySelector(sel),a=e.getBoundingClientRect(),b=ph.getBoundingClientRect();return{left:a.left-b.left,top:a.top-b.top,width:a.width,height:a.height,el:e}};
 const tick=()=>{st.i=(st.i+1)%STEPS.length;const [pi,sel,t,p]=STEPS[st.i];const r=rectOf(sel,pi);const txt=`<i>${STEPS.filter(s=>s[0]===pi).findIndex(s=>s===STEPS[st.i])+1} OF ${STEPS.filter(s=>s[0]===pi).length}</i><b>${t}</b>${p}`;
  const pageChange=pi!==st.cur;opt.fx({...st,r,txt,pageChange,pi,E,rectOf,step:st.i});st.cur=pi;st.t=setTimeout(tick,pageChange?2600:2000)};
 if(opt.init)opt.init(st);tick();box.onclick=()=>{clearTimeout(st.t);run(box,opt)}}
const swapPages=(c,inA,outA,dur=600)=>{const a=c.pages[c.pi],b=c.pages[1-c.pi];a.style.visibility="visible";b.animate(outA,{duration:dur,easing:"cubic-bezier(.6,0,.2,1)",fill:"forwards"});a.animate(inA,{duration:dur,easing:"cubic-bezier(.6,0,.2,1)",fill:"forwards"}).onfinish=()=>{b.style.visibility="hidden"}};
const std=(c,capAnim,holeAnim)=>{c.E.move(c.ph,c.hole,c.r);c.E.capAt(c.cap,c.r,c.ph);c.cap.innerHTML=c.txt;if(capAnim)c.cap.animate(capAnim,{duration:450,easing:"cubic-bezier(.2,.9,.3,1.2)"});if(holeAnim)c.hole.animate(holeAnim,{duration:500,easing:"ease-out"})};
const withPage=(c,inA,outA,after,dur)=>{if(c.pageChange){c.cap.style.opacity=0;c.hole.style.opacity=0;swapPages(c,inA,outA,dur);setTimeout(()=>{c.r=c.rectOf(STEPS[c.step][1],c.pi);c.hole.style.opacity=1;c.cap.style.opacity=1;after(c)},dur||600)}else after(c)};

/* ---- A: how the spotlight moves between steps ---- */
add("Step to step","Glide","The outline slides smoothly to the next block, caption follows. What you have now, polished.",c=>withPage(c,[{opacity:0},{opacity:1}],[{opacity:1},{opacity:0}],c=>std(c)),1);
add("Step to step","Spring snap","The outline overshoots and settles, like it has weight.",c=>withPage(c,[{opacity:0},{opacity:1}],[{opacity:1},{opacity:0}],c=>{c.hole.style.transition="all .55s cubic-bezier(.34,1.56,.64,1)";c.cap.style.transition="all .55s cubic-bezier(.34,1.56,.64,1)";std(c)}),1);
add("Step to step","Iris close and open","The spotlight shrinks to a dot, jumps, and opens on the next block like a camera iris.",c=>withPage(c,[{opacity:0},{opacity:1}],[{opacity:1},{opacity:0}],c=>{const h=c.hole;h.style.transition="all .25s ease-in";const cx=parseFloat(h.style.left||0)+parseFloat(h.style.width||0)/2,cy=parseFloat(h.style.top||0)+parseFloat(h.style.height||0)/2;Object.assign(h.style,{left:cx+"px",top:cy+"px",width:"0px",height:"0px",borderRadius:"50%"});setTimeout(()=>{const r=c.r;h.style.transition="none";Object.assign(h.style,{left:r.left+r.width/2+"px",top:r.top+r.height/2+"px"});requestAnimationFrame(()=>{h.style.transition="all .35s cubic-bezier(.2,.9,.3,1.1)";h.style.borderRadius="12px";std(c)})},260)}),1);
add("Step to step","Comet trail","A yellow dot races from the old block to the new one leaving a fading trail, then the outline draws in.",c=>withPage(c,[{opacity:0},{opacity:1}],[{opacity:1},{opacity:0}],c=>{const h=c.hole,ox=parseFloat(h.style.left||20)+20,oy=parseFloat(h.style.top||20)+10,r=c.r;for(let k=0;k<6;k++){const d=document.createElement("i");d.style.cssText=`position:absolute;width:${8-k}px;height:${8-k}px;border-radius:50%;background:#ffc62b;left:${ox}px;top:${oy}px;opacity:${1-k*.15};box-shadow:0 0 10px #ffc62b`;c.ph.append(d);d.animate([{transform:"translate(0,0)"},{transform:`translate(${r.left+20-ox}px,${r.top+10-oy}px)`}],{duration:420,delay:k*30,easing:"cubic-bezier(.6,0,.2,1)",fill:"forwards"}).onfinish=()=>d.remove()}h.style.opacity=0;setTimeout(()=>{h.style.opacity=1;std(c,null,[{outlineColor:"rgba(255,198,43,0)",outlineOffset:"10px"},{outlineColor:"#ffc62b",outlineOffset:"2px"}])},420)}));
add("Step to step","Border draws itself","The outline traces around the block like a pen, then the caption slides up.",c=>withPage(c,[{opacity:0},{opacity:1}],[{opacity:1},{opacity:0}],c=>{std(c,[{transform:"translateY(10px)",opacity:0},{transform:"none",opacity:1}]);c.hole.animate([{clipPath:"inset(0 100% 100% 0)"},{clipPath:"inset(0 0 100% 0)"},{clipPath:"inset(0 0 0 0)"}],{duration:500})}));
add("Step to step","Pulse ring","On arrival, two yellow rings ripple out from the block, the same glow as your ? button.",c=>withPage(c,[{opacity:0},{opacity:1}],[{opacity:1},{opacity:0}],c=>{std(c);c.hole.animate([{boxShadow:"0 0 0 999px rgba(0,0,0,.66),0 0 0 0 rgba(255,198,43,.8)"},{boxShadow:"0 0 0 999px rgba(0,0,0,.66),0 0 0 18px rgba(255,198,43,0)"}],{duration:900,delay:350,iterations:2})}),1);
add("Step to step","Lift and zoom","The highlighted block lifts toward you (bigger, shadow) while the rest blurs.",c=>withPage(c,[{opacity:0},{opacity:1}],[{opacity:1},{opacity:0}],c=>{c.pages.forEach(p=>p.querySelectorAll(".b").forEach(b=>{b.style.transition="transform .4s,filter .4s";b.style.transform="";b.style.filter="blur(1.5px)"}));const e=c.r.el;e.style.filter="none";e.style.transform="scale(1.05)";e.style.boxShadow="0 10px 30px rgba(0,0,0,.6)";std(c,[{opacity:0},{opacity:1}])}));
add("Step to step","Typewriter caption","The caption types itself out letter by letter, with a blinking cursor.",c=>withPage(c,[{opacity:0},{opacity:1}],[{opacity:1},{opacity:0}],c=>{std(c);const full=c.cap.innerHTML,txt=STEPS[c.step][3];c.cap.innerHTML=full.replace(txt,'<span class="tw"></span><span style="animation:fade .5s infinite alternate">▍</span>');const tw=c.cap.querySelector(".tw");let k=0;const iv=setInterval(()=>{tw.textContent=txt.slice(0,++k);if(k>=txt.length)clearInterval(iv)},28)}),1);
add("Step to step","Morphing blob","The highlight is a soft glowing blob that stretches and morphs between blocks instead of a sharp box.",c=>withPage(c,[{opacity:0},{opacity:1}],[{opacity:1},{opacity:0}],c=>{c.hole.style.borderRadius="40% 60% 55% 45%/50% 45% 55% 50%";c.hole.style.outline="none";c.hole.style.boxShadow="0 0 0 999px rgba(0,0,0,.7),0 0 24px 6px rgba(255,198,43,.55)";c.hole.style.transition="all .7s cubic-bezier(.5,0,.2,1.3)";std(c)}));
add("Step to step","Arrow pointer","A bouncing arrow points at the block from the caption, so the eye goes straight to it.",c=>withPage(c,[{opacity:0},{opacity:1}],[{opacity:1},{opacity:0}],c=>{std(c);let a=c.ph.querySelector(".arw");if(!a){a=document.createElement("div");a.className="arw";a.textContent="▲";a.style.cssText="position:absolute;color:#ffc62b;font-size:16px;transition:all .45s;text-shadow:0 0 8px #ffc62b";c.ph.append(a)}a.style.left=c.r.left+c.r.width/2-6+"px";a.style.top=c.r.top+c.r.height+6+"px";a.animate([{transform:"translateY(0)"},{transform:"translateY(4px)"}],{duration:500,iterations:6,direction:"alternate"})}),1);
add("Step to step","Spotlight cone","A stage spotlight swings from above and lands on the block; everything else stays in shadow.",c=>withPage(c,[{opacity:0},{opacity:1}],[{opacity:1},{opacity:0}],c=>{std(c);let s=c.ph.querySelector(".cone");if(!s){s=document.createElement("div");s.className="cone";s.style.cssText="position:absolute;top:-20px;width:140px;height:0;transition:all .6s cubic-bezier(.5,0,.2,1);background:linear-gradient(rgba(255,230,160,.35),rgba(255,230,160,0));clip-path:polygon(45% 0,55% 0,100% 100%,0 100%);pointer-events:none;mix-blend-mode:screen";c.ph.append(s)}s.style.left=c.r.left+c.r.width/2-70+"px";s.style.height=c.r.top+c.r.height+20+"px"}));
add("Step to step","Number badge","A big step number pops onto the block corner like a sticker, then the caption follows.",c=>withPage(c,[{opacity:0},{opacity:1}],[{opacity:1},{opacity:0}],c=>{std(c);c.ph.querySelectorAll(".nb").forEach(n=>n.remove());const n=document.createElement("div");n.className="nb";n.textContent=STEPS.filter(s=>s[0]===c.pi).indexOf(STEPS[c.step])+1;n.style.cssText=`position:absolute;left:${c.r.left-10}px;top:${c.r.top-10}px;width:24px;height:24px;border-radius:50%;background:#ffc62b;color:#000;font:900 13px/24px system-ui;text-align:center;z-index:3`;c.ph.append(n);n.animate([{transform:"scale(0) rotate(-90deg)"},{transform:"scale(1.3)"},{transform:"scale(1)"}],{duration:500,easing:"ease-out"})}),1);
add("Step to step","Card flip caption","The caption card flips over in 3D to show the next step's text.",c=>withPage(c,[{opacity:0},{opacity:1}],[{opacity:1},{opacity:0}],c=>{c.cap.animate([{transform:"rotateX(0)"},{transform:"rotateX(90deg)"}],{duration:200}).onfinish=()=>{std(c,[{transform:"rotateX(-90deg)"},{transform:"rotateX(0)"}])}}));
add("Step to step","Shimmer sweep","A light sweep runs across the highlighted block like a shine on a card.",c=>withPage(c,[{opacity:0},{opacity:1}],[{opacity:1},{opacity:0}],c=>{std(c);const e=c.r.el;e.style.overflow="hidden";const s=document.createElement("i");s.style.cssText="position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,220,120,.35) 50%,transparent 70%)";e.append(s);s.animate([{transform:"translateX(-100%)"},{transform:"translateX(100%)"}],{duration:800,delay:300}).onfinish=()=>s.remove()}),1);
add("Step to step","Confetti on the last step","Normal glide, but finishing a page fires a small yellow confetti burst. Feels like a reward.",c=>withPage(c,[{opacity:0},{opacity:1}],[{opacity:1},{opacity:0}],c=>{std(c);const last=STEPS.filter(s=>s[0]===c.pi).slice(-1)[0]===STEPS[c.step];if(last)for(let k=0;k<26;k++){const d=document.createElement("i");const col=["#ffc62b","#fff","#4ade80"][k%3];d.style.cssText=`position:absolute;left:50%;top:40%;width:5px;height:8px;background:${col};border-radius:1px`;c.ph.append(d);const a=Math.random()*Math.PI*2,v=60+Math.random()*80;d.animate([{transform:"translate(0,0) rotate(0)",opacity:1},{transform:`translate(${Math.cos(a)*v}px,${Math.sin(a)*v+60}px) rotate(${Math.random()*720}deg)`,opacity:0}],{duration:1100,easing:"cubic-bezier(.2,.8,.4,1)"}).onfinish=()=>d.remove()}}));

/* ---- B: page to page ---- */
add("Page to page","Slide over","Next page slides in from the right like iOS navigation; spotlight lands after.",c=>withPage(c,[{transform:"translateX(100%)"},{transform:"none"}],[{transform:"none"},{transform:"translateX(-30%)",opacity:.4}],c=>std(c)),1);
add("Page to page","3D cube turn","The screen rotates like a cube to show the next page on its side.",c=>withPage(c,[{transform:"rotateY(90deg) translateZ(0)",transformOrigin:"left"},{transform:"rotateY(0)",transformOrigin:"left"}],[{transform:"rotateY(0)",transformOrigin:"right"},{transform:"rotateY(-90deg)",transformOrigin:"right"}],c=>std(c),700));
add("Page to page","Zoom through","Zoom into the last highlighted block; it becomes the next page.",c=>withPage(c,[{transform:"scale(.6)",opacity:0},{transform:"none",opacity:1}],[{transform:"none",opacity:1},{transform:"scale(2.2)",opacity:0}],c=>std(c),650));
add("Page to page","Card stack","The current page drops back like a card in a deck while the next page slides on top.",c=>withPage(c,[{transform:"translateY(100%)"},{transform:"none"}],[{transform:"none"},{transform:"scale(.88) translateY(-6%)",filter:"brightness(.5)"}],c=>std(c),650),1);
add("Page to page","Circle reveal","The next page opens from the tapped Next button in a growing circle.",c=>withPage(c,[{clipPath:"circle(0% at 85% 90%)"},{clipPath:"circle(150% at 85% 90%)"}],[{opacity:1},{opacity:1}],c=>std(c),700),1);
add("Page to page","Page curl","The page lifts and peels away from the corner like paper.",c=>withPage(c,[{opacity:1},{opacity:1}],[{transform:"none",transformOrigin:"0 0"},{transform:"rotate(-12deg) translate(-110%,-10%) skewY(4deg)",transformOrigin:"0 0"}],c=>std(c),750));
add("Page to page","Blur dissolve","The old page blurs and fades out while the new one comes into focus.",c=>withPage(c,[{filter:"blur(10px)",opacity:0},{filter:"blur(0)",opacity:1}],[{filter:"blur(0)",opacity:1},{filter:"blur(10px)",opacity:0}],c=>std(c),600));
add("Page to page","Venetian blinds","The new page appears in horizontal strips, like blinds opening.",c=>withPage(c,[{clipPath:"polygon(0 0,100% 0,100% 0,0 0)"},{clipPath:"polygon(0 0,100% 0,100% 100%,0 100%)"}],[{opacity:1},{opacity:.2}],c=>{std(c)},600));
add("Page to page","Elastic drop","The new page drops from the top and bounces once.",c=>withPage(c,[{transform:"translateY(-100%)"},{transform:"translateY(6%)",offset:.7},{transform:"none"}],[{opacity:1},{opacity:0}],c=>std(c),750));
add("Page to page","Split doors","The old page splits in the middle and opens like two doors.",c=>withPage(c,[{opacity:0},{opacity:1}],[{clipPath:"inset(0 0 0 0)"},{clipPath:"inset(0 50% 0 50%)"}],c=>std(c),650));
add("Page to page","Glitch cut","A quick digital glitch (shake, colour split) and the page changes. Very TV.",c=>withPage(c,[{transform:"translateX(-6px)",filter:"hue-rotate(90deg)"},{transform:"translateX(5px)"},{transform:"translateX(-3px)",filter:"hue-rotate(0)"},{transform:"none"}],[{transform:"none"},{transform:"translateX(8px) skewX(8deg)",opacity:0}],c=>std(c),400));
add("Page to page","Tab bar hop","The yellow highlight jumps along the tab bar to the next tab, then the page swaps. Teaches where pages live.",c=>{let tb=c.ph.querySelector(".tb");if(!tb){tb=document.createElement("div");tb.className="tb";tb.style.cssText="position:absolute;left:12px;right:12px;bottom:8px;height:22px;border-radius:11px;background:#17181b;display:flex";tb.innerHTML='<i style="position:absolute;top:2px;bottom:2px;width:48%;border-radius:9px;background:#ffc62b;transition:left .5s cubic-bezier(.34,1.56,.64,1);left:1%"></i>';c.ph.append(tb)}const dot=tb.firstChild;if(c.pageChange){dot.style.left=c.pi?"51%":"1%"}withPage(c,[{opacity:0},{opacity:1}],[{opacity:1},{opacity:0}],c=>std(c),700)},1);
add("Page to page","Countdown ring","A ring around the Next button fills up; when full it auto-advances to the next page. Hands-free tutorial.",c=>withPage(c,[{transform:"translateX(100%)"},{transform:"none"}],[{transform:"none"},{transform:"translateX(-100%)"}],c=>{std(c);c.cap.insertAdjacentHTML("beforeend",'<svg width="20" height="20" style="position:absolute;right:8px;bottom:8px"><circle cx="10" cy="10" r="8" fill="none" stroke="#2e2f35" stroke-width="2.5"/><circle cx="10" cy="10" r="8" fill="none" stroke="#ffc62b" stroke-width="2.5" stroke-dasharray="50.3" stroke-dashoffset="50.3" transform="rotate(-90 10 10)"><animate attributeName="stroke-dashoffset" from="50.3" to="0" dur="1.9s" fill="freeze"/></circle></svg>')}),1);
add("Page to page","Mini-map","A tiny map of all pages sits in the corner; a dot travels to the next page before it opens.",c=>{let m=c.ph.querySelector(".mm");if(!m){m=document.createElement("div");m.className="mm";m.style.cssText="position:absolute;right:10px;top:26px;display:flex;gap:4px;z-index:5";m.innerHTML=["H","M","P","T"].map((x,i)=>`<span style="width:18px;height:24px;border-radius:4px;background:#1d1e22;border:1px solid #2e2f35;font:800 8px/22px system-ui;text-align:center;color:#8e9096">${x}</span>`).join("");c.ph.append(m)}[...m.children].forEach((s,i)=>{s.style.borderColor=i===c.pi?"#ffc62b":"#2e2f35";s.style.color=i===c.pi?"#ffc62b":"#8e9096"});withPage(c,[{transform:"scale(.9)",opacity:0},{transform:"none",opacity:1}],[{opacity:1},{transform:"scale(1.05)",opacity:0}],c=>std(c),600)});
add("Page to page","Ink spread","Yellow ink floods the screen from the Next button, then drains to reveal the new page.",c=>{if(c.pageChange){const ink=document.createElement("div");ink.style.cssText="position:absolute;inset:0;background:#ffc62b;z-index:9;clip-path:circle(0% at 85% 90%)";c.ph.append(ink);ink.animate([{clipPath:"circle(0% at 85% 90%)"},{clipPath:"circle(150% at 85% 90%)"}],{duration:450,easing:"ease-in",fill:"forwards"}).onfinish=()=>{c.pages[c.pi].style.visibility="visible";c.pages[1-c.pi].style.visibility="hidden";ink.animate([{clipPath:"circle(150% at 15% 10%)"},{clipPath:"circle(0% at 15% 10%)"}],{duration:450,easing:"ease-out",fill:"forwards"}).onfinish=()=>ink.remove()};c.cap.style.opacity=0;c.hole.style.opacity=0;setTimeout(()=>{c.r=c.rectOf(STEPS[c.step][1],c.pi);c.hole.style.opacity=1;c.cap.style.opacity=1;std(c)},950)}else std(c)});
add("Page to page","Trophy finish","After the last page: the screen dims, a trophy drops in with \"You're ready\" and a shine. The wow ending.",c=>withPage(c,[{opacity:0},{opacity:1}],[{opacity:1},{opacity:0}],c=>{std(c);if(c.step===STEPS.length-1){setTimeout(()=>{const t=document.createElement("div");t.style.cssText="position:absolute;inset:0;z-index:9;background:rgba(0,0,0,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font:900 16px system-ui;color:#fff";t.innerHTML='<span style="font-size:44px;filter:drop-shadow(0 0 14px #ffc62b)">🏆</span>You\'re ready<small style="font:600 11px system-ui;color:#8e9096">Tap ? any time to replay</small>';c.ph.append(t);t.firstChild.animate([{transform:"translateY(-120px) rotate(-20deg)"},{transform:"translateY(8px) rotate(5deg)"},{transform:"none"}],{duration:700,easing:"ease-out"});setTimeout(()=>t.remove(),1800)},900)}}));
let sec="";document.getElementById("o").innerHTML=O.map((x,i)=>{let h="";if(x.sec!==sec){sec=x.sec;h=`<div class="sec">${sec.toUpperCase()}</div>`}return h+`<div class="o"><div class="oh"><b>${i+1}</b>${x.n}${x.light?' <span style="color:var(--y);font-size:11px">⚡ light</span>':""}<span class="od">${x.d}</span></div><div class="dm" data-i="${i}"></div></div>`}).join("");
const io=new IntersectionObserver(es=>es.forEach(e=>{const b=e.target;if(e.isIntersecting&&!b.dataset.on){b.dataset.on=1;run(b,O[+b.dataset.i])}}),{rootMargin:"200px"});document.querySelectorAll(".dm").forEach(b=>io.observe(b));
</script></body></html>
