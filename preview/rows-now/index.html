<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Matchup Rows Preview</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font:14px -apple-system,system-ui,sans-serif}
.wrap{max-width:430px;margin:0 auto;padding:14px 0 60px}
.note{color:#8e9096;font-size:12.5px;margin:0 16px 12px;line-height:1.4}.note b{color:#ffc62b}
.bxw{margin:0 10px;border-radius:14px;background:#111214;overflow:hidden}
.bxt{font:800 12px system-ui;letter-spacing:.12em;color:#9a9ca2;padding:12px 14px 4px}
.bxh{display:flex;gap:8px;align-items:center;padding:10px 12px 4px;font:800 13px system-ui}.bxh.lv span{color:#ffc62b}.bxh.lv::before{content:"";width:7px;height:7px;border-radius:50%;background:#ffc62b}.bxh b{color:#fff}
.r{position:relative;display:flex;align-items:center;gap:8px;padding:5px 0 5px 10px;border-top:1px solid #1d1e22}
.r.lv{background:rgba(255,198,43,.05)}.r.lv::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:2px;background:#ffc62b}
.l{flex:none;width:52px;display:flex;flex-direction:column;align-items:center}
.ph{width:48px;height:48px;border-radius:50%;background:#26272c;overflow:hidden;position:relative;display:grid;place-items:center;font:800 12px system-ui;color:#9a9ca2}.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 12%}
.gm{display:flex;flex-direction:column;align-items:flex-start;gap:2px;margin-top:2px}.m .sc small{display:inline;font-size:8px;font-weight:800;color:#75777e}
.sc{font:700 9.5px/1.1 system-ui;color:#c9cad0;letter-spacing:-.2px}.fin .sc{color:#8e9096}
.qb{display:flex;gap:2px}.qb i{width:7px;height:9px;border-radius:1.5px;background:#2a2b30}.qb i.d{background:#777}.qb i.n{background:#ffc62b;animation:b 1.4s infinite}@keyframes b{50%{opacity:.3}}
.ck{font:800 9.5px system-ui;color:#8cc0ff}
.m{flex:none;width:90px;min-width:0}.m b{display:block;font:700 13.5px system-ui;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.m small{display:block;font:600 11px system-ui;color:#8e9096}
.s{flex:1;min-width:0;display:flex;overflow-x:auto;scrollbar-width:none}.s::-webkit-scrollbar{display:none}
.c{flex:none;width:calc(100% / 6);text-align:center;font:700 16px system-ui;letter-spacing:-.4px}.c.t{width:calc(100% / 4.6);font-size:14.5px}.pj .c{color:#9a9ca2;font-style:italic;font-weight:600}
.hd{padding:2px 0 3px 10px;border-top:0;background:none!important}.hd::before{display:none}.hd .c{font:800 9.5px system-ui;color:#8e9096;letter-spacing:.3px}.hd .c.t{color:#9fc6ff}
.mv{display:none}html.ma .pv{display:none}html.ma .mv{display:inline}
</style></head><body><div class="wrap">
<p class="note">Preview of the new Matchup rows with made-up live numbers (no games are on right now). <b>Swipe the stats</b> to see FT, FG and TO. Tap the blue FT/FG header to flip % ↔ made/attempts.</p>
<div class="bxw" id="w"></div></div>
<script>
const H=id=>`https://a.espncdn.com/i/headshots/nba/players/full/${id}.png`;
const LIVE=[["T. Maxey",4431678,"PHI","DET",34,88,81,3,[24,3,6,2,0,3,["5/6","83%"],["8/17","47%"],2]],["J. Embiid",3059318,"PHI","DET",31,88,81,3,[21,11,3,1,2,1,["8/9","89%"],["6/14","43%"],3]],["A. Reaves",4066457,"LAL","SAC",22,55,49,2,[12,3,5,1,0,2,["2/2","100%"],["4/9","44%"],1]],["T. Young",4277905,"WSH","CHI",29,92,95,4,[19,2,11,1,0,2,["5/5","100%"],["6/16","38%"],4]]];
const FIN=[["C. Coward",4903027,"MEM","IND",36,118,109,[17,4,4,3,0,3,["2/2","100%"],["6/11","55%"],1]],["R. Gobert",3032976,"MIN","UTAH",33,104,99,[11,14,1,1,3,0,["3/6","50%"],["4/6","67%"],1]]];
const UP=[["M. Buzelis",4433246,"CHI","WSH","10:00",[14.9,6.0,2.1,0.7,1.1,2.0,["2.1/2.6","81%"],["5.6/12.1","46%"],1.6]],["A. Thompson",4433192,"DET","PHI","7:30",[8.2,5.6,4.8,1.8,0.9,0.1,["1.2/2.0","60%"],["3.4/6.6","52%"],1.9]]];
const K=["PTS","REB","AST","STL","BLK","3PM","FT","FG","TO","MIN"];
const cells=a=>a.map((v,i)=>Array.isArray(v)?`<div class="c t"><span class="pv">${v[1]}</span><span class="mv">${v[0]}</span></div>`:`<div class="c">${v}</div>`).join("");
const hd=()=>`<div class="r hd"><div class="l"></div><div class="m"></div><div class="s">${K.map(k=>`<div class="c${k==="FT"||k==="FG"?" t":""}" ${k==="FT"||k==="FG"?'data-t':""}>${k}</div>`).join("")}</div></div>`;
const qb=q=>`<span class="qb">${[1,2,3,4].map(i=>`<i class="${i<q?"d":i===q?"n":""}"></i>`).join("")}</span>`;
const ph=(n,id)=>`<span class="ph">${n.replace(/[^A-Z]/g,"").slice(0,2)}<img src="${H(id)}" onerror="this.remove()"></span>`;
let h=`<div class="bxt">ACL ENAYILERI</div><div class="bxh lv"><span>Live now</span><b>${LIVE.length}</b></div>`+hd()+LIVE.map(([n,id,t,o,min,a,b,q,s])=>`<div class="r lv"><div class="l">${ph(n,id)}</div><div class="m"><b>${n}</b><div class="gm"><span class="sc"><small>${t}</small> ${a}–${b} <small>${o}</small></span>${qb(q)}</div></div><div class="s">${cells([...s,min])}</div></div>`).join("");
h+=`<div class="bxh"><span>Final</span><b>${FIN.length}</b></div>`+hd()+FIN.map(([n,id,t,o,min,a,b,s])=>`<div class="r"><div class="l">${ph(n,id)}</div><div class="m"><b>${n}</b><div class="gm fin"><span class="sc"><small>${t}</small> ${a}–${b} <small>${o}</small></span>${qb(5)}</div></div><div class="s">${cells([...s,min])}</div></div>`).join("");
h+=`<div class="bxh"><span>Still to play · projected</span><b>${UP.length}</b></div>`+hd()+UP.map(([n,id,t,o,tm,s])=>`<div class="r pj"><div class="l">${ph(n,id)}</div><div class="m"><b>${n}</b><div class="gm"><span class="sc"><small>vs ${o}</small></span><span class="ck">${tm}</span></div></div><div class="s">${cells([...s,"–"])}</div></div>`).join("");
document.getElementById("w").innerHTML=h;
document.addEventListener("scroll",e=>{const t=e.target;if(!t.classList||!t.classList.contains("s")||t.__s)return;document.querySelectorAll(".s").forEach(o=>{if(o!==t){o.__s=1;o.scrollLeft=t.scrollLeft;requestAnimationFrame(()=>o.__s=0)}})},true);
document.addEventListener("click",e=>{if(e.target.closest("[data-t],.c.t"))document.documentElement.classList.toggle("ma")});
</script></body></html>
