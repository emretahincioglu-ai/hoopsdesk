<style>
:root{color-scheme:dark;--y:#ffc62b;--sub:#8b8e96;--card:#141519;--line:#22232a;--C:"Barlow Condensed","Arial Narrow",sans-serif}

.ctl select{flex:none;width:auto}
.sync{font:600 11px Inter;color:var(--sub);margin-left:auto}
.list{padding:6px 8px}
.row{display:flex;align-items:center;gap:10px;padding:8px 8px;border-radius:12px;cursor:pointer}
.row:active{background:#15161b}
.row .rk{width:28px;text-align:right;font:700 13px var(--C);color:#5d6069}
.ph{flex:none;width:46px;height:46px;border-radius:50%;overflow:hidden;background:#1b1c22;position:relative}.ph img{position:absolute;left:50%;top:0;width:64px;transform:translateX(-50%)}

.edh{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 10px 10px;border-bottom:1px solid var(--line)}
.edh button{background:#16171c;border:1px solid #26272e;color:#eef0f3;border-radius:9px;padding:8px 11px;font:700 13px Inter}

.hero .ref,.hero .pv{background:var(--card);border-radius:14px;height:240px;position:relative;overflow:hidden;display:flex;align-items:flex-end;justify-content:center}

.hero .pv svg{height:100%}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}

.op svg{width:100%;height:auto;max-width:72px}.op span{font:600 11px/1.15 Inter;text-align:center}
.op.on{border-color:var(--y);background:#1e1a0e}

.edf button{flex:1;border:0;border-radius:11px;padding:13px;font:800 14px Inter}
.edf .done{background:var(--y);color:#111}.edf .cp{background:#16171c;color:#eef0f3;border:1px solid #26272e}
.pick{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);display:none;align-items:flex-end}.pick.open{display:flex}
.pick .in{width:100%;max-height:70vh;overflow:auto;background:#101115;border-radius:18px 18px 0 0;padding:14px}
.pick input{width:100%;background:#121318;border:1px solid #26272e;color:#eef0f3;border-radius:9px;padding:10px;font:600 14px Inter;margin-bottom:8px}
.note{margin:14px 14px 0;color:var(--sub);font-size:12px;line-height:1.5}
</style></head><body><div class="w">

</div>

const gearIcon=(type,on)=>{const sk="#a8754f",g=on?"#ffc62b":"#3a3c44";
 if(type==="arm")return `<svg viewBox="0 0 64 64"><rect x="26" y="6" width="12" height="50" rx="6" fill="${sk}"/>${on==="sleeve"?`<rect x="26" y="10" width="12" height="44" rx="6" fill="#f4f4f4"/>`:""}${on==="wrist"?`<rect x="25" y="45" width="14" height="8" rx="2" fill="#f4f4f4"/>`:""}${on==="elbow"?`<rect x="25" y="28" width="14" height="6" rx="2" fill="#f4f4f4"/>`:""}</svg>`;
 if(type==="leg")return `<svg viewBox="0 0 64 64"><rect x="24" y="4" width="16" height="54" rx="7" fill="${sk}"/>${on==="tights"?`<rect x="24" y="4" width="16" height="54" rx="7" fill="#151515"/>`:""}${on==="t34"?`<rect x="24" y="4" width="16" height="36" rx="7" fill="#151515"/>`:""}${on==="legs"?`<rect x="24" y="34" width="16" height="24" rx="7" fill="#f4f4f4"/>`:""}${on==="knee"?`<rect x="22" y="24" width="20" height="16" rx="7" fill="#1a1a1a"/>`:""}</svg>`;
 return ""};
/* ---------- state ---------- */
let P=[],LOOK={},dirty=false,lastPull=0;
try{LOOK=JSON.parse(localStorage.getItem("fp_looks")||"{}")}catch(e){}
const key=p=>p.id?("e"+p.id):("n"+norm(p.n));
const get=p=>Object.assign({},DEF,LOOK[key(p)]||{});
function save(p,o){LOOK[key(p)]=Object.assign({},o,{t:Date.now()});try{localStorage.setItem("fp_looks",JSON.stringify(LOOK))}catch(e){}dirty=true;clearTimeout(save._t);save._t=setTimeout(push,900);status("Saving…")}
function status(t){document.getElementById("sync").textContent=t}
async function push(){if(!dirty)return;dirty=false;try{const r=await fetch(WK+"/plan?lid="+LID,{cache:"no-store"});const cur=r.ok?await r.json():{};const m=Object.assign({},cur&&typeof cur==="object"&&!Array.isArray(cur)?cur:{});
 Object.entries(LOOK).forEach(([k,v])=>{if(!m[k]||(v.t||0)>=(m[k].t||0))m[k]=v});await fetch(WK+"/plan?lid="+LID,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(m)});LOOK=m;localStorage.setItem("fp_looks",JSON.stringify(LOOK));status("Saved ✓")}catch(e){dirty=true;status("Offline · saved on this device")}}
async function pull(){try{const r=await fetch(WK+"/plan?lid="+LID,{cache:"no-store"});if(!r.ok)return;const m=await r.json();if(!m||typeof m!=="object"||Array.isArray(m))return;let ch=false;Object.entries(m).forEach(([k,v])=>{if(v&&typeof v==="object"&&(!LOOK[k]||(v.t||0)>(LOOK[k].t||0))){LOOK[k]=v;ch=true}});if(ch){localStorage.setItem("fp_looks",JSON.stringify(LOOK));render();if(CUR)openEd(CUR,true)}status("Synced ✓")}catch(e){status("Offline")}}
/* ---------- data ---------- */
async function load(){P=NAMES.map((n,i)=>({n,rk:i+1}));render();
 try{const tj=await (await fetch(SITE+"/teams")).json();const teams=tj.sports[0].leagues[0].teams.map(x=>x.team);const idx={};
  await Promise.all(teams.map(async t=>{TEAM[t.abbreviation]={c1:"#"+(t.color||"333333"),c2:"#"+(t.alternateColor||"ffffff"),name:t.displayName};try{const r=await (await fetch(SITE+"/teams/"+t.id+"/roster")).json();(r.athletes||[]).forEach(a=>{idx[norm(a.displayName||a.fullName)]={id:a.id,tm:t.abbreviation,num:a.jersey||"",ht:a.displayHeight||"",pos:(a.position||{}).abbreviation||""}})}catch(e){}}));
  P.forEach(p=>{const m=idx[norm(p.n)];if(m)Object.assign(p,m)});
  // migrate name-keyed looks to id-keyed
  P.forEach(p=>{const nk="n"+norm(p.n);if(p.id&&LOOK[nk]&&!LOOK["e"+p.id]){LOOK["e"+p.id]=LOOK[nk]}});
  const tf=document.getElementById("tf");Object.keys(TEAM).sort().forEach(a=>tf.insertAdjacentHTML("beforeend",`<option>${a}</option>`));
 }catch(e){status("ESPN unavailable – names only")}
 render();pull()}
const photo=p=>p.id?`<img src="https://a.espncdn.com/combiner/i?img=/i/headshots/nba/players/full/${p.id}.png&w=260&h=190" alt="" loading="lazy" onerror="this.remove()">`:"";
const team=p=>Object.assign({c1:"#2a2c33",c2:"#ffffff"},TEAM[p.tm]||{},{num:p.num});
function render(){const q=norm(document.getElementById("q").value),tf=document.getElementById("tf").value,sf=document.getElementById("sf").value;
 const done=P.filter(p=>(LOOK[key(p)]||{}).done).length;document.getElementById("cnt").textContent=`${done}/${P.length} done`;document.getElementById("prog").style.width=(100*done/Math.max(1,P.length))+"%";
 document.getElementById("list").innerHTML=P.filter(p=>(!q||norm(p.n).includes(q))&&(!tf||p.tm===tf)&&(!sf||(sf==="done")===!!(LOOK[key(p)]||{}).done)).map(p=>{const o=get(p),d=(LOOK[key(p)]||{}).done;
  return `<div class="row" data-i="${p.rk-1}"><span class="rk">${p.rk}</span><span class="ph">${photo(p)}</span><span class="nm"><b>${p.n}</b><small>${[p.tm,p.pos,p.ht,p.num&&"#"+p.num].filter(Boolean).join(" · ")}${LOOK[key(p)]?` · ${HAIR.find(h=>h[0]===o.hair)[1]}, ${BEARD.find(h=>h[0]===o.beard)[1].toLowerCase()}`:""}</small></span><span class="mini">${headIcon(o)}</span><span class="ck${d?" on":""}">${d?"✓":""}</span></div>`}).join("")}
["q","tf","sf"].forEach(id=>document.getElementById(id).addEventListener("input",render));
document.getElementById("list").addEventListener("click",e=>{const r=e.target.closest(".row");if(r)openEd(P[+r.dataset.i])});
/* ---------- editor ---------- */
function opts(title,field,list,o,iconFn){return `<div class="sec"><h3>${title} <em>${(list.find(x=>x[0]===o[field])||[])[1]||""}</em></h3><div class="grid">${list.map(([k,l])=>`<div class="op${o[field]===k?" on":""}" data-f="${field}" data-v="${k}">${iconFn(k)}<span>${l}</span></div>`).join("")}</div></div>`}
function seg(title,field,list,o){return `<div class="sec"><h3>${title}</h3><div class="seg">${list.map(([k,l])=>`<button class="${String(o[field])===String(k)?"on":""}" data-f="${field}" data-v="${k}">${l}</button>`).join("")}</div></div>`}
function colors(title,field,list,o){return `<div class="sec"><h3>${title}</h3><div class="sw">${list.map(([l,c])=>`<button title="${l}" class="${o[field]===c?"on":""}" data-f="${field}" data-v="${c}" style="background:${c==="team"?(CUR.c1):c==="team2"?(CUR.c2):c}"></button>`).join("")}${field==="hairc"?`<label>Custom <input type="color" data-f="hairc" value="${o.hairc&&o.hairc.startsWith("#")?o.hairc:"#111111"}"></label>`:""}</div></div>`}
function openEd(p,keepScroll){CUR=Object.assign(p,team(p));const o=get(p);const eb=document.getElementById("edb"),sc=eb.scrollTop;
 document.getElementById("en").textContent=p.n;document.getElementById("es").textContent=[p.tm&&TEAM[p.tm]&&TEAM[p.tm].name,p.ht,p.num&&"#"+p.num].filter(Boolean).join(" · ")||"#"+p.rk;
 eb.innerHTML=`<div class="hero"><div class="ref"><span class="lbl">REAL</span>${photo(p)}</div><div class="pv"><span class="lbl">YOUR PICK</span>${body(o,CUR)}</div></div>
 <div class="sec"><h3>Skin tone</h3><div class="sw">${SKIN.map((c,i)=>`<button class="${o.skin===i?"on":""}" data-f="skin" data-v="${i}" style="background:${c}"></button>`).join("")}</div></div>
 ${opts("Hair","hair",HAIR,o,k=>headIcon(o,k,"none"))}
 ${colors("Hair colour","hairc",HAIRC,o)}
 ${opts("Beard","beard",BEARD,o,k=>headIcon(Object.assign({},o,{hair:"buzz"}),"buzz",k))}
 ${seg("Headband","band",[["none","None"],["on","Headband"]],o)}${o.band!=="none"?colors("Headband colour","bandc",GEARC,o):""}
 ${seg("Goggles","goggles",[[0,"No"],[1,"Yes"]],o)}
 <div class="sec"><h3>Arms</h3><div class="grid" style="grid-template-columns:repeat(3,1fr)">${[["sleeve","Shooting sleeve"],["wrist","Wristband"],["elbow","Elbow band"]].map(([k,l])=>`<div class="op" style="cursor:default">${gearIcon("arm",k)}<span>${l}</span></div>`).join("")}</div></div>
 ${seg("Shooting sleeve","sleeve",SIDE,o)}${o.sleeve!=="none"?colors("Sleeve colour","sleevec",GEARC,o):""}
 ${seg("Wristband","wrist",SIDE,o)}${seg("Elbow band","elbow",SIDE,o)}${o.wrist!=="none"||o.elbow!=="none"?colors("Band colour","wristc",GEARC,o):""}
 <div class="sec"><h3>Legs</h3><div class="grid">${[["tights","Full tights"],["t34","3/4 tights"],["legs","Leg sleeve"],["knee","Knee pad"]].map(([k,l])=>`<div class="op" style="cursor:default">${gearIcon("leg",k)}<span>${l}</span></div>`).join("")}</div></div>
 ${seg("Tights","tights",[["none","None"],["full","Full"],["34","3/4"]],o)}${o.tights!=="none"?colors("Tights colour","tightsc",GEARC,o):""}
 ${seg("Leg sleeve","legs",SIDE,o)}${o.legs!=="none"?colors("Leg sleeve colour","legsc",GEARC,o):""}
 ${seg("Knee pad","knee",SIDE,o)}
 ${seg("Build","build",[["slim","Slim"],["regular","Regular"],["strong","Strong"]],o)}<div style="height:20px"></div>`;
 document.getElementById("ed").classList.add("open");if(keepScroll)eb.scrollTop=sc;else eb.scrollTop=0;
 document.getElementById("dn").textContent=(LOOK[key(p)]||{}).done?"Done ✓ · Next":"Mark done · Next"}
document.getElementById("edb").addEventListener("click",e=>{const t=e.target.closest("[data-f]");if(!t||t.type==="color")return;const o=get(CUR);let v=t.dataset.v;const f=t.dataset.f;if(f==="skin"||f==="goggles")v=+v;o[f]=v;save(CUR,o);openEd(CUR,true);render()});
document.getElementById("edb").addEventListener("input",e=>{const t=e.target;if(t.type!=="color")return;const o=get(CUR);o.hairc=t.value;save(CUR,o);document.querySelector(".pv").innerHTML=`<span class="lbl">YOUR PICK</span>${body(o,CUR)}`});
document.getElementById("edb").addEventListener("change",e=>{if(e.target.type==="color"){openEd(CUR,true);render()}});
const vis=()=>[...document.querySelectorAll("#list .row")].map(r=>+r.dataset.i);
const step=d=>{const v=vis(),i=v.indexOf(CUR.rk-1);const n=v[i+d];if(n!=null)openEd(P[n])};
document.getElementById("bk").onclick=()=>{document.getElementById("ed").classList.remove("open");CUR=null;render()};
document.getElementById("pr").onclick=()=>step(-1);document.getElementById("nx").onclick=()=>step(1);
document.getElementById("dn").onclick=()=>{const o=get(CUR);o.done=1;save(CUR,o);render();const v=vis(),i=v.indexOf(CUR.rk-1);if(v[i+1]!=null)openEd(P[v[i+1]]);else{document.getElementById("ed").classList.remove("open");CUR=null}};
const pk=document.getElementById("pick");
document.getElementById("cpb").onclick=()=>{pk.classList.add("open");document.getElementById("pq").value="";listPick()};
function listPick(){const q=norm(document.getElementById("pq").value);document.getElementById("pl").innerHTML=P.filter(p=>p!==CUR&&LOOK[key(p)]&&(!q||norm(p.n).includes(q))).slice(0,40).map(p=>`<div class="row" data-c="${p.rk-1}"><span class="ph">${photo(p)}</span><span class="nm"><b>${p.n}</b></span><span class="mini">${headIcon(get(p))}</span></div>`).join("")||`<p class="note">No saved looks yet.</p>`}
document.getElementById("pq").addEventListener("input",listPick);
pk.addEventListener("click",e=>{const r=e.target.closest("[data-c]");if(r){const src=get(P[+r.dataset.c]);const o=Object.assign({},src);delete o.done;delete o.t;save(CUR,o);pk.classList.remove("open");openEd(CUR);render()}else if(e.target===pk)pk.classList.remove("open")});
setInterval(pull,20000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)pull()});
load();
</script></body></html>
