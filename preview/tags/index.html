<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Week Plan Tags</title>
<style>
:root{color-scheme:dark;--y:#ffc62b}*{box-sizing:border-box}body{margin:0;background:#000;color:#f2f3f5;font:14px -apple-system,system-ui,sans-serif}
.w{max-width:430px;margin:0 auto;padding:16px 10px 60px}h1{font:800 22px system-ui;margin:4px 6px}h2{font:800 17px system-ui;margin:30px 6px 4px;color:var(--y)}.ld{color:#8e9096;font-size:13px;margin:0 6px 10px;line-height:1.4}
.o{margin:20px 0 0}.oh{margin:0 6px 6px;font:700 15px system-ui}.oh b{color:var(--y);margin-right:6px}.od{display:block;color:#8e9096;font:500 12px system-ui;margin-top:2px}
.card{background:#141518;border-radius:14px;padding:12px}
.pr{display:flex;gap:10px;align-items:center}.ph{width:38px;height:38px;border-radius:50%;background:#26272c;overflow:hidden;flex:none}.ph img{width:100%;height:100%;object-fit:cover;object-position:50% 12%}
.nm b{display:block;font:700 15px system-ui}.nm small{color:#8e9096;font-size:12px}
.tg{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.strip{display:flex;justify-content:space-between;background:#141518;border-radius:14px;padding:10px 8px}
.d{width:44px;height:50px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;color:#9a9ca2}
.d b{font:800 17px system-ui}.d small{font:700 9px system-ui;letter-spacing:.06em}.d.past{opacity:.45}.d.on{background:#fff;color:#000}
</style></head><body><div class="w">
<h1>Week Plan tags · 20 ideas</h1>
<p class="ld">Same 4 tags on every card: B2B next week, Hold all week, Plays Thu/Sat (your custom one), Injury watch. Pick a number. Day-strip ideas for "this day has a plan" are at the bottom.</p>
<div id="o"></div><h2>Days with a plan · 8 ideas</h2><p class="ld">Thu and Sat have plans in these examples. Today is Thu.</p><div id="d"></div></div>
<script>
const T=[{t:"Mon–Tue B2B next week",s:"B2B next wk",c:"#ffc62b",i:"⚡"},{t:"Hold all week",s:"Hold",c:"#4ade80",i:"🔒"},{t:"Plays Thu/Sat",s:"Thu/Sat",c:"#c4a7ff",i:"📅"},{t:"Injury watch",s:"Injury",c:"#fb923c",i:"⚠︎"}];
const hx=(c,a)=>c+Math.round(a*255).toString(16).padStart(2,"0");
const head=`<div class="pr"><span class="ph"><img src="https://a.espncdn.com/i/headshots/nba/players/full/4683025.png" onerror="this.remove()"></span><div class="nm"><b>O. Ighodaro</b><small>PHX · Mon · Wed · Thu · Sat · FA</small></div></div>`;
const O=[];const add=(n,d,f,wrap)=>O.push({n,d,h:wrap?wrap():`<div class="card">${head}<div class="tg">${T.map(f).join("")}</div></div>`});
add("Soft pills","Tinted fill, no border, normal case.",x=>`<span style="padding:4px 10px;border-radius:999px;background:${hx(x.c,.16)};color:${x.c};font:700 12px system-ui">${x.t}</span>`);
add("Dot + text","A coloured dot and plain grey text. Very quiet.",x=>`<span style="display:inline-flex;align-items:center;gap:5px;font:600 12.5px system-ui;color:#c9cad0;margin-right:6px"><i style="width:7px;height:7px;border-radius:50%;background:${x.c}"></i>${x.t}</span>`);
add("Short words","Same soft pill, shorter words so they fit on one line.",x=>`<span style="padding:4px 9px;border-radius:999px;background:${hx(x.c,.16)};color:${x.c};font:700 12px system-ui">${x.s}</span>`);
add("Icon + word","Emoji-style icon carries the meaning, word is short.",x=>`<span style="padding:4px 9px;border-radius:8px;background:#1e1f23;color:#e6e7ea;font:600 12px system-ui">${x.i} ${x.s}</span>`);
add("Left colour bar","Dark chip with a colour bar on the left edge.",x=>`<span style="padding:4px 9px 4px 7px;border-left:3px solid ${x.c};border-radius:4px;background:#1c1d21;color:#e6e7ea;font:600 12px system-ui">${x.t}</span>`);
add("Solid colour","Bold filled chips, black text. Loud.",x=>`<span style="padding:4px 10px;border-radius:999px;background:${x.c};color:#000;font:800 11.5px system-ui">${x.s}</span>`);
add("Hashtags","#hold #injury: reads like notes.",x=>`<span style="color:${x.c};font:700 13px system-ui;margin-right:4px">#${x.s.toLowerCase().replace(/[^a-z0-9]+/g,"")}</span>`);
add("One line of text","No chips: one sentence, colour on key words.",null,()=>`<div class="card">${head}<div style="margin-top:9px;font:500 13px/1.45 system-ui;color:#c9cad0">${T.map(x=>`<b style="color:${x.c};font-weight:700">${x.s}</b>`).join(" · ")}</div></div>`);
add("Tags beside the name","Small icons right after the name; tap one for the word.",null,()=>`<div class="card"><div class="pr"><span class="ph"><img src="https://a.espncdn.com/i/headshots/nba/players/full/4683025.png" onerror="this.remove()"></span><div class="nm"><b>O. Ighodaro ${T.map(x=>`<span style="display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:${hx(x.c,.2)};color:${x.c};font-size:11px;vertical-align:1px;margin-left:2px">${x.i}</span>`).join("")}</b><small>PHX · Mon · Wed · Thu · Sat · FA</small></div></div></div>`);
add("Ghost outline, sentence case","Thin outline, no caps, no letter spacing.",x=>`<span style="padding:3px 10px;border-radius:999px;border:1px solid ${hx(x.c,.55)};color:${x.c};font:600 12px system-ui">${x.t}</span>`);
add("Square labels","Small square-cornered labels, like a file tag.",x=>`<span style="padding:3px 7px;border-radius:4px;background:${hx(x.c,.14)};color:${x.c};font:800 10.5px system-ui;letter-spacing:.04em;text-transform:uppercase">${x.s}</span>`);
add("Stacked strip","Tags in a row of equal boxes under the stats.",null,()=>`<div class="card">${head}<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:10px">${T.map(x=>`<div style="text-align:center;padding:6px 2px;border-radius:8px;background:${hx(x.c,.12)};border-top:2px solid ${x.c}"><div style="font-size:13px">${x.i}</div><div style="font:700 10px system-ui;color:${x.c};margin-top:2px">${x.s}</div></div>`).join("")}</div></div>`);
add("Colour dots only","Just dots by the name; the words appear when you tap the card.",null,()=>`<div class="card"><div class="pr"><span class="ph"><img src="https://a.espncdn.com/i/headshots/nba/players/full/4683025.png" onerror="this.remove()"></span><div class="nm"><b>O. Ighodaro <span style="margin-left:4px">${T.map(x=>`<i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${x.c};margin-left:3px"></i>`).join("")}</span></b><small>PHX · Mon · Wed · Thu · Sat · FA</small></div></div></div>`);
add("Main tag + count","Shows only the first tag, then +3. Tap to see all.",null,()=>`<div class="card">${head}<div class="tg"><span style="padding:4px 10px;border-radius:999px;background:${hx(T[0].c,.16)};color:${T[0].c};font:700 12px system-ui">${T[0].t}</span><span style="padding:4px 9px;border-radius:999px;background:#1e1f23;color:#9a9ca2;font:700 12px system-ui">+3</span></div></div>`);
add("Status line above the card","Tags become a thin coloured header bar on the card.",null,()=>`<div class="card" style="padding:0;overflow:hidden"><div style="display:flex">${T.map(x=>`<div style="flex:1;background:${hx(x.c,.18)};color:${x.c};font:800 9.5px system-ui;text-align:center;padding:5px 2px;letter-spacing:.04em;text-transform:uppercase">${x.s}</div>`).join("")}</div><div style="padding:12px">${head}</div></div>`);
add("Underline words","Plain words with a coloured underline.",x=>`<span style="color:#e6e7ea;font:600 12.5px system-ui;border-bottom:2px solid ${x.c};padding-bottom:1px;margin-right:8px">${x.s}</span>`);
add("Glass chips","Frosted dark chips, coloured icon only.",x=>`<span style="padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);color:#e6e7ea;font:600 12px system-ui"><span style="color:${x.c}">●</span> ${x.s}</span>`);
add("Two groups","Week-plan facts (B2B, Thu/Sat) in one style, decisions (Hold, Injury) in another.",null,()=>`<div class="card">${head}<div class="tg">${[T[0],T[2]].map(x=>`<span style="padding:3px 9px;border-radius:6px;background:#1e1f23;color:#c9cad0;font:600 12px system-ui">${x.i} ${x.s}</span>`).join("")}<span style="flex:1"></span>${[T[1],T[3]].map(x=>`<span style="padding:4px 10px;border-radius:999px;background:${x.c};color:#000;font:800 11.5px system-ui">${x.s}</span>`).join("")}</div></div>`);
add("Corner ribbon","The most important tag sits as a ribbon in the card corner; the rest are quiet dots.",null,()=>`<div class="card" style="position:relative;overflow:hidden"><span style="position:absolute;top:0;right:0;background:${T[1].c};color:#000;font:800 10px system-ui;padding:4px 10px;border-bottom-left-radius:10px;letter-spacing:.04em">HOLD</span>${head}<div class="tg">${[T[0],T[2],T[3]].map(x=>`<span style="display:inline-flex;align-items:center;gap:5px;font:600 12px system-ui;color:#c9cad0;margin-right:6px"><i style="width:7px;height:7px;border-radius:50%;background:${x.c}"></i>${x.s}</span>`).join("")}</div></div>`);
add("Tiny caps text, no boxes","Small uppercase words separated by dots, each in its colour.",null,()=>`<div class="card">${head}<div style="margin-top:9px;font:800 10.5px system-ui;letter-spacing:.06em;text-transform:uppercase">${T.map(x=>`<span style="color:${x.c}">${x.s}</span>`).join('<span style="color:#55575c"> · </span>')}</div></div>`);
document.getElementById("o").innerHTML=O.map((x,i)=>`<div class="o"><div class="oh"><b>${i+1}</b>${x.n}<span class="od">${x.d}</span></div>${x.h}</div>`).join("");
const DAYS=[[2,"MON"],[3,"TUE"],[4,"WED"],[5,"THU"],[6,"FRI"],[7,"SAT"],[8,"SUN"]],HAS=[5,7],TODAY=5;
const D=[];const dd=(n,d,f,ex="")=>D.push({n,d,h:`<div class="strip">${DAYS.map(([n2,w])=>f(n2,w,HAS.includes(n2),n2===TODAY,n2<TODAY)).join("")}</div>${ex}`});
const base=(n,w,st,inner="")=>`<div class="d" style="${st}"><b>${n}</b><small>${w}</small>${inner}</div>`;
dd("Yellow outline + dot","Days with a plan get a yellow ring and the dot.",(n,w,h,t,p)=>base(n,w,(t?"background:#fff;color:#000;":"")+(h?"box-shadow:inset 0 0 0 2px var(--y);":"")+(p?"opacity:.45;":""),h?`<i style="position:absolute;top:4px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--y)"></i>`:""));
dd("Yellow fill tint","Plan days are tinted yellow; today stays white.",(n,w,h,t,p)=>base(n,w,(t?"background:#fff;color:#000;":h?"background:rgba(255,198,43,.18);color:var(--y);":"")+(p?"opacity:.45;":"")));
dd("Yellow underline bar","A short yellow bar under the day.",(n,w,h,t,p)=>base(n,w,(t?"background:#fff;color:#000;":"")+(p?"opacity:.45;":""),h?`<i style="position:absolute;bottom:3px;width:18px;height:3px;border-radius:2px;background:var(--y)"></i>`:""));
dd("Count badge","Yellow circle with how many plan items that day.",(n,w,h,t,p)=>base(n,w,(t?"background:#fff;color:#000;":"")+(h?"box-shadow:inset 0 0 0 1.5px rgba(255,198,43,.6);":"")+(p?"opacity:.45;":""),h?`<i style="position:absolute;top:-5px;right:-3px;min-width:16px;height:16px;border-radius:8px;background:var(--y);color:#000;font:800 10px/16px system-ui;font-style:normal;text-align:center">${n===5?2:1}</i>`:""));
dd("Yellow number","The date number turns yellow, plus the dot.",(n,w,h,t,p)=>`<div class="d" style="${t?"background:#fff;color:#000;":""}${p?"opacity:.45;":""}"><b style="${h?"color:"+(t?"#b38600":"var(--y)"):""}">${n}</b><small>${w}</small>${h?`<i style="position:absolute;top:4px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--y)"></i>`:""}</div>`);
dd("Glow ring","Thick soft yellow glow around plan days.",(n,w,h,t,p)=>base(n,w,(t?"background:#fff;color:#000;":"")+(h?"box-shadow:0 0 0 2px var(--y),0 0 12px rgba(255,198,43,.45);":"")+(p?"opacity:.45;":"")));
dd("Dashed outline for empty","Plan days solid yellow outline; empty days dashed grey, so the difference is obvious.",(n,w,h,t,p)=>base(n,w,(t?"background:#fff;color:#000;":"")+(h?"border:2px solid var(--y);":"border:1.5px dashed #2f3036;")+(p?"opacity:.45;":"")));
dd("Outline + summary line","Yellow outline, plus a line under the strip saying what's planned.",(n,w,h,t,p)=>base(n,w,(t?"background:#fff;color:#000;":"")+(h?"box-shadow:inset 0 0 0 2px var(--y);":"")+(p?"opacity:.45;":"")),`<div style="margin:6px 8px 0;font:600 12px system-ui;color:#9a9ca2"><b style="color:var(--y)">Thu</b> Ighodaro + add from GS/MIA/PHX · <b style="color:var(--y)">Sat</b> 1 add</div>`);
document.getElementById("d").innerHTML=D.map((x,i)=>`<div class="o"><div class="oh"><b>${String.fromCharCode(65+i)}</b>${x.n}<span class="od">${x.d}</span></div>${x.h}</div>`).join("");
</script></body></html>
