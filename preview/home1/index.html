<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Home Matchup Card</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--y:#ffc62b;--g:#4ade80;--r:#f87171;--sub:#8e9096;--a:#2f6fd6;--b:#c98a4a}
*{box-sizing:border-box}body{margin:0;background:#000;color:#f2f3f5;font:14px -apple-system,system-ui,sans-serif}
.w{max-width:430px;margin:0 auto;padding:16px 12px 60px}h1{font:800 22px system-ui;margin:4px 4px 2px}.ld{color:var(--sub);font-size:13px;margin:0 4px 6px;line-height:1.4}
.o{margin:26px 0 0}.oh{margin:0 4px 8px;font:700 15px system-ui}.oh b{color:var(--y);margin-right:6px}.od{display:block;color:var(--sub);font:500 12px/1.35 system-ui;margin-top:2px}
.num{font-family:"Roboto Condensed","Arial Narrow",sans-serif;font-weight:800;font-variant-numeric:tabular-nums}
.lg{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:800 12px system-ui;color:#fff;flex:none}
.la{background:linear-gradient(135deg,#2f6fd6,#163a7a)}.lb{background:linear-gradient(135deg,#c98a4a,#6b4220)}
.cats{display:flex;flex-wrap:wrap;gap:5px}.ct{font:800 10.5px system-ui;letter-spacing:.03em;padding:3px 7px;border-radius:6px}
.cw{background:rgba(74,222,128,.15);color:var(--g)}.cl{background:rgba(248,113,113,.14);color:var(--r)}
</style></head><body><div class="w">
<h1>Home · Matchup card · 8 ideas</h1>
<p class="ld">Same data in each: Mastika Magics 6–3 LeTakim, week 3, 40% win chance, 20 vs 24 games left. The one you pick sets the card shape, type and colours for the rest of the app.</p>
<div id="o"></div></div>
<script>
const W=["FT%","3PM","REB","AST","BLK","TO"],L=["FG%","STL","PTS"];
const A=`<span class="lg la">MM</span>`,B=`<span class="lg lb">LT</span>`;
const cats=(sm)=>`<div class="cats">${[["FG%",0],["FT%",1],["3PM",1],["REB",1],["AST",1],["STL",0],["BLK",1],["TO",1],["PTS",0]].map(([c,w])=>`<span class="ct ${w?"cw":"cl"}" style="${sm||""}">${c}</span>`).join("")}</div>`;
const O=[];const add=(n,d,h)=>O.push({n,d,h});
add("Split card","Two halves with team colour bars. Big scores, win % in the middle. Closest to today.",
`<div style="display:grid;grid-template-columns:1fr auto 1fr;background:#141518;border-radius:16px;overflow:hidden">
<div style="padding:14px;border-left:4px solid var(--a)">${A}<div style="font:700 14px system-ui;margin-top:8px">Mastika Magics</div><div class="num" style="font-size:44px;line-height:1">6</div><div style="color:var(--sub);font-size:12px"><b style="color:#fff">20</b> games left</div></div>
<div style="display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 6px"><span style="font:800 10px system-ui;color:var(--sub);letter-spacing:.1em">WK 3</span><span class="num" style="font-size:20px;color:var(--r)">40%</span></div>
<div style="padding:14px;text-align:right;border-right:4px solid var(--b);display:flex;flex-direction:column;align-items:flex-end">${B}<div style="font:700 14px system-ui;margin-top:8px">LeTakim</div><div class="num" style="font-size:44px;line-height:1;color:#8e9096">3</div><div style="color:var(--sub);font-size:12px">games left <b style="color:#fff">24</b></div></div></div>`);
add("Score bar","One row of names and score, then a bar split 6 to 3 by category wins. Very compact.",
`<div style="background:#141518;border-radius:16px;padding:14px">
<div style="display:flex;align-items:center;gap:10px">${A}<b style="flex:1;font-size:15px">Mastika Magics</b><span class="num" style="font-size:30px">6</span><span style="color:#55575c">–</span><span class="num" style="font-size:30px;color:#8e9096">3</span><b style="flex:1;text-align:right;font-size:15px">LeTakim</b>${B}</div>
<div style="display:flex;gap:3px;margin:12px 0 8px">${[1,1,1,1,1,1,0,0,0].map(w=>`<i style="flex:1;height:6px;border-radius:3px;background:${w?"var(--a)":"var(--b)"}"></i>`).join("")}</div>
<div style="display:flex;justify-content:space-between;color:var(--sub);font-size:12px"><span>20 games left</span><span>Week 3 · win chance <b style="color:var(--r)">40%</b></span><span>24 left</span></div></div>`);
add("Win-chance ring","A ring around the score shows the 40% chance. Names under each side.",
`<div style="background:#141518;border-radius:16px;padding:16px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px">
<div style="text-align:center">${A.replace('class="lg','style="margin:0 auto" class="lg')}<div style="font:700 13px system-ui;margin-top:6px">Mastika Magics</div><div style="color:var(--sub);font-size:11.5px">20 left</div></div>
<div style="width:118px;height:118px;border-radius:50%;background:conic-gradient(var(--a) 0 40%,#2a2b30 40% 100%);display:grid;place-items:center"><div style="width:100px;height:100px;border-radius:50%;background:#141518;display:flex;flex-direction:column;align-items:center;justify-content:center"><span class="num" style="font-size:34px;line-height:1">6–3</span><span style="font:700 11px system-ui;color:var(--r)">40% to win</span></div></div>
<div style="text-align:center">${B.replace('class="lg','style="margin:0 auto" class="lg')}<div style="font:700 13px system-ui;margin-top:6px">LeTakim</div><div style="color:var(--sub);font-size:11.5px">24 left</div></div></div>`);
add("Scoreboard + categories","Score on top, the 9 categories right under it, green = winning, red = losing. Replaces the separate chips row.",
`<div style="background:#141518;border-radius:16px;padding:14px">
<div style="display:flex;align-items:center;gap:10px">${A}<div style="flex:1"><b style="font-size:15px">Mastika Magics</b><div style="color:var(--sub);font-size:12px">20 games left</div></div><span class="num" style="font-size:34px">6</span></div>
<div style="display:flex;align-items:center;gap:10px;margin-top:8px">${B}<div style="flex:1"><b style="font-size:15px;color:#c9cad0">LeTakim</b><div style="color:var(--sub);font-size:12px">24 games left</div></div><span class="num" style="font-size:34px;color:#8e9096">3</span></div>
<div style="border-top:1px solid #24252a;margin:12px 0 10px"></div><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span style="font:800 10.5px system-ui;letter-spacing:.1em;color:var(--sub)">WEEK 3</span><span style="font:700 12px system-ui;color:var(--r)">40% win chance</span></div>${cats()}</div>`);
add("Big numbers, minimal","Just the two scores huge, names small, nothing else. Tap for detail.",
`<div style="background:#141518;border-radius:16px;padding:18px 16px;display:flex;align-items:center">
<div style="flex:1"><div style="font:700 12px system-ui;color:var(--sub)">Mastika Magics</div><div class="num" style="font-size:64px;line-height:.95">6</div></div>
<div style="text-align:center"><div style="font:800 10px system-ui;letter-spacing:.12em;color:var(--sub)">WK 3</div><div class="num" style="font-size:18px;color:var(--r)">40%</div></div>
<div style="flex:1;text-align:right"><div style="font:700 12px system-ui;color:var(--sub)">LeTakim</div><div class="num" style="font-size:64px;line-height:.95;color:#55575c">3</div></div></div>`);
add("Colour wash","Each half tinted in team colour, fading to the middle. Bold, feels like a TV scoreboard.",
`<div style="border-radius:16px;overflow:hidden;background:linear-gradient(90deg,rgba(47,111,214,.45),#141518 45%,#141518 55%,rgba(201,138,74,.45));padding:16px;display:flex;align-items:center;gap:10px">
${A}<div style="flex:1;min-width:0"><b style="font-size:14px">Mastika Magics</b><div class="num" style="font-size:40px;line-height:1">6</div></div>
<div style="text-align:center"><div style="font:800 10px system-ui;letter-spacing:.12em;color:#c9cad0">WEEK 3</div><div style="margin-top:3px;padding:3px 8px;border-radius:999px;background:rgba(0,0,0,.4);font:800 12px system-ui;color:var(--r)">40%</div></div>
<div style="flex:1;min-width:0;text-align:right"><b style="font-size:14px">LeTakim</b><div class="num" style="font-size:40px;line-height:1">3</div></div>${B}</div>`);
add("Status sentence","A plain-English line on top tells you where you stand, then a compact score.",
`<div style="background:#141518;border-radius:16px;padding:14px">
<div style="font:700 16px/1.3 system-ui">Up 6–3, but only <span style="color:var(--r)">40%</span> to win. <span style="color:var(--sub);font-weight:500">PTS and STL are close.</span></div>
<div style="display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid #24252a">${A}<span style="font:700 13px system-ui">Mastika</span><span class="num" style="font-size:22px;margin-left:auto">6</span><span style="color:#55575c">–</span><span class="num" style="font-size:22px;color:#8e9096">3</span><span style="font:700 13px system-ui;margin-left:auto">LeTakim</span>${B}</div>
<div style="display:flex;justify-content:space-between;color:var(--sub);font-size:12px;margin-top:6px"><span>20 games left</span><span>Week 3</span><span>24 games left</span></div></div>`);
add("Stacked rows with games left","Two rows like a box score, games left as a mini bar under each team. Best if games left matters most to you.",
`<div style="background:#141518;border-radius:16px;padding:12px 14px">
<div style="display:flex;justify-content:space-between;font:800 10.5px system-ui;letter-spacing:.1em;color:var(--sub);margin-bottom:8px"><span>WEEK 3</span><span style="color:var(--r)">40% WIN CHANCE</span></div>
${[["Mastika Magics",6,20,A,"var(--a)","#fff"],["LeTakim",3,24,B,"var(--b)","#8e9096"]].map(([n,s,g,l,c,sc])=>`<div style="display:flex;align-items:center;gap:10px;padding:7px 0">${l}<div style="flex:1"><b style="font-size:14.5px">${n}</b><div style="display:flex;align-items:center;gap:6px;margin-top:4px"><i style="height:4px;border-radius:2px;background:${c};width:${g*3}px"></i><span style="font:600 11px system-ui;color:var(--sub)">${g} games left</span></div></div><span class="num" style="font-size:34px;color:${sc}">${s}</span></div>`).join("")}</div>`);
document.getElementById("o").innerHTML=O.map((x,i)=>`<div class="o"><div class="oh"><b>${i+1}</b>${x.n}<span class="od">${x.d}</span></div>${x.h}</div>`).join("");
</script></body></html>
