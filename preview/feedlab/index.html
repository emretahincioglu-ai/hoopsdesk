<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Feed Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--me:#f5b82e;--op:#9d7bff;--card:#121317;--line:#1f2026;--mute:#8b8e97;--C:"Barlow Condensed","Arial Narrow",sans-serif}
*{box-sizing:border-box}html,body{margin:0;background:#050506;color:#eef0f3;font:14px Inter,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.top{max-width:1100px;margin:0 auto;padding:18px 16px 0}.top h1{margin:0;font:800 26px/1 var(--C);letter-spacing:.04em;text-transform:uppercase}.top p{color:var(--mute);margin:6px 0 0;font-size:13px;line-height:1.45}
.nav{position:sticky;top:0;z-index:9;background:rgba(5,5,6,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;gap:6px;padding:10px 16px;max-width:1100px;margin:0 auto}
.nav a{font:700 12px/1 var(--C);letter-spacing:.12em;text-transform:uppercase;color:#c9ccd3;text-decoration:none;border:1px solid #24252c;border-radius:6px;padding:8px 12px}
h2{max-width:1100px;margin:22px auto 0;padding:0 16px;font:800 20px/1 var(--C);letter-spacing:.08em;text-transform:uppercase;color:var(--me)}
.grid{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px;padding:14px 16px 20px}
.opt{min-width:0}.opt h3{margin:0 0 7px;font:700 15px/1.1 var(--C);letter-spacing:.06em;text-transform:uppercase}.opt h3 b{color:var(--me);margin-right:6px}.opt p{margin:7px 2px 0;color:var(--mute);font-size:12px;line-height:1.4}
.ph{position:relative;border-radius:16px;overflow:hidden;background:#000;border:1px solid #1d1e23;height:270px}
.ph.s{height:200px}
/* shared */
.court{height:64px;background:linear-gradient(180deg,#1a1b20,#0b0b0d);position:relative;border-bottom:1px solid var(--line)}
.court:after{content:"";position:absolute;left:12%;right:12%;top:16px;bottom:8px;border-radius:4px;background:linear-gradient(90deg,#9a7348,#b88d5f 50%,#9a7348);transform:perspective(200px) rotateX(38deg);opacity:.9}
.chips{display:flex;gap:6px;overflow:hidden;padding:10px}
.chip{flex:none;border:1px solid #24252c;background:#0f1014;color:#c9ccd3;border-radius:6px;padding:7px 10px;font:700 11.5px/1 var(--C);letter-spacing:.1em;text-transform:uppercase;display:flex;gap:6px;align-items:center;white-space:nowrap}
.chip.on{background:#eef0f3;color:#0a0b0e;border-color:#eef0f3}.dt{width:3px;height:11px;border-radius:2px;display:inline-block}
.av{width:34px;height:34px;border-radius:50%;background:#1c1d22 center/cover;display:grid;place-items:center;font:700 11px var(--C);color:#cfd2d8;flex:none;position:relative;overflow:hidden}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
.feed{background:var(--card);margin:0 10px;border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:44px 3px 1fr auto;gap:9px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--card)}
.row .t{font:600 10.5px/1.2 var(--C);letter-spacing:.06em;color:#8a8e98}.row .t small{display:block;color:#5d6069}
.row .c{align-self:stretch;border-radius:2px}.row .x{font:500 12.5px/1.3 Inter;color:#d5d8de;min-width:0}.row .x b{color:#fff}
.row .r{font:700 15px/1 var(--C);text-align:right;min-width:26px}
.me{background:var(--me)}.op{background:var(--op)}
.lbl{font:700 10px/1 var(--C);letter-spacing:.18em;color:#7d808a;text-transform:uppercase}
.sp{flex:1}
/* loop helpers: all arrival animations run on a 4.5s loop */
.L{animation-duration:4.5s!important;animation-iteration-count:infinite!important}
</style></head><body>
<div class="top"><h1>Feed Lab</h1><p>20 ways to filter plays and 20 ways for new plays to arrive. The arrival styles below loop every few seconds so you can watch them. Pick a number from each set, or mix them.</p></div>
<div class="nav"><a href="#f">Filters · 20</a><a href="#a">New plays · 20</a></div>
<h2 id="f">Filters</h2><div class="grid" id="gf"></div>
<h2 id="a">How new plays arrive</h2><div class="grid" id="ga"></div>
<style id="dyn"></style>
<script>
const P=[["Tyrese Maxey","me","PHI",4431678],["Jayson Tatum","me","BOS",4065648],["Austin Reaves","me","LAL",4066457],["LaMelo Ball","me","CHA",4432816],["Evan Mobley","me","CLE",4432158],["Stephen Curry","op","GS",3975],["Victor Wembanyama","op","SA",5104157],["Devin Booker","op","PHX",3136193],["Jalen Johnson","op","ATL",4701230],["Alperen Sengun","op","HOU",4871144]];
const ini=n=>n.split(" ").map(w=>w[0]).join("");const last=n=>n.split(" ").slice(1).join(" ");
const AV=(p,sz=34,ring)=>`<span class="av" style="width:${sz}px;height:${sz}px;${ring?`box-shadow:0 0 0 2px ${p[1]==="me"?"#f5b82e":"#9d7bff"}`:""}">${ini(p[0])}<img src="https://a.espncdn.com/i/headshots/nba/players/full/${p[3]}.png" onerror="this.remove()" alt=""></span>`;
const CH=(l,on,sd)=>`<span class="chip${on?" on":""}">${sd?`<i class="dt ${sd}"></i>`:""}${l}</span>`;
const ROWS=[["Q3 5:17","PHI","me","<b>Tyrese Maxey</b> drains a 26-foot three","+3"],["Q2 1:42","GS","op","<b>Stephen Curry</b> defensive rebound","REB"],["Q3 2:35","BOS","me","<b>Jayson Tatum</b> driving layup","+2"],["Q2 1:57","SA","op","<b>Victor Wembanyama</b> swats the shot","BLK"],["Q3 2:56","LAL","me","<b>Austin Reaves</b> finds the cutter","AST"]];
const ROW=(r,cls="",st="")=>`<div class="row ${cls}" style="${st}"><span class="t">${r[0]}<small>${r[1]}</small></span><span class="c ${r[2]}"></span><span class="x">${r[3]}</span><span class="r">${r[4]}</span></div>`;
const FEED=(n=3,skip=0)=>`<div class="feed">${ROWS.slice(skip,skip+n).map(r=>ROW(r)).join("")}</div>`;
const COURT=`<div class="court"></div>`;
/* ========== 20 FILTERS ========== */
const F=[
["Chips (current)","Text chips in one scrolling row: All, both teams, then every player. Familiar, but the row gets long.",`${COURT}<div class="chips">${CH("All",1)}${CH("ACL")}${CH("EYT")}${P.slice(0,5).map(p=>CH(last(p[0]),0,p[1])).join("")}</div>${FEED(3)}`],
["Segmented + avatars","A three-way switch for All / ACL / EYT, with a headshot row underneath for players. Team and player are clearly two levels.",`${COURT}<div style="padding:10px 10px 4px"><div style="display:flex;background:#16171b;border-radius:9px;padding:3px">${["All","ACL","EYT"].map((t,i)=>`<span style="flex:1;text-align:center;padding:7px 0;border-radius:7px;font:700 12px var(--C);letter-spacing:.1em;${i==0?"background:#eef0f3;color:#000":"color:#c9ccd3"}">${t}</span>`).join("")}</div></div><div style="display:flex;gap:8px;padding:6px 10px 10px;overflow:hidden">${P.slice(0,8).map(p=>AV(p,34,1)).join("")}</div>${FEED(2)}`],
["One pill, dropdown","A single pill \"All plays ▾\". Tap it and a sheet slides up with teams and players. Cleanest screen, one extra tap.",`${COURT}<div style="padding:10px;display:flex;align-items:center;gap:8px"><span class="chip on" style="border-radius:999px;padding:8px 14px">All plays ▾</span><span class="lbl">25 plays</span></div>${FEED(2)}<div style="position:absolute;left:0;right:0;bottom:0;background:#16171b;border-radius:16px 16px 0 0;padding:10px 12px;box-shadow:0 -10px 30px rgba(0,0,0,.6)"><div style="width:34px;height:4px;border-radius:2px;background:#3a3b42;margin:0 auto 8px"></div><div style="display:flex;gap:6px;flex-wrap:wrap">${CH("All",1)}${CH("ACL",0,"me")}${CH("EYT",0,"op")}${P.slice(0,4).map(p=>CH(last(p[0]),0,p[1])).join("")}</div></div>`],
["Headshot rail","Just faces with team-colour rings. All is the first circle. Fastest to scan if you know your guys by face.",`${COURT}<div style="display:flex;gap:9px;padding:10px;overflow:hidden"><span class="av" style="background:#eef0f3;color:#000;font-size:10px">ALL</span>${P.slice(0,8).map(p=>AV(p,34,1)).join("")}</div>${FEED(3)}`],
["Two lanes by team","Your players on a gold row, theirs on a purple row. Tap a team label to filter the whole team.",`${COURT}<div style="padding:8px 10px;display:grid;gap:6px">${["me","op"].map(sd=>`<div style="display:flex;align-items:center;gap:7px"><span style="font:800 12px var(--C);letter-spacing:.1em;width:30px;color:${sd==="me"?"#f5b82e":"#9d7bff"}">${sd==="me"?"ACL":"EYT"}</span>${P.filter(p=>p[1]===sd).map(p=>AV(p,28,1)).join("")}</div>`).join("")}</div>${FEED(2)}`],
["Filter button + badge","A small filter icon with a count badge. Nothing else shows until you open it. Best when you rarely filter.",`${COURT}<div style="display:flex;align-items:center;padding:10px"><span class="lbl">Play-by-play</span><span class="sp"></span><span style="position:relative;border:1px solid #24252c;border-radius:8px;padding:7px 10px;font:700 12px var(--C);letter-spacing:.1em">⚲ FILTER<i style="position:absolute;top:-6px;right:-6px;background:var(--me);color:#000;border-radius:9px;font:800 10px/16px var(--C);min-width:16px;text-align:center;font-style:normal">2</i></span></div>${FEED(3)}`],
["Underline tabs + players","All / ACL / EYT as tabs with your gold underline (same as the app's top tabs), and player chips below only for the chosen team.",`${COURT}<div style="display:flex;gap:20px;padding:0 12px;border-bottom:1px solid var(--line);height:36px;align-items:stretch">${["All","ACL","EYT"].map((t,i)=>`<span style="display:flex;align-items:center;font:700 13px Inter;position:relative;color:${i==1?"#fff":"#9a9da6"}">${t}${i==1?'<i style="position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--me);border-radius:3px 3px 0 0"></i>':""}</span>`).join("")}</div><div class="chips">${P.slice(0,5).map((p,i)=>CH(last(p[0]),i==0,p[1])).join("")}</div>${FEED(2)}`],
["By play type","Filter by what happened instead of who: Buckets, Threes, Defense, Boards, Mistakes. Pairs with a team toggle.",`${COURT}<div class="chips">${CH("All",1)}${CH("🏀 Buckets")}${CH("🎯 Threes")}${CH("🛡 Defense")}${CH("Boards")}${CH("TO")}</div><div style="padding:0 10px 8px;display:flex;gap:6px">${CH("Both",1)}${CH("ACL",0,"me")}${CH("EYT",0,"op")}</div>${FEED(2)}`],
["Mini player cards","Each player is a small card with photo and fantasy line tonight (e.g. 24 PTS · 3 3PM). Filter and box score in one.",`${COURT}<div style="display:flex;gap:7px;padding:10px;overflow:hidden">${P.slice(0,4).map((p,i)=>`<div style="flex:none;width:92px;background:${i==0?"#eef0f3":"#16171b"};color:${i==0?"#000":"#fff"};border-radius:10px;padding:7px;border-top:3px solid ${p[1]==="me"?"#f5b82e":"#9d7bff"}"><div style="display:flex;gap:6px;align-items:center">${AV(p,24)}<b style="font:800 13px var(--C)">${last(p[0]).toUpperCase()}</b></div><div style="font:600 10.5px var(--C);letter-spacing:.06em;margin-top:5px;opacity:.75">${[24,18,11,15][i]} PTS · ${[3,1,2,0][i]} 3PM</div></div>`).join("")}</div>${FEED(2)}`],
["\"My team only\" switch","One toggle. Off shows everything, on shows only your plays. Players are filtered by tapping their name in the feed.",`${COURT}<div style="display:flex;align-items:center;padding:12px"><span style="font:600 13px Inter">My team only</span><span class="sp"></span><span style="width:44px;height:26px;border-radius:13px;background:var(--me);position:relative"><i style="position:absolute;right:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff"></i></span></div>${FEED(3)}`],
["Search field","\"Filter by player…\" with typeahead. Scales to any roster size; slower than one tap.",`${COURT}<div style="padding:10px"><div style="height:34px;border-radius:9px;background:#16171b;display:flex;align-items:center;gap:8px;padding:0 10px;color:#8b8e97;font-size:13px">⚲ Filter by player or team…</div></div>${FEED(3)}`],
["Pill on the court","The filter floats on the court's top-right corner, so the court and the list always match what you picked.",`<div class="court" style="height:110px"><span class="chip on" style="position:absolute;right:8px;top:8px;border-radius:999px;z-index:2;background:rgba(238,240,243,.92)">Maxey ▾</span></div>${FEED(3)}`],
["Picker wheel","Swipe sideways: the selected name sits big in the middle, neighbours fade at the edges. Fun, a bit slower.",`${COURT}<div style="display:flex;align-items:center;justify-content:center;gap:16px;padding:10px 0;-webkit-mask:linear-gradient(90deg,transparent,#000 25%,#000 75%,transparent);mask:linear-gradient(90deg,transparent,#000 25%,#000 75%,transparent)"><span style="font:700 14px var(--C);color:#5d6069">ALL</span><span style="font:700 15px var(--C);color:#8b8e97">ACL</span><span style="font:800 22px var(--C);color:#fff;border-bottom:3px solid var(--me)">MAXEY</span><span style="font:700 15px var(--C);color:#8b8e97">TATUM</span><span style="font:700 14px var(--C);color:#5d6069">REAVES</span></div>${FEED(3)}`],
["Tap the scoreboard","No filter bar at all. Tap your team in the score bug to see only your plays; tap a name in the feed to follow that player.",`<div style="display:flex;align-items:center;gap:8px;padding:10px;background:#0f1014;border-bottom:1px solid var(--line)"><span style="flex:1;display:flex;align-items:center;gap:8px;border-radius:8px;padding:6px 8px;box-shadow:0 0 0 2px var(--me)"><i class="dt me" style="height:18px"></i><b style="font:800 14px var(--C)">ACL</b><b style="margin-left:auto;font:800 20px var(--C)">5</b></span><span style="flex:1;display:flex;align-items:center;gap:8px;padding:6px 8px"><i class="dt op" style="height:18px"></i><b style="font:800 14px var(--C)">EYT</b><b style="margin-left:auto;font:800 20px var(--C)">4</b></span></div>${COURT}${FEED(2)}<div style="text-align:center;font:600 10.5px Inter;color:#5d6069;padding:6px">Tap a team or a name to filter</div>`],
["Hot players first","Chips sorted by who's most active tonight, with a play-count badge. The busiest player is always the first chip.",`${COURT}<div class="chips">${CH("All",1)}${P.slice(0,5).map((p,i)=>`<span class="chip"><i class="dt ${p[1]}"></i>${last(p[0])}<i style="font-style:normal;background:#24252c;border-radius:5px;padding:2px 5px;font-size:10.5px">${[9,7,5,4,2][i]}</i></span>`).join("")}</div>${FEED(3)}`],
["Initial dots","Tiny initial circles (TM, JT, AR…) in team colours. Takes very little space; you learn the initials quickly.",`${COURT}<div style="display:flex;gap:6px;padding:10px"><span class="chip on" style="border-radius:999px">ALL</span>${P.map(p=>`<span style="width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:800 10.5px var(--C);background:${p[1]==="me"?"rgba(245,184,46,.16)":"rgba(157,123,255,.16)"};color:${p[1]==="me"?"#f5b82e":"#b9a3ff"};flex:none">${ini(p[0])}</span>`).join("")}</div>${FEED(3)}`],
["Side rail","A thin vertical rail of headshots to the left of the feed, like a messaging app. The feed keeps full width for text.",`${COURT}<div style="display:flex;gap:8px;padding:10px"><div style="display:grid;gap:7px;align-content:start"><span class="av" style="width:30px;height:30px;background:#eef0f3;color:#000;font-size:9.5px">ALL</span>${P.slice(0,4).map(p=>AV(p,30,1)).join("")}</div><div style="flex:1;margin:0 -10px 0 0">${FEED(3).replace('margin:0 10px','margin:0')}</div></div>`],
["Multi-select","Pick several at once: Maxey + Tatum + Reaves. Selected chips get a check; the count shows above the list.",`${COURT}<div class="chips">${P.slice(0,5).map((p,i)=>`<span class="chip${i<2?" on":""}">${i<2?"✓ ":""}<i class="dt ${p[1]}"></i>${last(p[0])}</span>`).join("")}</div><div class="lbl" style="padding:0 12px 6px">Following 2 players · 11 plays</div>${FEED(2)}`],
["Focus mode pill","Default is All with no bar. Tap any name in the feed and a big \"Watching: Maxey ✕\" pill appears; tap ✕ to go back.",`${COURT}<div style="padding:10px"><span style="display:inline-flex;align-items:center;gap:8px;background:#eef0f3;color:#000;border-radius:999px;padding:5px 12px 5px 5px;font:800 13px var(--C);letter-spacing:.06em">${AV(P[0],24)}WATCHING: MAXEY <span style="opacity:.5">✕</span></span></div>${FEED(3)}`],
["Team + count bar","A split bar showing your share of tonight's plays vs theirs; tapping either side filters. Information and filter in one.",`${COURT}<div style="padding:10px"><div style="display:flex;height:30px;border-radius:8px;overflow:hidden;font:800 12px var(--C);letter-spacing:.08em"><span style="flex:14;background:rgba(245,184,46,.18);color:#f5b82e;display:flex;align-items:center;padding:0 10px">ACL · 14</span><span style="flex:11;background:rgba(157,123,255,.18);color:#b9a3ff;display:flex;align-items:center;justify-content:flex-end;padding:0 10px">11 · EYT</span></div></div>${FEED(3)}`]
];
document.getElementById("gf").innerHTML=F.map(([t,d,h],i)=>`<div class="opt"><h3><b>${i+1}</b>${t}</h3><div class="ph">${h}</div><p>${d}</p></div>`).join("");
/* ========== 20 ARRIVALS ========== */
const NEW=["Q3 5:31","PHI","me","<b>Tyrese Maxey</b> pull-up three, splash","+3"];
const css=[];const A=[];
function add(t,d,h,c){A.push([t,d,h]);if(c)css.push(c)}
const BASE=(n=3)=>ROWS.slice(1,1+n).map(r=>ROW(r)).join("");
add("Slide down (current)","The new row slides in at the top and everything shifts down. Simple, but easy to miss.",
`${COURT}<div class="feed"><div class="L a1">${ROW(NEW)}</div>${BASE()}</div>`,
`.a1{animation:a1 4.5s infinite}@keyframes a1{0%,8%{max-height:0;opacity:0;transform:translateY(-10px)}20%,100%{max-height:60px;opacity:1;transform:none}}`);
add("Gold flash","Same slide-in, then the row flashes in the team colour and fades back. You always see which row is new.",
`${COURT}<div class="feed"><div class="a2">${ROW(NEW)}</div>${BASE()}</div>`,
`.a2{animation:a1 4.5s infinite}.a2 .row{animation:a2 4.5s infinite}@keyframes a2{0%,15%{background:rgba(245,184,46,.45)}55%,100%{background:var(--card)}}`);
add("Toast then dock","A card pops over the court, holds, then flies down and docks into the top of the list.",
`${COURT}<div class="a3t" style="position:absolute;left:14px;right:14px;top:16px;z-index:3">${ROW(NEW,"","border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.6);border:1px solid #2a2b31")}</div><div class="feed"><div class="a3r">${ROW(NEW)}</div>${BASE()}</div>`,
`.a3t{animation:a3t 4.5s infinite}@keyframes a3t{0%,5%{opacity:0;transform:scale(.9) translateY(-10px)}15%,45%{opacity:1;transform:none}60%,100%{opacity:0;transform:translateY(60px) scale(.96)}}.a3r{animation:a3r 4.5s infinite}@keyframes a3r{0%,55%{max-height:0;opacity:0}65%,100%{max-height:60px;opacity:1}}`);
add("NOW hero card","The newest play is a big card with photo at the top. When the next play lands it shrinks into a normal row.",
`${COURT}<div style="margin:8px 10px;border-radius:12px;background:#16171b;border-left:4px solid var(--me);padding:10px;display:flex;gap:10px;align-items:center" class="a4">${AV(P[0],46)}<div style="flex:1"><div class="lbl" style="color:#ff453a">● NOW · Q3 5:31</div><div style="font:800 19px var(--C);margin-top:3px">TYRESE MAXEY</div><div style="font:600 12px Inter;color:var(--me)">Pull-up three · 26 ft</div></div><b style="font:800 30px var(--C)">+3</b></div><div class="feed">${BASE(2)}</div>`,
`.a4{animation:a4 4.5s infinite}@keyframes a4{0%,6%{opacity:0;transform:scale(.92)}16%,100%{opacity:1;transform:none}}`);
add("Ticker strip","A thin TV-style ticker under the court that scrolls the latest plays left. The list below stays calm.",
`${COURT}<div style="height:26px;background:#0b0b0d;border-bottom:1px solid var(--line);overflow:hidden;white-space:nowrap;display:flex;align-items:center"><span style="background:#ff453a;color:#fff;font:800 11px var(--C);letter-spacing:.12em;padding:0 8px;height:100%;display:flex;align-items:center;z-index:1">LIVE</span><span class="a5" style="display:inline-block;font:700 12.5px var(--C);letter-spacing:.06em;padding-left:100%">MAXEY 26-FT THREE <b style="color:var(--me)">+3</b> &nbsp;·&nbsp; CURRY REB &nbsp;·&nbsp; TATUM LAYUP <b style="color:var(--me)">+2</b> &nbsp;·&nbsp; WEMBY BLOCK</span></div><div class="feed" style="margin-top:8px">${BASE()}</div>`,
`.a5{animation:a5 9s linear infinite}@keyframes a5{to{transform:translateX(-100%)}}`);
add("Lower third","A broadcast name bar slides in from the left across the bottom of the court, then slides out. The list just updates.",
`<div class="court" style="height:110px"><div class="a6" style="z-index:2;position:absolute;left:8px;bottom:8px;display:flex;align-items:stretch;background:#0b0b0d;border-radius:4px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.6)"><i style="width:4px" class="me"></i><div style="padding:5px 10px"><div style="font:800 16px var(--C)">TYRESE MAXEY</div><div style="font:700 10.5px var(--C);letter-spacing:.14em;color:var(--me)">MADE 3PT · 26 FT</div></div><b style="font:800 22px var(--C);padding:0 10px;display:flex;align-items:center;background:#16171b">+3</b></div></div><div class="feed">${BASE()}</div>`,
`.a6{animation:a6 4.5s infinite}@keyframes a6{0%,5%{transform:translateX(-110%)}15%,70%{transform:none}82%,100%{transform:translateX(-110%)}}`);
add("Notification stack","New plays land like iPhone notifications on a stack. Older ones tuck behind, slightly smaller.",
