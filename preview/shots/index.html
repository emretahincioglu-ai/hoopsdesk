<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shot Chart Ideas</title>
<style>
:root{color-scheme:dark;--y:#ffc62b;--g:#4ade80;--r:#f87171;--sub:#8e9096;--card:#141518;--line:#24252a}
*{box-sizing:border-box}body{margin:0;background:#000;color:#f2f3f5;font:14px -apple-system,system-ui,sans-serif}
.w{max-width:460px;margin:0 auto;padding:16px 12px 80px}h1{font:800 22px system-ui;margin:4px}.ld{color:var(--sub);font-size:13px;margin:0 4px 6px;line-height:1.4}
.o{margin:26px 0 0}.oh{margin:0 4px 8px;font:700 15px system-ui}.oh b{color:var(--y);margin-right:6px}.od{display:block;color:var(--sub);font:500 12px/1.35 system-ui;margin-top:2px}
.sh{background:var(--card);border-radius:18px;padding:10px;overflow:hidden;position:relative}
.hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}.hd .ph{width:30px;height:30px;border-radius:50%;background:#26272c;overflow:hidden}.hd .ph img{width:100%;height:100%;object-fit:cover;object-position:50% 12%}.hd b{font:800 14px system-ui}.hd small{color:var(--sub);font:600 11px system-ui;margin-left:auto}
.pl{font:600 11.5px/1.3 system-ui;padding:5px 6px;border-radius:7px;display:flex;gap:6px;align-items:center}.pl .q{flex:none;font:800 9.5px ui-monospace,monospace;color:var(--sub);width:38px}.pl .d{flex:none;width:7px;height:7px;border-radius:50%}
.pl.hi{background:rgba(255,198,43,.14)}
.court line,.court path,.court rect,.court circle.cl{stroke:#3a3b42;fill:none;stroke-width:.5}
@keyframes drop{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{0%{r:0}60%{r:2.6}100%{r:1.8}}
</style></head><body><div class="w">
<h1>Player tap · shot chart + plays · 20 ideas</h1>
<p class="ld">Tap a player row in Matchup and this opens. Same game in every idea: Tyrese Maxey vs DET, 3rd quarter. Most demos play themselves; tap shots or plays to link them.</p>
<div id="o"></div></div>
<script>
// half court: x 0..50 (ft), y 0..47 from baseline
const SH=[[25,5,1,"Layup",2,"Q1 10:12"],[38,22,1,"3PT",3,"Q1 8:40"],[12,14,0,"Jumper",2,"Q1 6:05"],[25,26,1,"3PT",3,"Q1 3:30"],[30,8,1,"Floater",2,"Q2 11:02"],[4,3,0,"Corner 3",3,"Q2 7:44"],[22,4,1,"Layup",2,"Q2 4:10"],[44,10,1,"3PT",3,"Q2 1:12"],[18,20,0,"Pull-up",2,"Q3 9:50"],[26,6,0,"Layup",2,"Q3 8:15"],[33,24,1,"3PT",3,"Q3 6:30"],[24,13,1,"Jumper",2,"Q3 5:02"],[8,19,0,"3PT",3,"Q3 4:22"],[27,3,1,"Dunk",2,"Q3 2:40"]];
const PLAYS=[];const OTH=[["Q1 9:20","Defensive rebound","REB"],["Q1 5:10","Assist to Embiid","AST"],["Q2 9:30","Steal","STL"],["Q2 6:20","Turnover (bad pass)","TO"],["Q2 2:05","Assist to George","AST"],["Q3 7:40","Offensive rebound","REB"],["Q3 3:55","Made free throw 1 of 2","FT"],["Q3 3:55","Made free throw 2 of 2","FT"]];
SH.forEach((s,i)=>PLAYS.push({t:s[5],txt:`Tyrese Maxey ${s[2]?"made":"missed"} ${s[3]==="3PT"||s[3]==="Corner 3"?"three-pointer":s[3].toLowerCase()}`,k:s[2]?"make":"miss",shot:i,pts:s[2]?s[4]:0}));
OTH.forEach(o=>PLAYS.push({t:o[0],txt:"Tyrese Maxey "+o[1].charAt(0).toLowerCase()+o[1].slice(1),k:o[2],pts:o[2]==="FT"?1:0}));
const key=t=>{const q=+t[1],m=t.slice(3).split(":");return q*1000-(+m[0]*60+ +m[1])};PLAYS.sort((a,b)=>key(a.t)-key(b.t));
const KC={make:"#4ade80",miss:"#f87171",REB:"#60a5fa",AST:"#c4a7ff",STL:"#ffc62b",TO:"#fb923c",FT:"#4ade80"};
const court=(w,extra="",cls="")=>`<svg class="court ${cls}" viewBox="0 0 50 47" width="${w}" style="display:block;background:#1a1410;border-radius:10px"><rect x="0" y="0" width="50" height="47"/><rect x="17" y="0" width="16" height="19"/><circle class="cl" cx="25" cy="19" r="6"/><path d="M3 0 V14 A23.75 23.75 0 0 0 47 14 V0"/><circle class="cl" cx="25" cy="5.25" r=".75"/><line x1="22" y1="4" x2="28" y2="4"/><path d="M19 47 A6 6 0 0 1 31 47"/>${extra}</svg>`;
const dot=(s,i,r=1.6,an="")=>s[2]?`<circle data-s="${i}" cx="${s[0]}" cy="${s[1]}" r="${r}" fill="#4ade80" stroke="#0b0b0d" stroke-width=".4" style="${an}"/>`:`<g data-s="${i}" style="${an}" stroke="#f87171" stroke-width=".7"><line x1="${s[0]-1.2}" y1="${s[1]-1.2}" x2="${s[0]+1.2}" y2="${s[1]+1.2}"/><line x1="${s[0]+1.2}" y1="${s[1]-1.2}" x2="${s[0]-1.2}" y2="${s[1]+1.2}"/></g>`;
const plRow=(p,i)=>`<div class="pl" data-p="${i}"${p.shot!=null?` data-s="${p.shot}"`:""}><span class="q">${p.t}</span><span class="d" style="background:${KC[p.k]}"></span><span>${p.txt.replace("Tyrese Maxey ","")}</span></div>`;
const HD=`<div class="hd"><span class="ph"><img src="https://a.espncdn.com/i/headshots/nba/players/full/4431678.png" onerror="this.remove()"></span><b>Tyrese Maxey</b><span style="font:700 11px system-ui;color:var(--sub)">PHI vs DET</span><small>24 PTS · 8/14 FG</small></div>`;
const link=el=>{el.addEventListener("click",e=>{const t=e.target.closest("[data-s]");if(!t)return;const s=t.dataset.s;el.querySelectorAll("[data-s]").forEach(x=>{const on=x.dataset.s===s;if(x.classList.contains("pl"))x.classList.toggle("hi",on);else{x.style.opacity=on?1:.25;if(on)x.animate([{transform:"scale(2)",transformOrigin:"center",transformBox:"fill-box"},{transform:"none",transformBox:"fill-box"}],{duration:400})}})})};
const streamIn=(box,list,ms=600,onEach)=>{let i=0;const go=()=>{if(i>=list.length){setTimeout(()=>{box.innerHTML="";i=0;go()},2500);return}const p=list[i];box.insertAdjacentHTML("afterbegin",plRow(p,i));box.firstChild.animate([{transform:"translateY(-10px)",opacity:0},{transform:"none",opacity:1}],{duration:300});onEach&&onEach(p,i);i++;setTimeout(go,ms)};go()};
const O=[];const add=(n,d,h,js)=>O.push({n,d,h,js});
add("Split screen","Your request exactly: court on the left, plays streaming down on the right. Tap a shot or a play to light up its partner.",
`<div class="sh">${HD}<div style="display:grid;grid-template-columns:1.1fr 1fr;gap:8px"><div>${court("100%",SH.map((s,i)=>dot(s,i)).join(""))}</div><div style="max-height:200px;overflow:auto;scrollbar-width:none">${PLAYS.map(plRow).join("")}</div></div></div>`,link);
add("Live replay","Hit play: the stream rolls down one play at a time and each shot drops onto the court at the same moment. Re-watch his game in 15 seconds.",
`<div class="sh">${HD}<div style="display:grid;grid-template-columns:1.1fr 1fr;gap:8px"><div class="cv">${court("100%","")}</div><div class="st" style="max-height:200px;overflow:hidden"></div></div></div>`,
el=>{const svg=el.querySelector("svg");const reset=()=>svg.querySelectorAll("[data-s]").forEach(x=>x.remove());streamIn(el.querySelector(".st"),PLAYS,700,(p,i)=>{if(i===0)reset();if(p.shot!=null){svg.insertAdjacentHTML("beforeend",dot(SH[p.shot],p.shot,1.6));svg.lastChild.animate([{opacity:0,transform:"translateY(-6px)"},{opacity:1,transform:"none"}],{duration:350})}})});
add("Ball flight","Each shot is drawn as an arc from the top of the key into the rim (or clanking off). Very TV broadcast.",
`<div class="sh">${HD}<div class="cv">${court("100%","")}</div><div class="st" style="height:90px;overflow:hidden;margin-top:6px"></div></div>`,
el=>{const svg=el.querySelector("svg");streamIn(el.querySelector(".st"),PLAYS.filter(p=>p.shot!=null),1100,(p,i)=>{if(i===0)svg.querySelectorAll(".fx").forEach(x=>x.remove());const s=SH[p.shot];const path=`M${s[0]} ${s[1]} Q ${(s[0]+25)/2} ${Math.min(s[1],5)-8} 25 5.25`;svg.insertAdjacentHTML("beforeend",`<path class="fx" d="${path}" stroke="${s[2]?"#ffc62b":"#f87171"}" stroke-width=".6" fill="none" stroke-dasharray="60" stroke-dashoffset="60"><animate attributeName="stroke-dashoffset" to="0" dur=".6s" fill="freeze"/></path>`);setTimeout(()=>{svg.insertAdjacentHTML("beforeend",dot(s,p.shot).replace("<circle","<circle class=\"fx\"").replace("<g","<g class=\"fx\""))},600)})});
add("Heat zones","The court is split into zones coloured by his % (hot red to cold blue). The stream sits underneath.",
`<div class="sh">${HD}${court("100%",`<path d="M17 0 h16 v19 h-16z" fill="#ef4444" opacity=".45"/><path d="M3 0 V14 A23.75 23.75 0 0 0 17 22 V0z" fill="#3b82f6" opacity=".35"/><path d="M47 0 V14 A23.75 23.75 0 0 1 33 22 V0z" fill="#f59e0b" opacity=".4"/><path d="M3 14 A23.75 23.75 0 0 0 47 14 L50 47 H0z" fill="#ef4444" opacity=".3"/><text x="25" y="10" font-size="3" fill="#fff" text-anchor="middle" font-weight="800">4/5</text><text x="9" y="9" font-size="2.6" fill="#fff" text-anchor="middle" font-weight="800">0/3</text><text x="41" y="9" font-size="2.6" fill="#fff" text-anchor="middle" font-weight="800">2/3</text><text x="25" y="36" font-size="3" fill="#fff" text-anchor="middle" font-weight="800">3/4 from 3</text>`)}<div style="max-height:120px;overflow:auto;margin-top:6px">${PLAYS.map(plRow).join("")}</div></div>`);
add("Hex bins","NBA-analytics style hexagons: size = how many shots, colour = hot or cold. The nerdiest and the most beautiful.",
`<div class="sh">${HD}${court("100%",[[25,5,3,1],[25,13,2,.5],[37,22,2,1],[13,16,1,0],[30,25,2,.5],[5,3,1,0],[44,10,1,1],[8,19,1,0]].map(([x,y,n,p])=>`<polygon points="${[0,1,2,3,4,5].map(k=>{const a=Math.PI/3*k+Math.PI/6,r=1+n*.9;return (x+Math.cos(a)*r).toFixed(1)+","+(y+Math.sin(a)*r).toFixed(1)}).join(" ")}" fill="${p>.7?"#ef4444":p>.3?"#f59e0b":"#3b82f6"}" opacity=".85"/>`).join(""))}<div style="display:flex;justify-content:space-between;font:700 10px system-ui;color:var(--sub);margin-top:4px"><span>size = attempts</span><span><span style="color:#3b82f6">■</span> cold <span style="color:#f59e0b">■</span> avg <span style="color:#ef4444">■</span> hot</span></div></div>`);
add("Quarter scrubber","A slider under the court: drag through the game and the shots and plays appear up to that moment.",
`<div class="sh">${HD}${court("100%",SH.map((s,i)=>dot(s,i)).join(""))}<input type="range" min="0" max="${PLAYS.length}" value="${PLAYS.length}" style="width:100%;accent-color:#ffc62b;margin-top:8px"><div style="display:flex;justify-content:space-between;font:800 10px system-ui;color:var(--sub)"><span>Q1</span><span>Q2</span><span>Q3</span><span>Q4</span></div><div class="cur" style="margin-top:6px"></div></div>`,
el=>{const r=el.querySelector("input");const up=()=>{const n=+r.value,sh=new Set(PLAYS.slice(0,n).filter(p=>p.shot!=null).map(p=>p.shot));el.querySelectorAll("svg [data-s]").forEach(x=>x.style.opacity=sh.has(+x.dataset.s)?1:0);el.querySelector(".cur").innerHTML=n?plRow(PLAYS[n-1],n-1):""};r.oninput=up;up()});
add("Flip card","The player's stat row flips over in 3D to show the court on the back; flip again for the play stream.",
`<div style="perspective:900px"><div class="fp" style="position:relative;height:300px;transition:transform .7s;transform-style:preserve-3d;cursor:pointer"><div class="sh" style="position:absolute;inset:0;backface-visibility:hidden">${HD}${court("100%",SH.map((s,i)=>dot(s,i)).join(""))}<div style="text-align:center;font:700 11px system-ui;color:var(--sub);margin-top:4px">tap to flip → plays</div></div><div class="sh" style="position:absolute;inset:0;backface-visibility:hidden;transform:rotateY(180deg);overflow:auto">${HD}${PLAYS.map(plRow).join("")}</div></div></div>`,
el=>{const f=el.querySelector(".fp");let o=0;f.onclick=()=>{o=!o;f.style.transform=o?"rotateY(180deg)":""}});
add("Bottom sheet","Opens as a sheet from the bottom: court pinned at top, plays scroll underneath. Drag the handle to go full screen.",
`<div style="background:#0b0b0d;border-radius:18px;height:340px;position:relative;overflow:hidden"><div style="padding:10px;color:#3a3b40;font:700 12px system-ui">(matchup page behind)</div><div class="bs sh" style="position:absolute;left:0;right:0;bottom:0;height:290px;border-radius:20px 20px 0 0;transform:translateY(100%)"><div style="width:36px;height:4px;border-radius:2px;background:#3a3b40;margin:0 auto 8px"></div>${HD}<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div>${court("100%",SH.map((s,i)=>dot(s,i)).join(""))}</div><div style="max-height:190px;overflow:auto">${PLAYS.map(plRow).join("")}</div></div></div></div>`,
el=>{const b=el.querySelector(".bs");const open=()=>b.animate([{transform:"translateY(100%)"},{transform:"none"}],{duration:500,easing:"cubic-bezier(.3,1.2,.5,1)",fill:"forwards"});open();el.onclick=e=>{if(!e.target.closest(".bs")){b.getAnimations().forEach(a=>a.cancel());open()}};link(el)});
add("3D tilted court","The court tilts back in 3D like a broadcast camera angle, shots pop up as little pillars.",
`<div class="sh">${HD}<div style="perspective:500px;height:200px;display:flex;align-items:center;justify-content:center"><div style="width:86%;transform:rotateX(52deg);transform-style:preserve-3d">${court("100%",SH.map((s,i)=>`<rect x="${s[0]-.8}" y="${s[1]-.8}" width="1.6" height="1.6" fill="${s[2]?"#4ade80":"#f87171"}" style="filter:drop-shadow(0 0 1px ${s[2]?"#4ade80":"#f87171"})"/>`).join(""))}</div></div><div style="max-height:100px;overflow:auto">${PLAYS.slice(-5).reverse().map(plRow).join("")}</div></div>`);
add("Play-by-play radio","Stream on top, like a radio commentary feed with a live red dot; the court is a small inset in the corner.",
`<div class="sh">${HD}<div style="position:relative"><div style="display:flex;align-items:center;gap:6px;font:900 10px system-ui;letter-spacing:.1em;color:#ef4444;margin-bottom:4px"><span style="width:7px;height:7px;border-radius:50%;background:#ef4444;animation:pulse 1.4s infinite"></span>LIVE FEED</div><div class="st" style="height:190px;overflow:hidden;padding-right:100px"></div><div style="position:absolute;right:0;top:20px;width:92px">${court("100%",SH.map((s,i)=>dot(s,i)).join(""))}</div></div></div><style>@keyframes pulse{50%{opacity:.3}}</style>`,
el=>streamIn(el.querySelector(".st"),PLAYS,800));
add("Stat counters + court","Big counters (PTS, 3PM, REB, AST) tick up as each play streams in. The court fills with shots in sync.",
`<div class="sh">${HD}<div class="ct" style="display:grid;grid-template-columns:repeat(4,1fr);gap:4px;text-align:center;margin-bottom:8px">${["PTS","3PM","REB","AST"].map(k=>`<div style="background:#1b1c20;border-radius:10px;padding:6px"><b data-k="${k}" style="display:block;font:900 22px system-ui">0</b><small style="font:800 9px system-ui;color:var(--sub)">${k}</small></div>`).join("")}</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div>${court("100%","")}</div><div class="st" style="max-height:170px;overflow:hidden"></div></div></div>`,
el=>{const svg=el.querySelector("svg");const C={PTS:0,"3PM":0,REB:0,AST:0};const set=()=>Object.keys(C).forEach(k=>el.querySelector(`[data-k="${k}"]`).textContent=C[k]);streamIn(el.querySelector(".st"),PLAYS,650,(p,i)=>{if(i===0){Object.keys(C).forEach(k=>C[k]=0);svg.querySelectorAll("[data-s]").forEach(x=>x.remove())}C.PTS+=p.pts||0;if(p.shot!=null&&p.pts===3)C["3PM"]++;if(p.k==="REB")C.REB++;if(p.k==="AST")C.AST++;set();const b=el.querySelector(`[data-k="${p.k==="REB"?"REB":p.k==="AST"?"AST":"PTS"}"]`);b.animate([{transform:"scale(1.4)",color:"#ffc62b"},{transform:"none"}],{duration:400});if(p.shot!=null)svg.insertAdjacentHTML("beforeend",dot(SH[p.shot],p.shot))})});
add("Film strip","Plays as frames on a horizontal film strip you swipe through; the court above zooms to each shot.",
`<div class="sh">${HD}<div class="cz" style="overflow:hidden;border-radius:10px">${court("100%",SH.map((s,i)=>dot(s,i)).join(""))}</div><div class="fs" style="display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:8px;padding:6px;background:#0a0a0a;border-top:3px dashed #2a2b30;border-bottom:3px dashed #2a2b30">${PLAYS.map((p,i)=>`<button data-p="${i}" style="flex:none;width:110px;border:0;background:#1b1c20;color:#fff;border-radius:6px;padding:6px;text-align:left;font:700 10.5px/1.25 system-ui"><span style="color:var(--sub);font:800 9px ui-monospace">${p.t}</span><br><span style="color:${KC[p.k]}">●</span> ${p.txt.replace("Tyrese Maxey ","")}</button>`).join("")}</div></div>`,
el=>{const svg=el.querySelector("svg");el.querySelectorAll(".fs button").forEach(b=>b.onclick=()=>{const p=PLAYS[+b.dataset.p];if(p.shot==null){svg.style.transform="";return}const s=SH[p.shot];svg.style.transition="transform .5s";svg.style.transformOrigin=`${s[0]*2}% ${s[1]/47*100}%`;svg.style.transform="scale(2.2)"})});
add("Radial clock","Plays placed around a circle like a clock face (48 minutes); shots in the middle court. Shows when he was hot.",
`<div class="sh">${HD}<div style="position:relative;width:240px;height:240px;margin:0 auto"><svg viewBox="0 0 240 240" width="240" height="240" style="position:absolute;inset:0"><circle cx="120" cy="120" r="110" fill="none" stroke="#26272c" stroke-width="10"/>${PLAYS.map(p=>{const q=+p.t[1],m=p.t.slice(3).split(":"),el=(q-1)*12+(12-(+m[0]+m[1]/60)),a=el/48*Math.PI*2-Math.PI/2;return `<circle cx="${120+Math.cos(a)*110}" cy="${120+Math.sin(a)*110}" r="5" fill="${KC[p.k]}"/>`}).join("")}${[0,1,2,3].map(q=>{const a=q/4*Math.PI*2-Math.PI/2;return `<text x="${120+Math.cos(a+.3)*92}" y="${124+Math.sin(a+.3)*92}" fill="#55575c" font-size="10" font-weight="800" text-anchor="middle">Q${q+1}</text>`}).join("")}</svg><div style="position:absolute;left:50%;top:50%;width:130px;transform:translate(-50%,-50%)">${court("100%",SH.map((s,i)=>dot(s,i)).join(""))}</div></div></div>`);
add("Bubbles by type","Plays become floating bubbles grouped by type (makes, misses, rebounds, assists). Tap a bubble group to filter the court.",
`<div class="sh">${HD}<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">${Object.entries({make:"Makes",miss:"Misses",REB:"Rebounds",AST:"Assists",STL:"Steals",TO:"Turnovers",FT:"Free throws"}).map(([k,l])=>`<button class="tb" data-k="${k}" style="border:1px solid ${KC[k]}66;background:${KC[k]}1f;color:${KC[k]};border-radius:999px;padding:5px 10px;font:800 11px system-ui">${l} ${PLAYS.filter(p=>p.k===k).length}</button>`).join("")}</div>${court("100%",SH.map((s,i)=>dot(s,i)).join(""))}<div class="fl" style="margin-top:6px"></div></div>`,
el=>{el.querySelectorAll(".tb").forEach(b=>b.onclick=()=>{const k=b.dataset.k;el.querySelectorAll("svg [data-s]").forEach(x=>{const s=SH[+x.dataset.s];x.style.opacity=(k==="make"&&s[2])||(k==="miss"&&!s[2])?1:.12});el.querySelector(".fl").innerHTML=PLAYS.filter(p=>p.k===k).map(plRow).join("")})});
add("Ghost trail","Shots appear with a fading ghost trail showing where he was moving: drive, pull-up or spot-up.",
`<div class="sh">${HD}${court("100%",SH.map((s,i)=>{const fx=s[0]+(s[0]>25?5:-5),fy=s[1]+8;return `<path d="M${fx} ${fy} L${s[0]} ${s[1]}" stroke="${s[2]?"#4ade80":"#f87171"}" stroke-width=".8" stroke-linecap="round" opacity=".35" stroke-dasharray="1 1"/>`+dot(s,i)}).join(""))}<div style="font:600 11px system-ui;color:var(--sub);margin-top:4px">Dotted line = where he came from before the shot</div></div>`);
add("Momentum wave","A wave chart of his points over the game sits under the court; plays are pinned along the wave.",
`<div class="sh">${HD}${court("100%",SH.map((s,i)=>dot(s,i)).join(""))}<svg viewBox="0 0 300 70" width="100%" style="margin-top:6px">${(()=>{let c=0;const pts=PLAYS.map((p,i)=>{c+=p.pts||0;return [10+i/(PLAYS.length-1)*280,65-c*2.2]});return `<path d="M10 65 ${pts.map(p=>"L"+p.join(" ")).join(" ")} L290 65Z" fill="rgba(255,198,43,.15)"/><path d="M${pts.map(p=>p.join(" ")).join(" L")}" stroke="#ffc62b" stroke-width="2" fill="none"/>`+pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="${KC[PLAYS[i].k]}"/>`).join("")})()}</svg><div style="display:flex;justify-content:space-between;font:800 9px system-ui;color:var(--sub)"><span>TIP-OFF</span><span>NOW · 24 PTS</span></div></div>`);
add("Compare with matchup opponent","Your player's court on the left, their best player's on the right, plays merged into one stream with team colours.",
`<div class="sh">${HD}<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><div><div style="font:800 10px system-ui;color:#60a5fa;margin-bottom:3px">MAXEY · YOU</div>${court("100%",SH.map((s,i)=>dot(s,i)).join(""))}</div><div><div style="font:800 10px system-ui;color:#fb923c;margin-bottom:3px">CUNNINGHAM · THEM</div>${court("100%",SH.map((s,i)=>dot([50-s[0],(s[1]+7)%30+2,(i+1)%2,s[3],s[4],s[5]],i)).join(""))}</div></div><div style="max-height:110px;overflow:auto;margin-top:6px">${PLAYS.slice(0,8).map((p,i)=>`<div class="pl" style="border-left:3px solid ${i%3?"#60a5fa":"#fb923c"}"><span class="q">${p.t}</span>${i%3?"Maxey":"Cunningham"} ${p.txt.replace("Tyrese Maxey ","")}</div>`).join("")}</div></div>`);
add("Story mode","Full-screen stories: each tap is one play with the court zoomed to that shot. Progress bars on top, like your Daily story.",
`<div class="sm" style="background:#0b0b0d;border-radius:18px;height:340px;position:relative;overflow:hidden;cursor:pointer"><div class="bars" style="position:absolute;left:8px;right:8px;top:8px;display:flex;gap:2px;z-index:3">${PLAYS.map(()=>'<i style="flex:1;height:2.5px;border-radius:2px;background:#2a2b30"></i>').join("")}</div><div class="sc" style="position:absolute;inset:20px 12px 12px;display:flex;flex-direction:column;gap:10px"></div></div>`,
el=>{let i=0;const show=()=>{const p=PLAYS[i%PLAYS.length];[...el.querySelectorAll(".bars i")].forEach((b,k)=>b.style.background=k<=i%PLAYS.length?"#ffc62b":"#2a2b30");const s=p.shot!=null?SH[p.shot]:null;el.querySelector(".sc").innerHTML=`${HD}<div style="font:900 20px/1.2 system-ui">${p.txt.replace("Tyrese Maxey ","")}</div><div style="font:800 12px ui-monospace;color:var(--sub)">${p.t}</div>${s?`<div style="overflow:hidden;border-radius:10px">${court("100%",dot(s,0,2.4)).replace('<svg','<svg style="transform:scale(1.6);transform-origin:'+s[0]*2+'% '+(s[1]/47*100)+'%"')}</div>`:`<div style="flex:1;display:grid;place-items:center;font-size:56px;color:${KC[p.k]}">${{REB:"🏀",AST:"🤝",STL:"🖐️",TO:"⚠️",FT:"🎯"}[p.k]||""}</div>`}`;el.querySelector(".sc").animate([{opacity:0,transform:"translateX(20px)"},{opacity:1,transform:"none"}],{duration:300})};show();el.onclick=()=>{i++;show()};setInterval(()=>{i++;show()},2600)});
add("Glass overlay on the row","No new page: the tapped row expands in place into a frosted panel with mini court + last 5 plays. Fastest to scan.",
`<div style="background:var(--card);border-radius:14px;overflow:hidden">${["T. Maxey","J. Embiid","A. Reaves"].map((n,i)=>`<div class="rw" style="border-top:1px solid var(--line)"><button style="width:100%;border:0;background:none;color:#fff;display:flex;gap:8px;align-items:center;padding:9px 10px;font:700 13px system-ui"><span style="width:28px;height:28px;border-radius:50%;background:#26272c"></span>${n}<span style="margin-left:auto;color:var(--sub);font:800 12px ui-monospace">${[24,21,12][i]} PTS</span></button><div class="ex" style="max-height:${i?0:300}px;overflow:hidden;transition:max-height .45s"><div style="margin:0 8px 8px;background:rgba(255,255,255,.05);backdrop-filter:blur(8px);border:1px solid #2a2b30;border-radius:12px;padding:8px;display:grid;grid-template-columns:1fr 1fr;gap:8px"><div>${court("100%",SH.map((s,k)=>dot(s,k)).join(""))}</div><div>${PLAYS.slice(-5).reverse().map(plRow).join("")}</div></div></div></div>`).join("")}</div>`,
el=>{el.querySelectorAll(".rw button").forEach(b=>b.onclick=()=>{el.querySelectorAll(".ex").forEach(x=>x.style.maxHeight="0px");b.nextElementSibling.style.maxHeight="300px"})});
add("Arena jumbotron","The court sits inside a big glowing jumbotron frame with LED-dot text scrolling the latest play. Pure wow.",
`<div style="background:#050505;border:3px solid #222;border-radius:14px;padding:8px;box-shadow:0 0 30px rgba(255,198,43,.15),inset 0 0 20px rgba(0,0,0,.8)"><div style="display:flex;justify-content:space-between;font:900 13px ui-monospace,monospace;color:#ffc62b;text-shadow:0 0 6px #ffc62b;padding:0 4px 6px;letter-spacing:.08em"><span>MAXEY</span><span>24 PTS</span><span>Q3 2:40</span></div>${court("100%",SH.map((s,i)=>dot(s,i,1.8)).join(""))}<div style="overflow:hidden;background:#0a0a0a;margin-top:6px;border-radius:4px;padding:4px 0;background-image:radial-gradient(#1a1a1a 1px,transparent 1px);background-size:4px 4px"><div style="display:flex;gap:30px;white-space:nowrap;width:max-content;animation:tk 18s linear infinite;font:900 13px ui-monospace,monospace;color:#ffc62b;text-shadow:0 0 6px #ffc62b">${[...PLAYS,...PLAYS].slice(-20).map(p=>`<span>${p.txt.toUpperCase()}</span>`).join("")}</div></div></div><style>@keyframes tk{to{transform:translateX(-50%)}}</style>`);
document.getElementById("o").innerHTML=O.map((x,i)=>`<div class="o"><div class="oh"><b>${i+1}</b>${x.n}<span class="od">${x.d}</span></div><div class="dm" data-i="${i}">${x.h}</div></div>`).join("");
document.querySelectorAll(".dm").forEach(d=>{const x=O[+d.dataset.i];if(x.js)try{x.js(d)}catch(e){console.error(e)}});
</script></body></html>
