<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOTW Card Preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700;800;900&family=Oswald:wght@500;600;700&display=swap">
<style>
:root{--g1:#f7d774;--g2:#c9952b;--g3:#7a5310}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;color:#fff;font-family:"Roboto Condensed",system-ui,sans-serif;
background:radial-gradient(120% 70% at 50% 0%,#cfd6dc 0%,#8a949c 30%,#2f6b3a 58%,#244f2c 100%)}
.wrap{display:grid;gap:14px;justify-items:center}
.lbl{font:700 12px system-ui;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.85);text-shadow:0 1px 2px rgba(0,0,0,.5)}

/* card */
.card{position:relative;width:min(300px,86vw);aspect-ratio:300/470;filter:drop-shadow(0 14px 22px rgba(0,0,0,.55))}
.edge{position:absolute;inset:0;clip-path:polygon(12% 0,88% 0,100% 6%,100% 92%,50% 100%,0 92%,0 6%);
background:linear-gradient(160deg,var(--g1) 0%,var(--g2) 30%,var(--g3) 55%,var(--g1) 80%,var(--g2) 100%)}
.face{position:absolute;inset:4px;clip-path:polygon(12% 0,88% 0,100% 6%,100% 92%,50% 100%,0 92%,0 6%);
background:
 linear-gradient(118deg,transparent 0 46%,rgba(255,215,110,.32) 46.5% 47.5%,transparent 48% 100%),
 linear-gradient(62deg,transparent 0 58%,rgba(255,215,110,.18) 58.5% 59.3%,transparent 60% 100%),
 radial-gradient(90% 55% at 70% 18%,#3a2a0c 0%,#17120a 55%,#0b0a08 100%);overflow:hidden}
.face:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.025) 0 2px,transparent 2px 6px)}
.face:after{content:"";position:absolute;left:0;right:0;top:0;height:46%;background:linear-gradient(180deg,rgba(247,215,116,.16),transparent)}

.top{position:absolute;left:9%;top:6.5%;display:flex;align-items:center;gap:7px;z-index:3}
.ovr{font:800 46px/0.85 "Oswald",sans-serif;color:var(--g1);text-shadow:0 2px 0 rgba(0,0,0,.6)}
.sep{width:2px;height:30px;background:linear-gradient(var(--g1),var(--g2))}
.pos{font:600 22px/1 "Oswald",sans-serif;color:#fff;letter-spacing:.02em}
.side{position:absolute;left:9%;top:22%;display:grid;gap:9px;z-index:3;justify-items:center}
.side img.nba{width:36px;height:36px;object-fit:contain;padding:4px;border-radius:50%;background:radial-gradient(#fff,#e9e3d3);box-shadow:0 0 0 1.5px var(--g2),0 1px 3px rgba(0,0,0,.6)}
.badge{width:40px;height:28px;border-radius:4px;display:grid;place-items:center;font:800 12px "Roboto Condensed";background:linear-gradient(135deg,#8e44ad,#5b2a86);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.55),0 1px 3px rgba(0,0,0,.6)}
.photo{position:absolute;right:1%;top:6%;width:70%;z-index:2}
.photo img{width:100%;display:block;filter:drop-shadow(0 6px 10px rgba(0,0,0,.6));-webkit-mask-image:linear-gradient(180deg,#000 78%,transparent 100%);mask-image:linear-gradient(180deg,#000 78%,transparent 100%)}
.tag{position:absolute;right:9%;top:5%;z-index:3;font:800 10px "Roboto Condensed";letter-spacing:.06em;color:#111;background:linear-gradient(var(--g1),var(--g2));padding:2px 6px;border-radius:3px}

.band{position:absolute;left:0;right:0;top:48%;z-index:4;text-align:center;padding:6px 0 5px;
background:linear-gradient(90deg,transparent,rgba(0,0,0,.65) 12%,rgba(0,0,0,.78) 50%,rgba(0,0,0,.65) 88%,transparent);border-top:1px solid rgba(247,215,116,.55);border-bottom:1px solid rgba(247,215,116,.55)}
.band b{font:900 23px/1 "Roboto Condensed";letter-spacing:.04em;color:#fff}
.band small{display:block;margin-top:2px;font:700 10px system-ui;color:var(--g1);letter-spacing:.1em}

.stats{position:absolute;left:11%;right:11%;top:59.5%;z-index:4;display:grid;grid-template-columns:repeat(3,1fr);gap:6px 8px;padding-top:8px;border-top:1px solid rgba(247,215,116,.25)}
.st{text-align:center}
.st b{display:block;font:800 19px/1 "Oswald",sans-serif;color:#fff}
.st small{display:block;font:700 9.5px system-ui;letter-spacing:.08em;color:var(--g1);margin-top:1px}
.st.hot b{color:var(--g1)}
.foot{position:absolute;left:0;right:0;bottom:4.5%;z-index:4;text-align:center;font:700 10px system-ui;letter-spacing:.12em;color:rgba(247,215,116,.85)}
</style></head><body>
<div class="wrap">
 <div class="lbl">Team of the Week · card preview</div>
 <div class="card">
  <div class="edge"></div>
  <div class="face">
   <div class="tag">TOTW 2</div>
   <div class="top"><span class="ovr">99</span><span class="sep"></span><span class="pos">C</span></div>
   <div class="side"><img class="nba" src="https://a.espncdn.com/i/teamlogos/nba/500/sa.png" alt="Spurs"><span class="badge" title="Tralala Cafe Crown">TCC</span></div>
   <div class="photo"><img src="https://a.espncdn.com/i/headshots/nba/players/full/5104157.png" alt="Victor Wembanyama"></div>
   <div class="band"><b>WEMBANYAMA</b><small>PLAYER OF THE WEEK · 3 G</small></div>
   <div class="stats">
    <div class="st hot"><b>36.0</b><small>PTS</small></div>
    <div class="st"><b>10.3</b><small>REB</small></div>
    <div class="st"><b>3.7</b><small>AST</small></div>
    <div class="st hot"><b>4.3</b><small>BLK</small></div>
    <div class="st"><b>2.0</b><small>STL</small></div>
    <div class="st"><b>2.3</b><small>3PM</small></div>
    <div class="st hot"><b>.563</b><small>FG%</small></div>
    <div class="st"><b>.786</b><small>FT%</small></div>
    <div class="st"><b>1.0</b><small>TO</small></div>
   </div>
   <div class="foot">TRALALA CAFE CROWN</div>
  </div>
 </div>
</div>
</body></html>
