<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOTW Card Options</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;600;700&family=Roboto+Condensed:wght@600;700;800;900&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(120% 80% at 50% 0%,#23262c,#0c0d0f 70%);color:#fff;font-family:"Roboto Condensed",system-ui,sans-serif;min-height:100vh}
h1{font:800 22px "Roboto Condensed";margin:22px 16px 4px;text-align:center;letter-spacing:.02em}
p.s{margin:0 16px 22px;text-align:center;color:#9a9ca2;font-size:13px}
.grid{display:flex;flex-wrap:wrap;gap:34px 26px;justify-content:center;padding:0 16px 48px}
.opt{display:grid;gap:10px;justify-items:center}
.lab{font:800 13px "Roboto Condensed";letter-spacing:.14em;text-transform:uppercase;color:#cfd2d8}.lab b{color:#ffc62b}
.card{position:relative;width:290px;height:456px;border-radius:18px;overflow:hidden}
.ph img{display:block;width:100%}
.stats{display:grid;grid-template-columns:repeat(3,1fr)}
.st{text-align:center}.st b{display:block}.st small{display:block}

/* ---------- A: GOLD FOIL ---------- */
.A{background:#1a1408;box-shadow:0 0 0 2px #e8c45c,0 0 0 5px #1a1408,0 0 0 6.5px #8a6420,0 22px 40px rgba(0,0,0,.6)}
.A .foil{position:absolute;inset:0;background:
 conic-gradient(from 210deg at 70% 30%,#fff3c4,#e2b24a,#8e621a,#f6d77c,#b9862b,#fff0b8,#e2b24a);opacity:.95}
.A .foil:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.0) 0 14px,rgba(255,255,255,.18) 14px 15px),radial-gradient(120% 60% at 30% 0%,rgba(255,255,255,.55),transparent 55%)}
.A .ph{position:absolute;left:0;right:0;top:28px;height:234px;display:flex;justify-content:center;align-items:flex-end;overflow:hidden}
.A .ph img{width:118%;max-width:none;filter:drop-shadow(0 10px 14px rgba(70,40,0,.55))}
.A .rt{position:absolute;left:14px;top:14px;z-index:3;width:66px;height:74px;background:#120e06;clip-path:polygon(50% 0,100% 22%,100% 78%,50% 100%,0 78%,0 22%);display:grid;place-items:center;text-align:center}
.A .rt b{font:400 34px/0.9 "Anton";color:#f6d77c;display:block}.A .rt small{font:800 11px "Roboto Condensed";letter-spacing:.12em;color:#fff}
.A .lg{position:absolute;right:14px;top:16px;z-index:3;width:40px;height:40px;border-radius:50%;background:#fff;padding:5px;box-shadow:0 0 0 2px #120e06}
.A .lg img{width:100%;height:100%;object-fit:contain}
.A .ribbon{position:absolute;right:-34px;top:70px;z-index:3;transform:rotate(45deg);background:#120e06;color:#f6d77c;font:800 10px "Roboto Condensed";letter-spacing:.18em;padding:4px 40px}
.A .low{position:absolute;left:0;right:0;bottom:0;height:196px;z-index:4;background:linear-gradient(180deg,#17120a,#0d0a05);border-top:3px solid #f6d77c}
.A .nm{text-align:center;padding:10px 0 2px}.A .nm b{font:400 27px/1 "Anton";letter-spacing:.03em;color:#fff}.A .nm small{display:block;font:700 10px "Roboto Condensed";letter-spacing:.16em;color:#d9b356;margin-top:3px}
.A .stats{margin:8px 16px 0;gap:6px 0}.A .st b{font:700 18px/1 "Oswald";color:#fff}.A .st small{font:800 9px "Roboto Condensed";letter-spacing:.12em;color:#9c8a62;margin-top:2px}.A .st.k b{color:#f6d77c}
.A .own{margin-top:9px;text-align:center;font:800 9.5px "Roboto Condensed";letter-spacing:.18em;color:#6f6247}


/* ---------- A2: gold foil, photo right, logo column ---------- */
.A2 .foil{position:absolute;inset:0;background:
 radial-gradient(70% 38% at 100% 0%,rgba(10,8,5,.92) 0%,rgba(10,8,5,.6) 45%,rgba(10,8,5,0) 100%),
 linear-gradient(90deg,#0a0805 0%,rgba(10,8,5,.94) 22%,rgba(10,8,5,.7) 38%,rgba(10,8,5,.25) 56%,rgba(10,8,5,0) 72%),
 linear-gradient(115deg,rgba(255,255,255,0) 30%,rgba(255,250,225,.55) 42%,rgba(255,255,255,0) 54%),
 radial-gradient(120% 90% at 85% 10%,#fff1b8 0%,#f0cd6a 28%,#d4a53e 55%,#a87a22 80%,#7a5512 100%)}
.A2 .foil:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(100deg,rgba(255,255,255,0) 0 3px,rgba(255,255,255,.07) 3px 4px),radial-gradient(70% 50% at 20% 100%,rgba(90,60,10,.35),transparent 70%)}
.A2 .ph{position:absolute;right:0;left:58px;top:18px;height:244px;display:flex;justify-content:flex-end;align-items:flex-end;overflow:hidden}
.A2 .ph img{width:300px;max-width:none;margin-right:-62px;filter:drop-shadow(-6px 10px 14px rgba(70,40,0,.5))}
.A2 .col{position:absolute;left:14px;top:94px;z-index:3;display:grid;gap:12px;justify-items:center;width:66px}
.A2 .col .nba{width:58px;height:58px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))}
.A2 .col .nba img{width:100%;height:100%;object-fit:contain}
.A2 .col .flag{width:44px;height:30px;border-radius:3px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.35),0 3px 6px rgba(0,0,0,.5)}
.A2 .col .flag img{width:100%;height:100%;object-fit:cover;display:block}
.A2 .ribbon{top:22px}.A2 .rt{background:linear-gradient(160deg,#f6d77c,#b9862b)}.A2 .rt b{color:#120e06}.A2 .rt small{color:#120e06}
/* ---------- B: BLACK CHROME ---------- */
.B{background:#0a0b0d;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.55),0 0 0 2px #2c2f35,0 22px 40px rgba(0,0,0,.65)}
.B:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.14),transparent 30%,transparent 70%,rgba(255,255,255,.08)),radial-gradient(90% 55% at 50% 30%,#2a2d34,#0a0b0d 70%)}
.B .stripe{position:absolute;left:-40px;right:-40px;top:200px;height:56px;transform:rotate(-14deg);background:linear-gradient(90deg,#000 0%,#C4CED4 50%,#000 100%);opacity:.22}
.B .big{position:absolute;right:-8px;top:-18px;font:400 210px/1 "Anton";color:transparent;-webkit-text-stroke:2px rgba(232,236,242,.22);letter-spacing:-6px;z-index:1}
.B .ph{position:absolute;left:0;right:0;top:44px;height:250px;display:flex;justify-content:center;align-items:flex-end;overflow:hidden;z-index:2}
.B .ph img{width:116%;max-width:none;filter:grayscale(.15) contrast(1.06) drop-shadow(0 12px 16px rgba(0,0,0,.8))}
.B .top{position:absolute;left:16px;top:16px;z-index:3;display:flex;align-items:baseline;gap:8px}
.B .top b{font:400 44px/0.9 "Anton";background:linear-gradient(180deg,#fff,#aeb6c2 55%,#eef2f6);-webkit-background-clip:text;background-clip:text;color:transparent}
.B .top small{font:800 13px "Roboto Condensed";letter-spacing:.14em;color:#c9cfd8}
.B .lg{position:absolute;left:16px;top:66px;z-index:3;width:34px;height:34px;border-radius:50%;background:radial-gradient(#fff,#d7dce3);padding:4px}.B .lg img{width:100%;height:100%;object-fit:contain}
.B .tag{position:absolute;right:14px;top:16px;z-index:3;font:800 10px "Roboto Condensed";letter-spacing:.16em;color:#0a0b0d;background:linear-gradient(90deg,#e6ebf1,#9aa3ae,#e6ebf1);padding:3px 8px;border-radius:3px}
.B .low{position:absolute;left:12px;right:12px;bottom:12px;z-index:4;border-radius:12px;background:rgba(18,19,22,.86);backdrop-filter:blur(6px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);padding:10px 12px 10px}
.B .nm{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid rgba(255,255,255,.12);padding-bottom:7px}
.B .nm b{font:400 25px/1 "Anton";letter-spacing:.03em}.B .nm small{font:800 10px "Roboto Condensed";letter-spacing:.14em;color:#ffc62b}
.B .stats{margin-top:8px;gap:7px 0}.B .st b{font:700 18px/1 "Oswald";color:#fff}.B .st small{font:800 9px "Roboto Condensed";letter-spacing:.12em;color:#7e848e;margin-top:2px}.B .st.k b{color:#ffc62b}
.B .own{margin-top:8px;text-align:center;font:800 9.5px "Roboto Condensed";letter-spacing:.18em;color:#7e848e}

/* ---------- C: TEAM SPOTLIGHT ---------- */
.C{background:#111;box-shadow:0 0 0 3px #e9c25b,0 22px 40px rgba(0,0,0,.6)}
.C .bg{position:absolute;inset:0;background:radial-gradient(70% 50% at 50% 34%,rgba(196,206,212,.55),transparent 70%),linear-gradient(180deg,#1b1d20 0%,#000 62%)}
.C .rays{position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 50% 36%,rgba(255,255,255,.06) 0 6deg,transparent 6deg 14deg);-webkit-mask-image:radial-gradient(60% 45% at 50% 36%,#000,transparent 75%);mask-image:radial-gradient(60% 45% at 50% 36%,#000,transparent 75%)}
.C .ph{position:absolute;left:0;right:0;top:30px;height:248px;display:flex;justify-content:center;align-items:flex-end;overflow:hidden}
.C .ph img{width:120%;max-width:none;filter:drop-shadow(0 10px 14px rgba(0,0,0,.7))}
.C .medal{position:absolute;right:14px;top:14px;z-index:3;width:70px;height:70px;border-radius:50%;background:conic-gradient(#fff3c4,#e2b24a,#8e621a,#f6d77c,#b9862b,#fff3c4);display:grid;place-items:center;box-shadow:0 4px 10px rgba(0,0,0,.6)}
.C .medal div{width:58px;height:58px;border-radius:50%;background:#111;display:grid;place-items:center;text-align:center}
.C .medal b{font:400 28px/0.9 "Anton";color:#f6d77c;display:block}.C .medal small{font:800 9px "Roboto Condensed";letter-spacing:.14em;color:#fff}
.C .tm{position:absolute;left:14px;top:16px;z-index:3;display:grid;gap:6px;justify-items:start}
.C .tm img{width:34px;height:34px;border-radius:50%;background:#fff;padding:4px;object-fit:contain}
.C .tm span{font:800 10px "Roboto Condensed";letter-spacing:.16em;color:#111;background:#e9c25b;padding:3px 7px;border-radius:3px}
.C .band{position:absolute;left:0;right:0;top:262px;height:46px;z-index:4;background:linear-gradient(90deg,#000 0%,#2b2f33 50%,#000 100%);border-top:2px solid #e9c25b;border-bottom:2px solid #e9c25b;display:grid;place-items:center}
.C .band b{font:400 26px/1 "Anton";letter-spacing:.05em}
.C .low{position:absolute;left:0;right:0;top:310px;bottom:0;z-index:4;background:#0b0b0c;padding:9px 14px 0}
.C .stats{gap:6px 0}.C .st b{font:700 17px/1 "Oswald";color:#fff}.C .st small{font:800 9px "Roboto Condensed";letter-spacing:.12em;color:#8e9096;margin-top:2px}.C .st.k b{color:#f6d77c}
.C .own{margin-top:9px;text-align:center;font:800 9.5px "Roboto Condensed";letter-spacing:.18em;color:#e9c25b}
</style></head><body>
<h1>Team of the Week card — 3 options</h1>
<p class="s">Same player, same data. Pick one (or mix parts) and it becomes the card for all 15 TOTW spots.</p>
<div class="grid" id="g"></div>
<script>
const P={n:"WEMBANYAMA",pos:"C",ovr:99,lg:"https://a.espncdn.com/i/teamlogos/nba/500/sa.png",lgd:"https://a.espncdn.com/i/teamlogos/nba/500-dark/sa.png",flag:"https://flagcdn.com/w160/fr.png",img:"https://a.espncdn.com/i/headshots/nba/players/full/5104157.png",own:"TRALALA CAFE CROWN",fl:"https://10haber-net.cdn.ampproject.org/i/s/10haber.net/wp-content/uploads/2024/09/Ergin-Ataman.jpg",sub:"PLAYER OF THE WEEK · 3 G",
S:[["36.0","PTS",1],["10.3","REB"],["3.7","AST"],["4.3","BLK",1],["2.0","STL"],["2.3","3PM"],[".563","FG%",1],[".786","FT%"],["1.0","TO"]]};
const st=`<div class="stats">${P.S.map(([v,k,h])=>`<div class="st${h?" k":""}"><b>${v}</b><small>${k}</small></div>`).join("")}</div>`;
const ph=`<div class="ph"><img src="${P.img}" alt=""></div>`;
const A=`<div class="card A"><div class="foil"></div>${ph}<div class="rt"><div><b>${P.ovr}</b><small>${P.pos}</small></div></div><div class="lg"><img src="${P.lg}"></div><div class="ribbon">TOTW 2</div><div class="low"><div class="nm"><b>${P.n}</b><small>${P.sub}</small></div>${st}<div class="own">${P.own}</div></div></div>`;
const A2=`<div class="card A A2"><div class="foil"></div><div class="ph"><img src="${P.img}" alt=""></div><div class="rt"><div><b>${P.ovr}</b><small>${P.pos}</small></div></div><div class="col"><div class="nba"><img src="${P.lgd}"></div><div class="flag"><img src="${P.flag}" alt="France"></div></div><div class="ribbon">TOTW 2</div><div class="low"><div class="nm"><b>${P.n}</b><small>${P.sub}</small></div>${st}<div class="own">${P.own}</div></div></div>`;
const B=`<div class="card B"><div class="stripe"></div><div class="big">${P.ovr}</div>${ph}<div class="top"><b>${P.ovr}</b><small>${P.pos}</small></div><div class="lg"><img src="${P.lg}"></div><div class="tag">TOTW 2</div><div class="low"><div class="nm"><b>${P.n}</b><small>POTW · 3 G</small></div>${st}<div class="own">${P.own}</div></div></div>`;
const C=`<div class="card C"><div class="bg"></div><div class="rays"></div>${ph}<div class="medal"><div><div><b>${P.ovr}</b><small>${P.pos}</small></div></div></div><div class="tm"><img src="${P.lg}"><span>TOTW 2</span></div><div class="band"><b>${P.n}</b></div><div class="low">${st}<div class="own">${P.own}</div></div></div>`;
document.getElementById("g").innerHTML=[["A2","Gold foil · new",A2],["A","Gold foil",A],["B","Black chrome",B],["C","Spotlight",C]].map(([k,t,h])=>`<div class="opt"><div class="lab"><b>${k}</b> · ${t}</div>${h}</div>`).join("");
</script></body></html>
