<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Player Bar</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--g:#f5b82e;--p:#9d7bff;--C:"Barlow Condensed","Arial Narrow",sans-serif;--M:"JetBrains Mono",monospace;--b:#23252c;--m:#8a8d96}
*{box-sizing:border-box}html,body{margin:0;background:#050506;color:#eef0f3;font:14px Inter,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.w{max-width:520px;margin:0 auto;padding-bottom:60px}
h1{margin:0;padding:16px 14px 4px;font:800 26px/1 var(--C);letter-spacing:.04em;text-transform:uppercase}
.sub{padding:0 14px 6px;color:var(--m);font-size:12.5px;line-height:1.45}
.opt{padding:22px 0 4px}
.lab{display:flex;align-items:baseline;gap:8px;padding:0 14px;margin-bottom:4px}
.lab b{font:800 13px/1 var(--C);letter-spacing:.12em;color:#0a0a0c;background:#eef0f3;padding:4px 7px;border-radius:5px}
.lab span{font:700 16px/1 var(--C);letter-spacing:.08em;text-transform:uppercase}
.lab button{margin-left:auto;border:1px solid var(--b);background:#111216;color:#eee;border-radius:99px;font:700 11px/1 var(--C);letter-spacing:.12em;padding:6px 10px}
.why{padding:0 14px 10px;color:var(--m);font-size:12px;line-height:1.4}
.st{position:relative;margin:0 8px;border-radius:16px;overflow:hidden;aspect-ratio:804/504;background:#07080b url(../popups/stage.webp) center 70%/140% auto}
.st:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.35));pointer-events:none}
.c{position:absolute;z-index:2}
.hs{background:#1d1f25 center bottom/cover no-repeat;overflow:hidden;position:relative}
.hs img{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:132%}
.C{font-family:var(--C)}.M{font-family:var(--M)}
.cap{font:700 10px/1 var(--C);letter-spacing:.16em;text-transform:uppercase;color:var(--m)}
/* entrance */
.c{opacity:0}
.go .c{animation:in .6s cubic-bezier(.2,.9,.2,1) .15s both}
@keyframes in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.go .c.fx-l{animation-name:inl}@keyframes inl{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.go .c.fx-w{animation:wipe .65s cubic-bezier(.65,0,.35,1) .1s both}@keyframes wipe{from{opacity:1;clip-path:inset(0 100% 0 0)}to{opacity:1;clip-path:inset(0 0 0 0)}}
.go .c.fx-s{animation:sc .55s cubic-bezier(.2,.9,.2,1.1) .15s both}@keyframes sc{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.go .d1{animation:in .5s .45s both}.go .d2{animation:in .5s .6s both}.go .d3{animation:in .5s .75s both}
.bar{display:block;height:4px;border-radius:4px;background:#2a2c33;overflow:hidden}.bar i{display:block;height:100%;border-radius:4px;background:var(--g)}
.go .bar i{animation:grow 1.1s .5s cubic-bezier(.2,.9,.2,1) both}@keyframes grow{from{width:0}}
</style></head><body><div class="w">
<h1>Player bar · 20 ideas</h1>
<div class="sub">Same moment in every one: Joel Embiid (yours) grabs a rebound. No game clock. Each card says something you can use: his line tonight, how close he is to projection, what the play did to the category, or what it did to your win chance. Tap Replay to see the entrance.</div>
<div id="out"></div>
</div>
<script>
const G="#f5b82e",P="#9d7bff";
const PL={n:"Joel Embiid",f:"Joel",l:"Embiid",tm:"PHI",num:"21",id:"3059318",play:"Offensive rebound",short:"REB",v:"+1",cat:"REB",line:{PTS:18,REB:9,AST:3,STL:0,BLK:1,TO:2},proj:{REB:10.4,PTS:27.1},fp:31.6,fpd:1.2,catMe:171,catOp:181,catMe0:170,win0:44,win1:45};
const HS=(w,h,extra="")=>`<div class="hs" style="width:${w}px;height:${h}px;${extra}"><img src="https://a.espncdn.com/i/headshots/nba/players/full/${PL.id}.png" alt="" onerror="this.replaceWith(Object.assign(document.createElement('b'),{textContent:'JE',style:'position:absolute;inset:0;display:grid;place-items:center;font:800 ${Math.round(h*.38)}px Barlow Condensed;color:#f5b82e'}))"></div>`;
const line=`${PL.line.PTS} PTS · ${PL.line.REB} REB · ${PL.line.AST} AST · ${PL.line.BLK} BLK`;
const O=[
["Tonight's line","Name and the play, then his full line tonight. The one thing you always want to know.",
 ()=>`<div class="c fx-w" style="left:10px;right:10px;bottom:10px;height:64px;border-radius:12px;background:rgba(12,13,16,.92);backdrop-filter:blur(12px);display:flex;align-items:center;overflow:hidden;box-shadow:inset 3px 0 0 ${G}">${HS(70,64,"background:none")}<div style="flex:1;padding:0 12px 0 6px"><div class="C" style="font:800 19px/1 var(--C);letter-spacing:.03em;text-transform:uppercase">${PL.n} <span style="color:${G}">· ${PL.play}</span></div><div class="d1 M" style="font-size:11.5px;color:#c9cbd1;margin-top:6px;letter-spacing:.02em">${line}</div></div><div class="d2 C" style="font:800 26px/1 var(--C);color:${G};padding-right:14px">+1</div></div>`],
["Projection meter","How far into his projection he is tonight, for the stat he just added. Tells you if he's on pace.",
 ()=>`<div class="c" style="left:10px;right:10px;bottom:10px;border-radius:12px;background:rgba(12,13,16,.92);backdrop-filter:blur(12px);padding:10px 12px;display:flex;gap:12px;align-items:center">${HS(46,46,"border-radius:50%;border:2px solid "+G)}<div style="flex:1"><div style="display:flex;justify-content:space-between;align-items:baseline"><span class="C" style="font:800 17px/1 var(--C);text-transform:uppercase">${PL.n}</span><span class="C" style="font:800 15px/1 var(--C);color:${G}">${PL.line.REB} / ${PL.proj.REB} REB</span></div><div class="bar d1" style="margin:8px 0 5px"><i style="width:${PL.line.REB/PL.proj.REB*100}%"></i></div><div class="cap">${PL.play} · 87% of projection with a quarter left</div></div></div>`],
["Category impact","What the rebound did to the matchup category, not just the player.",
 ()=>`<div class="c fx-l" style="left:10px;bottom:10px;width:78%;border-radius:12px;overflow:hidden;background:rgba(12,13,16,.92);backdrop-filter:blur(12px);display:flex">${HS(64,74,"flex:none")}<div style="padding:9px 12px;flex:1"><div class="cap" style="color:${G}">${PL.n} · ${PL.play}</div><div class="C d1" style="font:800 26px/1.05 var(--C);margin-top:4px">REB <span style="color:${G}">${PL.catMe}</span> <span style="color:#555">–</span> <span style="color:${P}">${PL.catOp}</span></div><div class="cap d2" style="margin-top:3px">Gap down to 10 · still his</div></div></div>`],
["Win-chance tick","Leads with the only number that really matters: your win chance moved.",
 ()=>`<div class="c fx-s" style="left:50%;bottom:12px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:7px 14px 7px 7px;border-radius:99px;background:rgba(12,13,16,.94);backdrop-filter:blur(12px);box-shadow:0 0 0 1px #2c2e35;white-space:nowrap">${HS(38,38,"border-radius:50%")}<span class="C" style="font:800 16px/1 var(--C);text-transform:uppercase">${PL.l} <span style="color:${G}">+1 REB</span></span><span style="width:1px;height:20px;background:#333"></span><span class="C" style="font:700 15px/1 var(--C);color:#9aa0aa">WIN ${PL.win0}% <span style="color:#3ecf72">→ ${PL.win1}%</span></span></div>`],
["Cutout over glass","Big headshot breaking out of a frosted panel, broadcast-style but quiet.",
 ()=>`<div class="c" style="left:10px;right:10px;bottom:10px;height:56px;border-radius:12px;background:linear-gradient(90deg,rgba(245,184,46,.22),rgba(12,13,16,.9) 45%);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.08)"></div><div class="c d1" style="left:16px;bottom:10px;z-index:3">${HS(84,86,"background:none")}</div><div class="c d2" style="left:108px;right:16px;bottom:18px;z-index:3;display:flex;align-items:flex-end;justify-content:space-between"><div><div class="C" style="font:800 21px/1 var(--C);text-transform:uppercase">${PL.n}</div><div class="cap" style="margin-top:5px;color:#c9cbd1">${PL.play} · ${PL.line.REB} reb tonight</div></div><div class="C" style="font:800 30px/1 var(--C);color:${G}">+1</div></div>`],
["Jersey watermark","His number huge behind the text. Feels like a team graphic, stays readable.",
 ()=>`<div class="c fx-w" style="left:10px;right:10px;bottom:10px;height:62px;border-radius:12px;overflow:hidden;background:#0d0e12;display:flex;align-items:center;padding:0 14px"><span class="C" style="position:absolute;right:56px;top:-22px;font:800 104px/1 var(--C);color:rgba(245,184,46,.09)">${PL.num}</span><div style="flex:1;position:relative"><div class="cap">${PL.tm} · #${PL.num}</div><div class="C" style="font:800 22px/1 var(--C);text-transform:uppercase;margin-top:4px">${PL.n}</div></div><div style="text-align:right;position:relative"><div class="C" style="font:800 24px/1 var(--C);color:${G}">+1 REB</div><div class="cap" style="margin-top:3px">${PL.line.REB} tonight</div></div></div>`],
["Stat chips","Three small chips: the play, his line, the category. Scannable in half a second.",
 ()=>`<div class="c" style="left:10px;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px"><div class="C" style="font:800 18px/1 var(--C);text-transform:uppercase;text-shadow:0 2px 10px rgba(0,0,0,.8)">${PL.n}</div><div style="display:flex;gap:6px;flex-wrap:wrap">${[[`+1 REB`,G,"#0a0a0c"],[line,"rgba(12,13,16,.9)","#e6e7ea"],[`REB ${PL.catMe}–${PL.catOp}`,"rgba(12,13,16,.9)",P]].map((x,i)=>`<span class="C d${i+1}" style="font:800 13px/1 var(--C);letter-spacing:.06em;padding:7px 10px;border-radius:8px;background:${x[1]};color:${x[2]}">${x[0]}</span>`).join("")}</div></div>`],
["Underline only","No box at all. Name, play and a thin gold rule over the floor's edge. Most cinematic.",
 ()=>`<div class="c" style="left:16px;right:16px;bottom:16px"><div class="C" style="font:800 26px/1 var(--C);text-transform:uppercase;letter-spacing:.02em;text-shadow:0 2px 14px rgba(0,0,0,.9)">${PL.n}</div><div style="height:2px;background:linear-gradient(90deg,${G},transparent);margin:7px 0 6px" class="d1"></div><div class="C d2" style="font:700 13px/1 var(--C);letter-spacing:.16em;text-transform:uppercase;color:#e6e7ea;text-shadow:0 2px 10px rgba(0,0,0,.9)">${PL.play} <span style="color:${G}">+1</span> · ${line}</div></div>`],
["Mini box score","A five-cell box of his night with the cell that just changed lit.",
 ()=>`<div class="c" style="left:10px;right:10px;bottom:10px;border-radius:12px;background:rgba(12,13,16,.94);backdrop-filter:blur(12px);display:flex;align-items:center;gap:10px;padding:8px 10px">${HS(44,44,"border-radius:10px;flex:none")}<div style="flex:1;min-width:0"><div class="C" style="font:800 16px/1 var(--C);text-transform:uppercase">${PL.n} <span class="cap" style="color:${G}">${PL.play}</span></div><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:6px">${["PTS","REB","AST","BLK","TO"].map(k=>`<div class="d1" style="text-align:center;border-radius:6px;padding:4px 0;background:${k==="REB"?"rgba(245,184,46,.16)":"#17181d"}"><div class="C" style="font:800 15px/1 var(--C);color:${k==="REB"?G:"#fff"}">${PL.line[k]}</div><div class="cap" style="font-size:8.5px;margin-top:2px">${k}</div></div>`).join("")}</div></div></div>`],
["Fantasy value","What the play was worth in fantasy terms and his running value tonight.",
 ()=>`<div class="c fx-l" style="left:10px;bottom:10px;right:30%;border-radius:12px;background:rgba(12,13,16,.94);backdrop-filter:blur(12px);padding:10px 12px;border-left:3px solid ${G}"><div class="cap">${PL.n}</div><div style="display:flex;align-items:baseline;gap:8px;margin-top:5px"><span class="C" style="font:800 28px/1 var(--C);color:${G}">+${PL.fpd}</span><span class="cap" style="color:#c9cbd1">value · ${PL.play}</span></div><div class="cap d1" style="margin-top:4px">${PL.fp} tonight · top 10 on the slate</div></div>`],
["Left rail portrait","A tall card hugging the left edge like a trading card. Leaves the middle of the floor open.",
 ()=>`<div class="c fx-l" style="left:10px;top:12px;bottom:12px;width:92px;border-radius:12px;overflow:hidden;background:#0d0e12;display:flex;flex-direction:column;box-shadow:0 0 0 1px #2a2c33">${HS(92,92,"background:linear-gradient(180deg,#2a2210,#0d0e12)")}<div style="padding:7px 8px;flex:1;display:flex;flex-direction:column;justify-content:space-between"><div><div class="C" style="font:800 15px/1 var(--C);text-transform:uppercase">${PL.l}</div><div class="cap" style="margin-top:3px;color:${G}">+1 REB</div></div><div class="M d1" style="font-size:10px;color:#9aa0aa;line-height:1.5">${PL.line.PTS} PTS<br>${PL.line.REB} REB<br>${PL.line.AST} AST</div></div></div>`],
["Split ticket","Two pieces: who on the left, the result on a separate gold tab on the right.",
 ()=>`<div class="c" style="left:10px;right:10px;bottom:10px;display:flex;gap:6px;height:54px"><div class="fx-l" style="flex:1;display:flex;align-items:center;gap:10px;border-radius:12px;background:rgba(12,13,16,.94);backdrop-filter:blur(12px);padding:0 10px 0 4px">${HS(52,54,"background:none")}<div><div class="C" style="font:800 17px/1 var(--C);text-transform:uppercase">${PL.n}</div><div class="cap" style="margin-top:4px">${PL.play} · ${PL.line.REB} reb</div></div></div><div class="d1" style="width:72px;border-radius:12px;background:${G};color:#0a0a0c;display:flex;flex-direction:column;align-items:center;justify-content:center"><span class="C" style="font:800 24px/1 var(--C)">+1</span><span class="cap" style="color:#0a0a0c">REB</span></div></div>`],
["Context line","One line of context a scout would add: this is his third board in four minutes.",
 ()=>`<div class="c" style="left:10px;right:10px;bottom:10px;border-radius:12px;background:rgba(12,13,16,.94);backdrop-filter:blur(12px);padding:10px 12px;display:flex;gap:11px;align-items:center">${HS(44,44,"border-radius:50%;flex:none")}<div style="flex:1"><div class="C" style="font:800 17px/1 var(--C);text-transform:uppercase">${PL.n} <span style="color:${G}">+1 REB</span></div><div class="d1" style="font-size:12px;color:#c9cbd1;margin-top:4px">3rd board in 4 minutes. One off his projection.</div></div></div>`],
["Hairline frame","Ultra-thin outline card, no fill. Lets the court show through.",
 ()=>`<div class="c" style="left:12px;right:12px;bottom:12px;height:56px;border-radius:12px;border:1px solid rgba(255,255,255,.35);background:linear-gradient(90deg,rgba(0,0,0,.55),rgba(0,0,0,.15));display:flex;align-items:center;gap:12px;padding:0 12px">${HS(40,40,"border-radius:50%;flex:none;border:1px solid "+G)}<div style="flex:1"><div class="C" style="font:700 18px/1 var(--C);letter-spacing:.06em;text-transform:uppercase">${PL.n}</div><div class="cap" style="color:#d9dbe0;margin-top:4px">${PL.play} · ${line}</div></div><span class="C" style="font:700 22px/1 var(--C);color:${G}">+1</span></div>`],
["Flush edge bar","Attached to the bottom edge of the stage, full width, like the frame itself changed.",
 ()=>`<div class="c fx-w" style="left:0;right:0;bottom:0;height:46px;background:linear-gradient(90deg,${G},#c98f0a);color:#0a0a0c;display:flex;align-items:center;gap:10px;padding:0 12px"><span class="C" style="font:800 18px/1 var(--C);text-transform:uppercase">${PL.n}</span><span class="C" style="font:700 12.5px/1 var(--C);letter-spacing:.14em;text-transform:uppercase;opacity:.75">${PL.play}</span><span style="margin-left:auto" class="C"><b style="font:800 20px/1 var(--C)">+1 REB</b> <span style="font:700 12px var(--C);opacity:.7;letter-spacing:.1em">· ${PL.line.REB} TONIGHT</span></span></div>`],
["Corner badge","Compact badge in the top-left of the stage, up in the crowd. Never near the action.",
 ()=>`<div class="c fx-s" style="left:10px;top:10px;display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:12px;background:rgba(12,13,16,.92);backdrop-filter:blur(12px);box-shadow:0 0 0 1px #2c2e35">${HS(36,36,"border-radius:9px")}<div><div class="C" style="font:800 14px/1 var(--C);text-transform:uppercase">${PL.l} <span style="color:${G}">+1 REB</span></div><div class="cap" style="font-size:9px;margin-top:3px">${line}</div></div></div>`],
["Projection race","His line vs projection for the stats that matter, as thin bars.",
 ()=>`<div class="c" style="left:10px;right:10px;bottom:10px;border-radius:12px;background:rgba(12,13,16,.94);backdrop-filter:blur(12px);padding:9px 12px;display:flex;gap:12px;align-items:center">${HS(46,50,"border-radius:10px;flex:none")}<div style="flex:1"><div class="C" style="font:800 16px/1 var(--C);text-transform:uppercase">${PL.n} <span class="cap" style="color:${G}">+1 REB</span></div>${[["PTS",18,27.1],["REB",9,10.4],["AST",3,4.6]].map(([k,a,b],i)=>`<div style="display:flex;align-items:center;gap:7px;margin-top:5px"><span class="cap" style="width:26px;color:${k==="REB"?G:"#8a8d96"}">${k}</span><span class="bar" style="flex:1"><i style="width:${a/b*100}%;background:${k==="REB"?G:"#5c5f68"}"></i></span><span class="M" style="font-size:10px;width:52px;text-align:right;color:#c9cbd1">${a}/${b}</span></div>`).join("")}</div></div>`],
["Editorial","Magazine type: big first name in outline, last name solid. Quietly premium.",
 ()=>`<div class="c" style="left:14px;bottom:12px;right:14px;display:flex;align-items:flex-end;justify-content:space-between"><div><div class="C d1" style="font:800 15px/1 var(--C);letter-spacing:.3em;text-transform:uppercase;color:transparent;-webkit-text-stroke:1px #fff">${PL.f}</div><div class="C" style="font:800 34px/.95 var(--C);text-transform:uppercase;text-shadow:0 2px 16px rgba(0,0,0,.8)">${PL.l}</div></div><div style="text-align:right" class="d2"><div class="C" style="font:800 30px/1 var(--C);color:${G};text-shadow:0 2px 16px rgba(0,0,0,.8)">+1</div><div class="cap" style="color:#e6e7ea">${PL.play}</div></div></div>`],
["Two-line ticker","A slim two-row strip: play on top, his live line scrolling underneath.",
 ()=>`<div class="c fx-w" style="left:10px;right:10px;bottom:10px;border-radius:10px;overflow:hidden;background:rgba(12,13,16,.95)"><div style="display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid #1f2126"><i style="width:6px;height:6px;border-radius:50%;background:${G}"></i><span class="C" style="font:800 16px/1 var(--C);text-transform:uppercase">${PL.n}</span><span class="cap" style="color:${G}">${PL.play} +1</span></div><div style="position:relative;height:24px;overflow:hidden"><span class="M" style="position:absolute;white-space:nowrap;top:6px;font-size:11px;color:#9aa0aa;animation:mq 9s linear infinite">${line} · ${PL.line.REB}/${PL.proj.REB} REB PROJ · VALUE ${PL.fp} · REB ${PL.catMe}–${PL.catOp} · ${line}</span></div></div>`],
["Stacked glass, data right","Clean two-column card: identity left, three numbers right (tonight, projection, category).",
 ()=>`<div class="c" style="left:10px;right:10px;bottom:10px;border-radius:14px;background:rgba(14,15,19,.82);backdrop-filter:blur(16px) saturate(1.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 0 1px #2a2c33;display:flex;align-items:center;padding:8px 10px;gap:10px">${HS(44,44,"border-radius:50%;flex:none")}<div style="flex:1;min-width:0"><div class="C" style="font:800 16px/1 var(--C);text-transform:uppercase;white-space:nowrap">${PL.n}</div><div class="cap" style="color:${G};margin-top:4px">${PL.play}</div></div>${[[PL.line.REB,"Tonight"],[PL.proj.REB,"Proj"],[`${PL.catMe}`,"Your REB"]].map((x,i)=>`<div class="d${i+1}" style="text-align:center;padding:0 7px;border-left:1px solid #2a2c33"><div class="C" style="font:800 18px/1 var(--C);color:${i===0?G:"#fff"}">${x[0]}</div><div class="cap" style="font-size:8.5px;margin-top:3px">${x[1]}</div></div>`).join("")}</div>`]
];
css=document.createElement("style");css.textContent=`@keyframes mq{from{left:100%}to{left:-180%}}`;document.head.appendChild(css);
function run(i){const s=document.getElementById("s"+i);s.classList.remove("go");s.innerHTML=O[i][2]();void s.offsetWidth;s.classList.add("go")}
document.getElementById("out").innerHTML=O.map((o,i)=>`<div class="opt"><div class="lab"><b>${i+1}</b><span>${o[0]}</span><button data-r="${i}">Replay</button></div><div class="why">${o[1]}</div><div class="st" id="s${i}"></div></div>`).join("");
O.forEach((o,i)=>run(i));
document.addEventListener("click",e=>{const b=e.target.closest("[data-r]");if(b)run(+b.dataset.r)});
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)run(+e.target.id.slice(1))}),{threshold:.7});
if(!/still/.test(location.search))document.querySelectorAll(".st").forEach(s=>io.observe(s));
</script></body></html>
