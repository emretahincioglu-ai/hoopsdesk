<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gamecast Boards</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--g:#f5b82e;--p:#9d7bff;--bg:#050506;--c:#111216;--c2:#17181d;--b:#23252c;--m:#8a8d96;--t:#eef0f3;--C:"Barlow Condensed","Arial Narrow",sans-serif;--M:"JetBrains Mono",ui-monospace,monospace}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--t);font:14px Inter,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.w{max-width:520px;margin:0 auto;padding-bottom:60px}
h1{margin:0;padding:16px 14px 4px;font:800 26px/1 var(--C);letter-spacing:.04em;text-transform:uppercase}
.sub{padding:0 14px 12px;color:var(--m);font-size:12.5px}
.tabs{position:sticky;top:0;z-index:9;display:flex;gap:6px;padding:10px 14px;background:rgba(5,5,6,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--b)}
.tabs button{flex:1;border:1px solid var(--b);background:var(--c);color:var(--m);font:700 14px/1 var(--C);letter-spacing:.1em;text-transform:uppercase;padding:10px 4px;border-radius:10px}
.tabs button.on{background:var(--t);color:#0a0a0c;border-color:var(--t)}
.opt{padding:18px 14px 4px}
.lab{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.lab b{font:800 13px/1 var(--C);letter-spacing:.12em;color:#0a0a0c;background:var(--t);padding:4px 7px;border-radius:5px}
.lab span{font:700 15px/1 var(--C);letter-spacing:.08em;text-transform:uppercase}
.lab small{color:var(--m);font-size:11.5px;margin-left:auto;text-align:right}
.bx{background:var(--c);border:1px solid var(--b);border-radius:14px;overflow:hidden}
.pad{padding:14px}
.g{color:var(--g)}.p{color:var(--p)}.m{color:var(--m)}
.C{font-family:var(--C)}.row{display:flex;align-items:center}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:800 13px/1 var(--C);color:#0a0a0c;flex:none}
.cap{font:700 11px/1 var(--C);letter-spacing:.14em;text-transform:uppercase;color:var(--m)}
.num{font:800 44px/.9 var(--C)}
.live{display:inline-flex;align-items:center;gap:5px;font:700 11px/1 var(--C);letter-spacing:.14em;color:#ff5a5a}.live i{width:6px;height:6px;border-radius:50%;background:#ff4545;animation:bl 1.4s infinite}
@keyframes bl{50%{opacity:.25}}
table{border-collapse:collapse;width:100%}
.sc{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}.sc::-webkit-scrollbar{display:none}
</style></head><body><div class="w">
<h1>Gamecast boards</h1><div class="sub">60 options · 20 scoreboards · 20 category boards · 20 play-by-play feeds. Tell me the numbers you like (e.g. S7, C11, P3).</div>
<div class="tabs"><button data-t="S" class="on">Scoreboard</button><button data-t="C">Categories</button><button data-t="P">Play-by-play</button></div>
<div id="out"></div>
</div>
<script>
const G="#f5b82e",P="#9d7bff";
const ME={n:"Mastika Magics",sh:"MAGICS",a:"MM",s:5,rec:"2-1",c:G,gl:41},OP={n:"Pierre Crockrell",sh:"CROCKRELL",a:"PC",s:4,rec:"3-0",c:P,gl:48},WIN=56;
const CATS=[["PTS",412,405],["REB",168,172],["AST",101,96],["STL",28,30],["BLK",19,22],["3PM",44,42],["FG%",.472,.460],["FT%",.810,.762],["TO",52,49]];
const f=v=>v<1?v.toFixed(3).slice(1):String(v);
const lead=c=>c[0]==="TO"?(c[1]<c[2]?1:c[1]>c[2]?-1:0):(c[1]>c[2]?1:c[1]<c[2]?-1:0);
const diff=c=>{const d=c[1]-c[2];return c[1]<1?(d>=0?"+":"−")+Math.abs(d).toFixed(3).slice(1):(d>=0?"+":"−")+Math.abs(d)};
const share=c=>{const a=c[1],b=c[2];let s=a/(a+b);if(c[0]==="TO")s=1-s;return Math.max(.08,Math.min(.92,.5+(s-.5)*(c[1]<1?14:9)))};
const col=c=>lead(c)>0?G:lead(c)<0?P:"#8a8d96";
const closeness=c=>Math.abs(c[1]-c[2])/((c[1]+c[2])/2);
const PL=[
{n:"Tyrese Maxey",ln:"Maxey",tm:"PHI",s:"me",t:"Q3 4:12",d:"Pull-up three from 26 ft",st:"+3 PTS",k:"3",good:1,cat:"3PM",sw:"3PM 43 → 44"},
{n:"Anthony Edwards",ln:"Edwards",tm:"MIN",s:"op",t:"Q3 4:40",d:"Driving layup through contact",st:"+2 PTS",k:"2",good:1,cat:"PTS",sw:"PTS 403 → 405"},
{n:"Scottie Barnes",ln:"Barnes",tm:"TOR",s:"me",t:"Q2 0:51",d:"Finds the cutter for the assist",st:"+1 AST",k:"A",good:1,cat:"AST",sw:"AST 100 → 101"},
{n:"Rudy Gobert",ln:"Gobert",tm:"MIN",s:"op",t:"Q2 1:30",d:"Blocks the shot at the rim",st:"+1 BLK",k:"B",good:1,cat:"BLK",sw:"BLK 21 → 22"},
{n:"Tyrese Maxey",ln:"Maxey",tm:"PHI",s:"me",t:"Q3 5:02",d:"Mid-range jumper, 17 ft",st:"+2 PTS",k:"2",good:1,cat:"PTS",sw:"PTS 410 → 412"},
{n:"Tyrese Maxey",ln:"Maxey",tm:"PHI",s:"me",t:"Q3 5:44",d:"Steals the pass at half court",st:"+1 STL",k:"S",good:1,cat:"STL",sw:"STL 27 → 28"},
{n:"Austin Reaves",ln:"Reaves",tm:"LAL",s:"me",t:"Q1 8:15",d:"Throws it away, bad pass",st:"+1 TO",k:"T",good:0,cat:"TO",sw:"TO 51 → 52"},
{n:"Jalen Brunson",ln:"Brunson",tm:"NY",s:"op",t:"Q1 9:02",d:"Step-back three from the wing",st:"+3 PTS",k:"3",good:1,cat:"3PM",sw:"3PM 41 → 42"},
{n:"Evan Mobley",ln:"Mobley",tm:"CLE",s:"me",t:"Q1 9:40",d:"Defensive rebound",st:"+1 REB",k:"R",good:1,cat:"REB",sw:"REB 167 → 168"},
{n:"Anthony Edwards",ln:"Edwards",tm:"MIN",s:"op",t:"Q1 10:11",d:"Lost the handle, turnover",st:"+1 TO",k:"T",good:0,cat:"TO",sw:"TO 48 → 49"}];
const sc=s=>s==="me"?G:P;
const av=(t,sz=34)=>`<span class="av" style="background:${t.c};width:${sz}px;height:${sz}px;font-size:${sz*.38}px">${t.a}</span>`;
const ini=p=>p.n.split(" ").map(x=>x[0]).join("");
const pav=(p,sz=30)=>`<span class="av" style="width:${sz}px;height:${sz}px;font-size:${sz*.38}px;background:#1d1f25;color:${sc(p.s)};border:1.5px solid ${sc(p.s)}">${ini(p)}</span>`;
const LIVE=`<span class="live"><i></i>LIVE</span>`;

/* ================= SCOREBOARDS ================= */
const S=[
["Classic split","Names, big score, win % in the middle",()=>`<div class="bx pad row" style="justify-content:space-between;border-left:4px solid ${G};border-right:4px solid ${P}"><div>${av(ME)}<div style="font-weight:700;margin-top:6px">${ME.n}</div><div class="num">${ME.s}</div><div class="m" style="font-size:12px">${ME.rec}</div></div><div style="text-align:center"><div class="cap">Week 4</div><div class="C" style="font:800 22px/1.2 var(--C);color:#3ecf72">${WIN}%</div></div><div style="text-align:right"><div style="display:flex;justify-content:flex-end">${av(OP)}</div><div style="font-weight:700;margin-top:6px;color:#c9cbd1">${OP.n}</div><div class="num" style="color:#c9cbd1">${OP.s}</div><div class="m" style="font-size:12px">${OP.rec}</div></div></div>`],
["Broadcast bar","One TV-style strip with colour blocks",()=>`<div class="row" style="border-radius:10px;overflow:hidden;height:48px;font-family:var(--C)"><div style="flex:1;background:${G};color:#0a0a0c;height:100%;display:flex;align-items:center;padding:0 10px;font:800 16px/1 var(--C);letter-spacing:.03em;min-width:0">${ME.sh}</div><div style="background:#0c0d10;height:100%;display:flex;align-items:center;padding:0 14px;font:800 30px/1 var(--C)">${ME.s}</div><div style="background:#1c1d23;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 10px"><span class="cap" style="font-size:9.5px">WK 4</span><span style="font:700 12px/1.3 var(--C);color:#ff5a5a;letter-spacing:.12em">LIVE</span></div><div style="background:#0c0d10;height:100%;display:flex;align-items:center;padding:0 14px;font:800 30px/1 var(--C)">${OP.s}</div><div style="flex:1;background:${P};color:#0a0a0c;height:100%;display:flex;align-items:center;justify-content:flex-end;padding:0 10px;font:800 16px/1 var(--C);letter-spacing:.03em;min-width:0">${OP.sh}</div></div>`],
["Win-probability bar","Score on the ends, one thick bar tells the story",()=>`<div class="bx pad"><div class="row" style="justify-content:space-between"><div class="row" style="gap:8px">${av(ME,28)}<b>${ME.n}</b></div><div class="row" style="gap:8px"><b style="color:#c9cbd1">${OP.n}</b>${av(OP,28)}</div></div><div class="row" style="gap:10px;margin-top:10px"><span class="num g" style="font-size:38px">${ME.s}</span><div style="flex:1;height:12px;border-radius:99px;background:${P};overflow:hidden"><div style="width:${WIN}%;height:100%;background:${G};border-right:3px solid #0a0a0c"></div></div><span class="num p" style="font-size:38px">${OP.s}</span></div><div class="row cap" style="justify-content:space-between;margin-top:8px"><span>${WIN}% to win</span><span>${100-WIN}%</span></div></div>`],
["Minimal","Only the score. Nothing else competes",()=>`<div class="pad" style="text-align:center"><div class="cap">${ME.n} <span style="opacity:.5">vs</span> ${OP.n}</div><div style="font:800 76px/.95 var(--C);margin-top:6px"><span class="g">${ME.s}</span><span class="m" style="font-weight:500;margin:0 12px">–</span><span class="p">${OP.s}</span></div><div class="cap" style="margin-top:4px">Week 4 · ${WIN}% to win</div></div>`],
["One-line pill","Smallest possible, leaves room for the court",()=>`<div style="display:flex;justify-content:center"><div class="row" style="gap:10px;background:var(--c);border:1px solid var(--b);border-radius:99px;padding:8px 14px;font:700 16px/1 var(--C);letter-spacing:.06em"><i style="width:8px;height:8px;border-radius:50%;background:${G}"></i>${ME.sh}<b style="font-size:22px">${ME.s}</b><span class="m">·</span><b style="font-size:22px">${OP.s}</b>${OP.sh}<i style="width:8px;height:8px;border-radius:50%;background:${P}"></i><span style="color:#3ecf72;margin-left:4px">${WIN}%</span></div></div>`],
["Arena jumbotron","LED look, glowing digits",()=>`<div style="background:#000;border:2px solid #2a2c33;border-radius:12px;padding:14px;font-family:var(--M);background-image:radial-gradient(#1b1c20 1px,transparent 1px);background-size:4px 4px"><div class="row" style="justify-content:space-between;font-size:12px;letter-spacing:.14em"><span style="color:${G};text-shadow:0 0 8px ${G}">HOME</span><span style="color:#ff4545;text-shadow:0 0 8px #ff4545">● LIVE</span><span style="color:${P};text-shadow:0 0 8px ${P}">AWAY</span></div><div class="row" style="justify-content:space-between;margin-top:6px"><span style="font:700 56px/1 var(--M);color:${G};text-shadow:0 0 18px ${G}">0${ME.s}</span><span style="color:#fff;font-size:13px;text-align:center;line-height:1.5">WK 4<br>${WIN}%</span><span style="font:700 56px/1 var(--M);color:${P};text-shadow:0 0 18px ${P}">0${OP.s}</span></div><div class="row" style="justify-content:space-between;font-size:11px;color:#9a9da6;margin-top:6px"><span>MASTIKA MAGICS</span><span>P. CROCKRELL</span></div></div>`],
["Tug of war","A marker slides toward whoever is winning",()=>`<div class="bx pad"><div class="row" style="justify-content:space-between"><div><div class="cap g">${ME.sh}</div><div class="num">${ME.s}</div></div><div class="cap">Week 4</div><div style="text-align:right"><div class="cap p">${OP.sh}</div><div class="num">${OP.s}</div></div></div><div style="position:relative;height:26px;margin-top:10px"><div style="position:absolute;left:0;right:0;top:11px;height:4px;border-radius:9px;background:linear-gradient(90deg,${G},#2a2c33 50%,${P})"></div><div style="position:absolute;left:50%;top:6px;width:2px;height:14px;background:#555"></div><div style="position:absolute;left:${100-WIN}%;top:0;transform:translateX(-50%);background:#fff;color:#0a0a0c;font:800 13px/26px var(--C);padding:0 9px;border-radius:99px">${WIN}%</div></div></div>`],
["Stacked rows","Two rows like a box score, leader marked",()=>`<div class="bx">${[ME,OP].map((t,i)=>`<div class="row" style="padding:11px 14px;gap:10px;${i?"border-top:1px solid var(--b)":""}">${av(t,30)}<div style="flex:1"><div style="font-weight:700;${t.s<Math.max(ME.s,OP.s)?"color:#a9acb4":""}">${t.n}</div><div class="m" style="font-size:11.5px">${t.rec} · ${t.gl} games left</div></div>${t.s===Math.max(ME.s,OP.s)?`<span style="color:${t.c};font-size:11px">◀</span>`:""}<span class="num" style="font-size:34px;${t.s<Math.max(ME.s,OP.s)?"color:#a9acb4":""}">${t.s}</span></div>`).join("")}</div>`],
["Diagonal versus","Two colours cut on a slant",()=>`<div style="position:relative;border-radius:14px;overflow:hidden;height:104px;background:linear-gradient(105deg,#3a2c08 0,#1a1404 49.6%,#0a0a0c 49.8%,#0a0a0c 50.2%,#150f2b 50.4%,#2a1f55 100%)"><div style="position:absolute;left:14px;top:14px"><div class="cap g">${ME.n}</div><div class="num g" style="font-size:58px;margin-top:6px">${ME.s}</div></div><div style="position:absolute;right:14px;top:14px;text-align:right"><div class="cap p">${OP.n}</div><div class="num p" style="font-size:58px;margin-top:6px">${OP.s}</div></div><div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#0a0a0c;border:1px solid #33353d;border-radius:99px;font:800 13px/1 var(--C);letter-spacing:.1em;padding:7px 10px">VS</div></div>`],
["Category pips","Nine dots show who holds each category",()=>`<div class="bx pad"><div class="row" style="justify-content:space-between"><div class="row" style="gap:8px"><span class="num g" style="font-size:36px">${ME.s}</span><b>${ME.n}</b></div><div class="row" style="gap:8px"><b style="color:#c9cbd1">${OP.n}</b><span class="num p" style="font-size:36px">${OP.s}</span></div></div><div class="row" style="gap:5px;margin-top:12px">${CATS.map(c=>`<div style="flex:1;text-align:center"><div style="height:7px;border-radius:9px;background:${col(c)}"></div><div class="cap" style="font-size:9.5px;margin-top:5px">${c[0]}</div></div>`).join("")}</div></div>`],
["Win ring","A donut for win chance, scores either side",()=>`<div class="bx pad row" style="justify-content:space-between"><div><div class="cap g">${ME.sh}</div><div class="num" style="font-size:52px">${ME.s}</div></div><svg width="84" height="84" viewBox="0 0 84 84"><circle cx="42" cy="42" r="34" fill="none" stroke="${P}" stroke-width="9"/><circle cx="42" cy="42" r="34" fill="none" stroke="${G}" stroke-width="9" stroke-dasharray="${2*Math.PI*34*WIN/100} 999" transform="rotate(-90 42 42)"/><text x="42" y="46" text-anchor="middle" fill="#fff" style="font:800 20px var(--C)">${WIN}%</text><text x="42" y="58" text-anchor="middle" fill="#8a8d96" style="font:700 8px var(--C);letter-spacing:.14em">WIN</text></svg><div style="text-align:right"><div class="cap p">${OP.sh}</div><div class="num" style="font-size:52px">${OP.s}</div></div></div>`],
["Score bug","Small corner box that can sit on top of the court",()=>`<div style="display:inline-block;background:rgba(10,11,14,.9);border:1px solid var(--b);border-radius:8px;overflow:hidden;font-family:var(--C)">${[ME,OP].map(t=>`<div class="row" style="gap:8px;padding:5px 9px 5px 0"><i style="width:4px;height:20px;background:${t.c}"></i><span style="font:700 14px/1 var(--C);letter-spacing:.08em;width:92px">${t.sh}</span><b style="font:800 19px/1 var(--C)">${t.s}</b></div>`).join("")}<div style="background:#1c1d23;padding:4px 9px;font:700 10px/1 var(--C);letter-spacing:.14em;color:#ff5a5a">LIVE · WK 4 · <span style="color:#3ecf72">${WIN}%</span></div></div><span class="m" style="font-size:11.5px;margin-left:10px">sits in a corner of the stage</span>`],
["Flip cards","Old gym scoreboard with flip digits",()=>{const fl=(n,c)=>`<span style="display:inline-block;position:relative;background:linear-gradient(#26282f 0 49%,#0a0a0c 49% 51%,#1b1d23 51%);border-radius:8px;padding:6px 14px;font:800 54px/1 var(--C);color:${c};box-shadow:inset 0 1px 0 #3a3d46">${n}</span>`;return `<div class="bx pad" style="background:#0b0c0f"><div class="row" style="justify-content:space-around"><div style="text-align:center">${fl(ME.s,G)}<div class="cap" style="margin-top:8px">${ME.n}</div></div><div class="cap" style="font-size:16px">:</div><div style="text-align:center">${fl(OP.s,P)}<div class="cap" style="margin-top:8px">${OP.n}</div></div></div></div>`}],
["Glow hero","Big and loud, for the top of the page",()=>`<div style="border-radius:16px;padding:18px 14px;background:radial-gradient(120% 140% at 0 0,rgba(245,184,46,.22),transparent 55%),radial-gradient(120% 140% at 100% 100%,rgba(157,123,255,.24),transparent 55%),#0d0e12;border:1px solid var(--b)"><div class="row" style="justify-content:space-between">${LIVE}<span class="cap">Week 4 · Day 2 of 7</span></div><div class="row" style="justify-content:space-between;margin-top:10px"><div><div style="font:800 64px/.9 var(--C);color:${G};text-shadow:0 0 28px rgba(245,184,46,.5)">${ME.s}</div><div style="font-weight:700;margin-top:6px">${ME.n}</div></div><div style="text-align:right"><div style="font:800 64px/.9 var(--C);color:${P};text-shadow:0 0 28px rgba(157,123,255,.5)">${OP.s}</div><div style="font-weight:700;margin-top:6px">${OP.n}</div></div></div></div>`],
["Momentum line","Score plus how win chance moved today",()=>`<div class="bx pad"><div class="row" style="justify-content:space-between"><div><span class="num g" style="font-size:40px">${ME.s}</span> <span class="cap">${ME.sh}</span></div><div><span class="cap">${OP.sh}</span> <span class="num p" style="font-size:40px">${OP.s}</span></div></div><svg viewBox="0 0 300 54" style="width:100%;height:54px;margin-top:8px"><line x1="0" x2="300" y1="27" y2="27" stroke="#2a2c33" stroke-dasharray="3 4"/><polyline fill="none" stroke="${G}" stroke-width="2.5" stroke-linejoin="round" points="0,30 30,34 60,31 90,38 120,28 150,22 180,26 210,18 240,22 270,16 300,20"/><circle cx="300" cy="20" r="4" fill="${G}"/></svg><div class="row cap" style="justify-content:space-between"><span>Mon</span><span>Win chance · now ${WIN}%</span><span>Now</span></div></div>`],
["Plain sentence","Says it in words, score second",()=>`<div class="bx pad"><div style="font:800 26px/1.1 var(--C);letter-spacing:.01em">You lead <span class="g">${ME.s}</span>–<span class="p">${OP.s}</span></div><div class="m" style="margin-top:6px;font-size:13px">vs ${OP.n} · ${WIN}% to win · 3 categories within reach · ${ME.gl} games left to his ${OP.gl}</div></div>`],
["Banner wings","Centre badge, team wings left and right",()=>`<div class="row" style="height:64px"><div style="flex:1;height:100%;background:linear-gradient(90deg,transparent,rgba(245,184,46,.18));border-bottom:3px solid ${G};display:flex;flex-direction:column;justify-content:center;padding-left:6px"><span class="cap g">${ME.sh}</span><span class="m" style="font-size:11px">${ME.rec}</span></div><div style="background:#fff;color:#0a0a0c;height:100%;padding:0 16px;display:flex;align-items:center;gap:10px;font:800 36px/1 var(--C);clip-path:polygon(10% 0,90% 0,100% 100%,0 100%)">${ME.s}<span style="font-size:14px;opacity:.5">–</span>${OP.s}</div><div style="flex:1;height:100%;background:linear-gradient(270deg,transparent,rgba(157,123,255,.2));border-bottom:3px solid ${P};display:flex;flex-direction:column;justify-content:center;align-items:flex-end;padding-right:6px"><span class="cap p">${OP.sh}</span><span class="m" style="font-size:11px">${OP.rec}</span></div></div>`],
["Neon outline","Outlined digits, night-game feel",()=>`<div class="pad row" style="justify-content:space-around;border:1px solid #2a2c33;border-radius:14px;background:#08080b"><div style="text-align:center"><div style="font:800 62px/1 var(--C);color:transparent;-webkit-text-stroke:2px ${G};filter:drop-shadow(0 0 8px ${G})">${ME.s}</div><div class="cap g">${ME.sh}</div></div><div class="cap" style="writing-mode:vertical-rl;letter-spacing:.3em">WEEK 4</div><div style="text-align:center"><div style="font:800 62px/1 var(--C);color:transparent;-webkit-text-stroke:2px ${P};filter:drop-shadow(0 0 8px ${P})">${OP.s}</div><div class="cap p">${OP.sh}</div></div></div>`],
["Games-left bars","Score with how many games each side still has",()=>`<div class="bx pad">${[ME,OP].map((t,i)=>`<div class="row" style="gap:10px;${i?"margin-top:12px":""}"><span class="num" style="font-size:34px;width:26px;color:${t.c}">${t.s}</span><div style="flex:1"><div class="row" style="justify-content:space-between"><b style="font-size:13px">${t.n}</b><span class="cap">${t.gl} left</span></div><div style="height:6px;border-radius:9px;background:#23252c;margin-top:6px;overflow:hidden"><div style="height:100%;width:${t.gl/48*100}%;background:${t.c}"></div></div></div></div>`).join("")}</div>`],
["Glass card + week bar","Frosted card with how far into the week you are",()=>`<div style="border-radius:16px;padding:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(12px)"><div class="row" style="justify-content:space-between">${LIVE}<span class="cap" style="color:#3ecf72">${WIN}% to win</span></div><div class="row" style="justify-content:space-between;margin-top:10px"><div class="row" style="gap:9px">${av(ME,32)}<span class="num" style="font-size:40px">${ME.s}</span></div><span class="cap">vs</span><div class="row" style="gap:9px"><span class="num" style="font-size:40px">${OP.s}</span>${av(OP,32)}</div></div><div class="row" style="gap:4px;margin-top:12px">${[1,1,0,0,0,0,0].map((d,i)=>`<i style="flex:1;height:4px;border-radius:9px;background:${d?"#fff":i===2?"#ff5a5a":"rgba(255,255,255,.15)"}"></i>`).join("")}</div><div class="row cap" style="justify-content:space-between;margin-top:6px;font-size:10px"><span>Mon</span><span>Day 3 of 7</span><span>Sun</span></div></div>`]
];

/* ================= CATEGORY BOARDS ================= */
const C=[
["Nine columns","Both numbers stacked, leader colour underline",()=>`<div class="bx row" style="padding:10px 4px">${CATS.map((c,i)=>`<div style="flex:1;text-align:center;${i?"border-left:1px solid var(--b)":""}"><div class="cap" style="font-size:10px">${c[0]}</div><div style="font:800 15px/1.5 var(--C);color:${G}">${f(c[1])}</div><div style="font:800 15px/1.2 var(--C);color:${P}">${f(c[2])}</div><div style="height:3px;margin:5px 5px 0;border-radius:9px;background:${col(c)}"></div></div>`).join("")}</div>`],
["Butterfly bars","Your bar grows left, his grows right",()=>`<div class="bx pad">${CATS.map(c=>{const s=share(c);return `<div class="row" style="gap:8px;margin:5px 0"><span style="width:38px;text-align:right;font:800 14px/1 var(--C);color:${lead(c)>0?G:"#8a8d96"}">${f(c[1])}</span><div style="flex:1;display:flex;justify-content:flex-end"><i style="height:8px;border-radius:9px 0 0 9px;width:${s*100}%;background:${G};opacity:${lead(c)>0?1:.35}"></i></div><span class="cap" style="width:30px;text-align:center;font-size:10.5px;color:#fff">${c[0]}</span><div style="flex:1"><i style="display:block;height:8px;border-radius:0 9px 9px 0;width:${(1-s)*100}%;background:${P};opacity:${lead(c)<0?1:.35}"></i></div><span style="width:38px;font:800 14px/1 var(--C);color:${lead(c)<0?P:"#8a8d96"}">${f(c[2])}</span></div>`}).join("")}</div>`],
["Margin pills","One pill per category: who leads and by how much",()=>`<div style="display:flex;flex-wrap:wrap;gap:7px">${CATS.map(c=>`<span style="border:1.5px solid ${col(c)};background:${lead(c)>0?"rgba(245,184,46,.12)":"rgba(157,123,255,.14)"};border-radius:99px;padding:7px 11px;font:800 14px/1 var(--C);letter-spacing:.06em"><span style="color:${col(c)}">${c[0]}</span> <span style="margin-left:4px">${diff(c)}</span></span>`).join("")}</div>`],
["Heat tiles","3×3 grid, colour strength = size of the lead",()=>`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px">${CATS.map(c=>{const a=Math.min(.55,.14+closeness(c)*3);const rgb=lead(c)>0?"245,184,46":"157,123,255";return `<div style="border-radius:10px;padding:10px;background:rgba(${rgb},${a});border:1px solid rgba(${rgb},.5)"><div class="cap" style="color:#fff">${c[0]}</div><div style="font:800 24px/1.1 var(--C);margin-top:4px">${diff(c)}</div><div class="m" style="font-size:11px;color:rgba(255,255,255,.65)">${f(c[1])} · ${f(c[2])}</div></div>`}).join("")}</div>`],
["Split bars","One bar per category, split by share",()=>`<div class="bx pad">${CATS.map(c=>`<div style="margin:7px 0"><div class="row" style="justify-content:space-between;font:800 13px/1 var(--C)"><span class="g">${f(c[1])}</span><span class="cap" style="color:#fff">${c[0]}</span><span class="p">${f(c[2])}</span></div><div style="display:flex;height:6px;border-radius:9px;overflow:hidden;margin-top:4px;gap:2px"><i style="width:${share(c)*100}%;background:${G}"></i><i style="flex:1;background:${P}"></i></div></div>`).join("")}</div>`],
["Plain table","Category, you, him, gap. Nothing fancy",()=>`<div class="bx"><table style="font-size:13px"><tr class="cap"><td style="padding:9px 14px">Cat</td><td style="text-align:right">You</td><td style="text-align:right">Him</td><td style="text-align:right;padding-right:14px">Gap</td></tr>${CATS.map(c=>`<tr style="border-top:1px solid var(--b)"><td style="padding:8px 14px;font:800 14px/1 var(--C);letter-spacing:.08em"><i style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${col(c)};margin-right:8px"></i>${c[0]}</td><td style="text-align:right;font-weight:${lead(c)>0?800:500}">${f(c[1])}</td><td style="text-align:right;font-weight:${lead(c)<0?800:500}">${f(c[2])}</td><td style="text-align:right;padding-right:14px;font-weight:700;color:${col(c)}">${diff(c)}</td></tr>`).join("")}</table></div>`],
["Three buckets","Winning, close, losing. Tells you where to look",()=>{const cl=CATS.filter(c=>closeness(c)<.03),w=CATS.filter(c=>lead(c)>0&&!cl.includes(c)),l=CATS.filter(c=>lead(c)<0&&!cl.includes(c));const b=(t,a,k)=>`<div style="flex:1;background:var(--c);border:1px solid var(--b);border-top:3px solid ${k};border-radius:10px;padding:10px"><div class="cap" style="color:${k}">${t} · ${a.length}</div>${a.map(c=>`<div class="row" style="justify-content:space-between;margin-top:7px;font:800 14px/1 var(--C)"><span>${c[0]}</span><span class="m">${diff(c)}</span></div>`).join("")}</div>`;return `<div class="row" style="gap:6px;align-items:stretch">${b("Winning",w,G)}${b("Close",cl,"#fff")}${b("Losing",l,P)}</div>`}],
["Swipe chips","Big-number chips you scroll sideways",()=>`<div class="sc">${CATS.map(c=>`<div style="flex:none;width:92px;background:var(--c);border:1px solid var(--b);border-bottom:3px solid ${col(c)};border-radius:12px;padding:10px"><div class="cap">${c[0]}</div><div style="font:800 26px/1.1 var(--C);color:${G}">${f(c[1])}</div><div style="font:700 15px/1 var(--C);color:${P}">${f(c[2])}</div></div>`).join("")}</div>`],
["Radar","Shape of your team against his",()=>{const n=CATS.length,pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [110+Math.cos(a)*r,100+Math.sin(a)*r]};const poly=k=>CATS.map((c,i)=>{const s=k?share(c):1-share(c);return pt(i,22+s*62).join(",")}).join(" ");return `<div class="bx pad" style="text-align:center"><svg viewBox="0 0 220 200" style="width:100%;max-width:300px">${[30,55,80].map(r=>`<polygon points="${CATS.map((c,i)=>pt(i,r).join(",")).join(" ")}" fill="none" stroke="#2a2c33"/>`).join("")}<polygon points="${poly(0)}" fill="rgba(157,123,255,.25)" stroke="${P}" stroke-width="2"/><polygon points="${poly(1)}" fill="rgba(245,184,46,.25)" stroke="${G}" stroke-width="2"/>${CATS.map((c,i)=>{const p=pt(i,94);return `<text x="${p[0]}" y="${p[1]+3}" text-anchor="middle" fill="${col(c)}" style="font:800 10px var(--C);letter-spacing:.08em">${c[0]}</text>`}).join("")}</svg></div>`}],
["W/L strip","One thin line: who holds each category",()=>`<div class="row" style="gap:3px">${CATS.map(c=>`<div style="flex:1;text-align:center;padding:8px 0;border-radius:7px;background:${lead(c)>0?G:"#1b1c22"};color:${lead(c)>0?"#0a0a0c":P};font:800 12px/1 var(--C);letter-spacing:.06em;border:1px solid ${lead(c)>0?G:P}">${c[0]}</div>`).join("")}</div><div class="cap" style="margin-top:8px">Filled = yours · outlined = his</div>`],
["Gap to flip","Sorted by how close each one is to changing hands",()=>`<div class="bx">${[...CATS].sort((a,b)=>closeness(a)-closeness(b)).map((c,i)=>`<div class="row" style="padding:10px 14px;gap:10px;${i?"border-top:1px solid var(--b)":""}"><span style="font:800 15px/1 var(--C);letter-spacing:.08em;width:40px;color:${col(c)}">${c[0]}</span><span style="flex:1;font-size:13px">${lead(c)>0?"You lead by":"You trail by"} <b>${diff(c).slice(1)}</b></span>${i<3?`<span style="font:700 10px/1 var(--C);letter-spacing:.12em;background:#fff;color:#0a0a0c;border-radius:4px;padding:4px 6px">IN PLAY</span>`:`<span class="cap" style="font-size:10px">${lead(c)>0?"safe":"far"}</span>`}</div>`).join("")}</div>`],
["Column pairs","Classic grouped bar chart",()=>`<div class="bx pad"><div class="row" style="align-items:flex-end;height:110px;gap:6px">${CATS.map(c=>{const s=share(c);return `<div style="flex:1;display:flex;align-items:flex-end;gap:2px;height:100%"><i style="flex:1;height:${s*100}%;background:${G};border-radius:3px 3px 0 0"></i><i style="flex:1;height:${(1-s)*100}%;background:${P};border-radius:3px 3px 0 0"></i></div>`}).join("")}</div><div class="row" style="gap:6px;margin-top:6px">${CATS.map(c=>`<span class="cap" style="flex:1;text-align:center;font-size:9.5px;color:${col(c)}">${c[0]}</span>`).join("")}</div></div>`],
["Two sides","Your categories on the left, his on the right",()=>{const w=CATS.filter(c=>lead(c)>0),l=CATS.filter(c=>lead(c)<0);const li=(c,r)=>`<div class="row" style="justify-content:space-between;padding:6px 0;${r?"flex-direction:row-reverse":""}"><b style="font:800 15px/1 var(--C);letter-spacing:.08em">${c[0]}</b><span class="m" style="font-size:12px">${f(c[1])}–${f(c[2])}</span></div>`;return `<div class="bx row" style="align-items:stretch"><div style="flex:1;padding:12px 14px;border-top:3px solid ${G}"><div class="num g" style="font-size:30px">${w.length}</div>${w.map(c=>li(c)).join("")}</div><div style="width:1px;background:var(--b)"></div><div style="flex:1;padding:12px 14px;border-top:3px solid ${P};text-align:right"><div class="num p" style="font-size:30px">${l.length}</div>${l.map(c=>li(c,1)).join("")}</div></div>`}],
["Closest three up top","The fights that matter big, the rest small",()=>{const so=[...CATS].sort((a,b)=>closeness(a)-closeness(b));return `<div class="row" style="gap:6px">${so.slice(0,3).map(c=>`<div style="flex:1;background:var(--c);border:1px solid ${col(c)};border-radius:12px;padding:10px;text-align:center"><div class="cap" style="color:${col(c)}">${c[0]}</div><div style="font:800 26px/1.1 var(--C)">${f(c[1])}<span class="m" style="font-size:14px"> / ${f(c[2])}</span></div><div class="cap" style="font-size:10px;margin-top:3px">${diff(c)}</div></div>`).join("")}</div><div class="row" style="gap:5px;margin-top:6px">${so.slice(3).map(c=>`<span style="flex:1;text-align:center;padding:6px 0;border-radius:7px;background:var(--c);font:800 11.5px/1 var(--C);color:${col(c)}">${c[0]} ${diff(c)}</span>`).join("")}</div>`}],
["Mini rings","A small donut per category",()=>`<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px 4px">${CATS.map(c=>{const s=share(c),L=2*Math.PI*17;return `<div style="text-align:center"><svg width="46" height="46" viewBox="0 0 46 46"><circle cx="23" cy="23" r="17" fill="none" stroke="${P}" stroke-width="5" opacity=".55"/><circle cx="23" cy="23" r="17" fill="none" stroke="${G}" stroke-width="5" stroke-dasharray="${L*s} 999" transform="rotate(-90 23 23)"/><text x="23" y="26.5" text-anchor="middle" fill="${col(c)}" style="font:800 10px var(--C)">${c[0]}</text></svg><div style="font:700 11px/1 var(--C)" class="m">${diff(c)}</div></div>`}).join("")}</div>`],
["Text only","Just the category names, coloured",()=>`<div style="font:800 21px/1.5 var(--C);letter-spacing:.08em;text-align:center">${CATS.map(c=>`<span style="color:${col(c)};margin:0 7px">${c[0]}</span>`).join(" ")}</div><div class="cap" style="text-align:center;margin-top:4px"><span class="g">● yours</span> &nbsp; <span class="p">● his</span></div>`],
["Slider markers","A dot on a line for each category",()=>`<div class="bx pad">${CATS.map(c=>`<div class="row" style="gap:10px;margin:8px 0"><span class="cap" style="width:32px;color:#fff">${c[0]}</span><div style="flex:1;position:relative;height:14px"><div style="position:absolute;left:0;right:0;top:6px;height:2px;background:#2a2c33"></div><div style="position:absolute;left:50%;top:2px;width:1px;height:10px;background:#555"></div><i style="position:absolute;top:1px;left:${(1-share(c))*100}%;transform:translateX(-50%);width:12px;height:12px;border-radius:50%;background:${col(c)};box-shadow:0 0 0 3px #111216"></i></div><span style="width:44px;text-align:right;font:800 13px/1 var(--C);color:${col(c)}">${diff(c)}</span></div>`).join("")}<div class="row cap" style="justify-content:space-between;font-size:10px;padding-left:42px;padding-right:54px"><span class="g">◀ you</span><span class="p">him ▶</span></div></div>`],
["Two-line ticker","Sits under the court like a TV crawl",()=>`<div style="background:#0c0d10;border-top:2px solid ${G};border-bottom:2px solid ${P};overflow:hidden"><div class="sc" style="gap:0">${CATS.map(c=>`<div style="flex:none;padding:8px 14px;border-right:1px solid var(--b);font:800 15px/1.2 var(--C);white-space:nowrap"><span class="m" style="letter-spacing:.1em;font-size:11px;display:block">${c[0]}</span><span style="color:${lead(c)>0?G:"#777"}">${f(c[1])}</span> <span style="color:#444">|</span> <span style="color:${lead(c)<0?P:"#777"}">${f(c[2])}</span></div>`).join("")}</div></div>`],
["Leader cards","A card per category with the leader's name",()=>`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px">${CATS.map(c=>`<div style="background:var(--c);border:1px solid var(--b);border-radius:10px;padding:9px"><div class="row" style="justify-content:space-between"><span class="cap" style="color:#fff">${c[0]}</span><i style="width:8px;height:8px;border-radius:50%;background:${col(c)}"></i></div><div style="font:800 19px/1.25 var(--C);margin-top:3px">${f(lead(c)>0?c[1]:c[2])}</div><div style="font-size:10.5px;color:${col(c)};font-weight:700">${lead(c)>0?"You":"Pierre"} ${diff(c).replace("−","+")}</div></div>`).join("")}</div>`],
["Ranked ladder","Bars from the middle, biggest edge on top",()=>`<div class="bx pad">${[...CATS].sort((a,b)=>(share(b)-.5)-(share(a)-.5)).map(c=>{const d=(share(c)-.5)*2;return `<div class="row" style="margin:5px 0;gap:6px"><div style="flex:1;display:flex;justify-content:flex-end">${d>0?`<span style="font:800 12px/14px var(--C);margin-right:6px" class="g">${diff(c)}</span><i style="height:14px;width:${d*100}%;background:${G};border-radius:4px 0 0 4px"></i>`:""}</div><span class="cap" style="width:34px;text-align:center;color:#fff">${c[0]}</span><div style="flex:1;display:flex">${d<0?`<i style="height:14px;width:${-d*100}%;background:${P};border-radius:0 4px 4px 0"></i><span style="font:800 12px/14px var(--C);margin-left:6px" class="p">${diff(c)}</span>`:""}</div></div>`}).join("")}</div>`]
];

/* ================= PLAY-BY-PLAY ================= */
const chip=p=>`<span style="font:800 13px/1 var(--C);letter-spacing:.06em;padding:5px 8px;border-radius:6px;background:${p.good?(p.s==="me"?"rgba(245,184,46,.16)":"rgba(157,123,255,.18)"):"rgba(255,90,90,.15)"};color:${p.good?sc(p.s):"#ff6b6b"};white-space:nowrap">${p.st}</span>`;
const N=6;
const PB=[
["Standard rows","Avatar, name, what happened, stat chip",()=>`<div class="bx">${PL.slice(0,N).map((p,i)=>`<div class="row" style="gap:10px;padding:10px 12px;${i?"border-top:1px solid var(--b)":""}">${pav(p)}<div style="flex:1;min-width:0"><div style="font-weight:700;font-size:13px">${p.n} <span class="m" style="font-weight:500">${p.tm}</span></div><div class="m" style="font-size:12px">${p.d}</div></div>${chip(p)}</div>`).join("")}</div>`],
["Centre timeline","Your plays left, his plays right, time down the middle",()=>`<div style="position:relative"><div style="position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--b)"></div>${PL.slice(0,N).map(p=>`<div class="row" style="margin:8px 0;${p.s==="op"?"flex-direction:row-reverse":""}"><div style="flex:1;background:var(--c);border:1px solid var(--b);border-radius:10px;padding:8px 10px;${p.s==="me"?"border-right:3px solid "+G+";text-align:right":"border-left:3px solid "+P}"><div style="font:800 14px/1 var(--C);letter-spacing:.04em">${p.ln} <span style="color:${p.good?sc(p.s):"#ff6b6b"}">${p.st}</span></div><div class="m" style="font-size:11px;margin-top:3px">${p.d}</div></div><span style="width:54px;text-align:center;font:700 10px/1 var(--C);color:var(--m);position:relative;background:var(--bg);padding:4px 0">${p.t.split(" ")[1]}</span><div style="flex:1"></div></div>`).join("")}</div>`],
["Chat bubbles","Yours on the right in gold, his on the left",()=>`<div>${PL.slice(0,N).map(p=>`<div style="display:flex;margin:6px 0;${p.s==="me"?"justify-content:flex-end":""}"><div style="max-width:78%;padding:8px 12px;border-radius:${p.s==="me"?"14px 14px 4px 14px":"14px 14px 14px 4px"};background:${p.s==="me"?G:"#23202f"};color:${p.s==="me"?"#0a0a0c":"#eee"}"><div style="font:800 14px/1 var(--C);letter-spacing:.04em">${p.ln} · ${p.st}</div><div style="font-size:11.5px;margin-top:3px;opacity:.75">${p.d}</div></div></div>`).join("")}</div>`],
["One-liners","Dense: time, name, stat. Fits the most plays",()=>`<div class="bx" style="padding:4px 0">${PL.slice(0,9).map(p=>`<div class="row" style="gap:8px;padding:6px 12px;font-size:12.5px"><i style="width:3px;height:14px;border-radius:3px;background:${sc(p.s)}"></i><span class="m" style="width:38px;font:700 11px/1 var(--C)">${p.t.split(" ")[1]}</span><b style="flex:1">${p.ln}</b><span class="m" style="font-size:11.5px">${p.d.split(",")[0].slice(0,24)}</span><b style="color:${p.good?sc(p.s):"#ff6b6b"};font:800 13px/1 var(--C);width:50px;text-align:right">${p.st}</b></div>`).join("")}</div>`],
["Stat cards","The stat is the headline of each card",()=>`<div style="display:grid;grid-template-columns:1fr 1fr;gap:7px">${PL.slice(0,N).map(p=>`<div style="background:var(--c);border:1px solid var(--b);border-top:3px solid ${sc(p.s)};border-radius:12px;padding:10px"><div style="font:800 26px/1 var(--C);color:${p.good?sc(p.s):"#ff6b6b"}">${p.st}</div><div style="font-weight:700;font-size:13px;margin-top:6px">${p.n}</div><div class="m" style="font-size:11px">${p.d}</div><div class="cap" style="font-size:9.5px;margin-top:6px">${p.tm} · ${p.t}</div></div>`).join("")}</div>`],
["Grouped by player","One block per player with all his plays",()=>{const g={};PL.forEach(p=>(g[p.n]=g[p.n]||[]).push(p));return `<div class="bx">${Object.values(g).slice(0,4).map((a,i)=>`<div style="padding:10px 12px;${i?"border-top:1px solid var(--b)":""}"><div class="row" style="gap:9px">${pav(a[0],28)}<b style="flex:1">${a[0].n}</b><span class="cap">${a.length} play${a.length>1?"s":""}</span></div><div style="display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;padding-left:37px">${a.map(chip).join("")}</div></div>`).join("")}</div>`}],
["Quarter headers","Plays sit under the quarter they happened in",()=>{const g={};PL.forEach(p=>(g[p.t.split(" ")[0]]=g[p.t.split(" ")[0]]||[]).push(p));return Object.entries(g).map(([q,a])=>`<div class="cap" style="margin:10px 2px 6px">${q.replace("Q","Quarter ")} · ${a.length} plays</div><div class="bx">${a.slice(0,3).map((p,i)=>`<div class="row" style="gap:10px;padding:9px 12px;${i?"border-top:1px solid var(--b)":""}"><span class="m" style="font:700 11px/1 var(--C);width:32px">${p.t.split(" ")[1]}</span><div style="flex:1;font-size:12.5px"><b style="color:${sc(p.s)}">${p.ln}</b> <span class="m">${p.d.toLowerCase()}</span></div>${chip(p)}</div>`).join("")}</div>`).join("")}],
["Category impact","Each play shows what it did to the matchup",()=>`<div class="bx">${PL.slice(0,N).map((p,i)=>`<div style="padding:10px 12px;${i?"border-top:1px solid var(--b)":""}"><div class="row" style="gap:8px"><i style="width:8px;height:8px;border-radius:50%;background:${sc(p.s)}"></i><b style="flex:1;font-size:13px">${p.n}</b>${chip(p)}</div><div class="m" style="font-size:12px;margin:3px 0 0 16px">${p.d}</div><div style="margin:6px 0 0 16px;font:700 11.5px/1 var(--C);letter-spacing:.08em;color:#c9cbd1;background:#1b1c22;display:inline-block;padding:5px 8px;border-radius:6px">${p.sw}</div></div>`).join("")}</div>`],
["Two columns","You on the left, him on the right",()=>{const colm=(s,t)=>`<div style="flex:1;min-width:0"><div class="cap" style="color:${sc(s)};padding-bottom:6px;border-bottom:2px solid ${sc(s)}">${t}</div>${PL.filter(p=>p.s===s).slice(0,5).map(p=>`<div style="padding:8px 0;border-bottom:1px solid var(--b)"><div class="row" style="justify-content:space-between"><b style="font-size:12.5px">${p.ln}</b><b style="font:800 13px/1 var(--C);color:${p.good?sc(s):"#ff6b6b"}">${p.st}</b></div><div class="m" style="font-size:10.5px;margin-top:2px">${p.t}</div></div>`).join("")}</div>`;return `<div class="row" style="gap:12px;align-items:flex-start">${colm("me","Your players")}${colm("op","His players")}</div>`}],
["Stat first","Giant stat on the left, detail on the right",()=>`<div class="bx">${PL.slice(0,N).map((p,i)=>`<div class="row" style="gap:12px;padding:9px 12px;${i?"border-top:1px solid var(--b)":""}"><div style="width:64px;text-align:center"><div style="font:800 28px/.9 var(--C);color:${p.good?sc(p.s):"#ff6b6b"}">${p.st.split(" ")[0]}</div><div class="cap" style="font-size:10px">${p.st.split(" ")[1]}</div></div><div style="flex:1"><div style="font-weight:700;font-size:13px">${p.n}</div><div class="m" style="font-size:11.5px">${p.d} · ${p.t}</div></div></div>`).join("")}</div>`],
["Latest play hero","Newest play big on top, older ones small below",()=>{const p=PL[0];return `<div style="border-radius:14px;padding:14px;background:linear-gradient(120deg,rgba(245,184,46,.2),#111216 60%);border:1px solid ${G}"><div class="row" style="justify-content:space-between">${LIVE}<span class="cap">${p.tm} · ${p.t}</span></div><div style="font:800 30px/1 var(--C);margin-top:8px">${p.n} <span class="g">${p.st}</span></div><div style="font-size:13px;color:#c9cbd1;margin-top:4px">${p.d}</div></div><div style="margin-top:6px">${PL.slice(1,5).map(q=>`<div class="row" style="gap:8px;padding:7px 4px;font-size:12.5px;border-bottom:1px solid var(--b)"><i style="width:6px;height:6px;border-radius:50%;background:${sc(q.s)}"></i><b>${q.ln}</b><span class="m" style="flex:1">${q.d.toLowerCase().slice(0,28)}</span><b style="font:800 13px/1 var(--C);color:${sc(q.s)}">${q.st}</b></div>`).join("")}</div>`}],
["Play-type badges","A round badge says what kind of play it was",()=>`<div class="bx">${PL.slice(0,N).map((p,i)=>`<div class="row" style="gap:10px;padding:9px 12px;${i?"border-top:1px solid var(--b)":""}"><span style="width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font:800 17px/1 var(--C);background:${p.good?sc(p.s):"#ff5a5a"};color:#0a0a0c;flex:none">${p.k}</span><div style="flex:1"><div style="font-size:13px"><b>${p.ln}</b> <span class="m">${p.d.toLowerCase()}</span></div><div class="cap" style="font-size:9.5px;margin-top:3px">${p.tm} · ${p.t}</div></div></div>`).join("")}</div><div class="cap" style="margin-top:8px;font-size:10px">3 three · 2 two · A assist · B block · S steal · R rebound · T turnover</div>`],
["Colour stripe","Team-colour edge, time on the right",()=>`<div>${PL.slice(0,N).map(p=>`<div class="row" style="gap:10px;margin:5px 0;background:var(--c);border-radius:8px;border-left:4px solid ${sc(p.s)};padding:9px 12px"><div style="flex:1"><div style="font:800 15px/1 var(--C);letter-spacing:.03em">${p.n} <span style="color:${p.good?sc(p.s):"#ff6b6b"}">${p.st}</span></div><div class="m" style="font-size:11.5px;margin-top:3px">${p.d}</div></div><span class="cap" style="font-size:10px;text-align:right">${p.t.replace(" ","<br>")}</span></div>`).join("")}</div>`],
["Stat log","Monospace, like a live data feed",()=>`<div style="background:#08090b;border:1px solid var(--b);border-radius:10px;padding:10px 12px;font:500 11.5px/1.75 var(--M)">${PL.slice(0,8).map(p=>`<div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis"><span style="color:#555">${p.t.padEnd(8).replace(/ /g,"&nbsp;")}</span> <span style="color:${sc(p.s)}">${p.ln.toUpperCase().padEnd(8).replace(/ /g,"&nbsp;")}</span> <span style="color:${p.good?"#3ecf72":"#ff6b6b"}">${p.st.padEnd(6).replace(/ /g,"&nbsp;")}</span> <span style="color:#777">${p.d.toLowerCase()}</span></div>`).join("")}<div style="color:${G}">▍</div></div>`],
["Swipe tiles","Recent plays as a row of tiles you scroll",()=>`<div class="sc">${PL.slice(0,8).map((p,i)=>`<div style="flex:none;width:132px;background:${i?"var(--c)":"#1d1a10"};border:1px solid ${i?"var(--b)":G};border-radius:12px;padding:10px"><div class="row" style="justify-content:space-between">${pav(p,26)}<span class="cap" style="font-size:9.5px">${i?p.t.split(" ")[1]:"NOW"}</span></div><div style="font:800 22px/1 var(--C);margin-top:8px;color:${p.good?sc(p.s):"#ff6b6b"}">${p.st}</div><div style="font-weight:700;font-size:12px;margin-top:4px">${p.ln}</div><div class="m" style="font-size:10.5px">${p.d.split(",")[0]}</div></div>`).join("")}</div>`],
["Mini court","A tiny half court shows where it happened",()=>{const sp=[[20,30],[62,14],[40,22],[66,12],[48,16],[14,8]];return `<div class="bx">${PL.slice(0,N).map((p,i)=>`<div class="row" style="gap:10px;padding:8px 12px;${i?"border-top:1px solid var(--b)":""}"><svg width="54" height="40" viewBox="0 0 80 46" style="flex:none;background:#c4996a;border-radius:5px"><rect x="54" y="13" width="26" height="20" fill="none" stroke="#3a2a14" stroke-width="1.2"/><path d="M80 3 H66 A22 22 0 0 0 66 43 H80" fill="none" stroke="#3a2a14" stroke-width="1.2"/><circle cx="74" cy="23" r="2.2" fill="none" stroke="#b0321d" stroke-width="1.2"/><circle cx="${sp[i][0]+6}" cy="${sp[i][1]+8}" r="4.5" fill="${sc(p.s)}" stroke="#0a0a0c" stroke-width="1.5"/></svg><div style="flex:1"><div style="font-weight:700;font-size:13px">${p.n}</div><div class="m" style="font-size:11.5px">${p.d}</div></div>${chip(p)}</div>`).join("")}</div>`}],
["Running score","Every play shows the matchup score after it",()=>{const scs=["5–4","4–4","5–4","4–5","5–4","4–4"];return `<div class="bx">${PL.slice(0,N).map((p,i)=>`<div class="row" style="gap:10px;padding:9px 12px;${i?"border-top:1px solid var(--b)":""}"><div style="width:44px;text-align:center;background:#1b1c22;border-radius:7px;padding:6px 0;font:800 15px/1 var(--C)">${scs[i]}</div><div style="flex:1"><div style="font-size:13px"><b style="color:${sc(p.s)}">${p.ln}</b> ${p.st}</div><div class="m" style="font-size:11.5px">${p.d}</div></div><span class="cap" style="font-size:10px">${p.t.split(" ")[1]}</span></div>`).join("")}</div>`}],
["Hot streaks","Back-to-back plays by one player fold into a run",()=>`<div class="bx"><div style="padding:11px 12px;background:linear-gradient(90deg,rgba(245,184,46,.16),transparent)"><div class="row" style="gap:10px">${pav(PL[0],32)}<div style="flex:1"><div style="font-weight:800">Tyrese Maxey <span style="font:800 10px/1 var(--C);letter-spacing:.12em;background:${G};color:#0a0a0c;padding:3px 6px;border-radius:4px;margin-left:4px">3 IN A ROW</span></div><div class="m" style="font-size:12px">Three, jumper, steal in 92 seconds</div></div></div><div class="row" style="gap:5px;margin:8px 0 0 42px">${[PL[0],PL[4],PL[5]].map(chip).join("")}</div></div>${[PL[1],PL[2],PL[3]].map(p=>`<div class="row" style="gap:10px;padding:9px 12px;border-top:1px solid var(--b)">${pav(p,26)}<div style="flex:1;font-size:12.5px"><b>${p.ln}</b> <span class="m">${p.d.toLowerCase()}</span></div>${chip(p)}</div>`).join("")}</div>`],
["Good or bad for you","Green helps you, red hurts you, whoever did it",()=>`<div>${PL.slice(0,N).map(p=>{const help=(p.s==="me")===!!p.good;const k=help?"#3ecf72":"#ff5a5a";return `<div class="row" style="gap:10px;margin:5px 0;padding:9px 12px;border-radius:10px;background:${help?"rgba(62,207,114,.09)":"rgba(255,90,90,.09)"};border:1px solid ${help?"rgba(62,207,114,.3)":"rgba(255,90,90,.3)"}"><span style="font:800 16px/1 var(--C);color:${k};width:14px">${help?"▲":"▼"}</span><div style="flex:1"><div style="font-size:13px"><b>${p.n}</b> <span class="m">${p.s==="me"?"yours":"his"}</span></div><div class="m" style="font-size:11.5px">${p.d}</div></div><b style="font:800 14px/1 var(--C);color:${k}">${p.st}</b></div>`}).join("")}</div>`],
["Dense table","Time, player, play, stat in tight columns",()=>`<div class="bx"><table style="font-size:12px"><tr class="cap" style="font-size:10px"><td style="padding:8px 0 8px 12px">Time</td><td>Player</td><td>Play</td><td style="text-align:right;padding-right:12px">Stat</td></tr>${PL.slice(0,9).map(p=>`<tr style="border-top:1px solid var(--b)"><td style="padding:7px 0 7px 12px;color:var(--m);white-space:nowrap">${p.t}</td><td style="font-weight:700;color:${sc(p.s)}">${p.ln}</td><td class="m">${p.d.split(",")[0].slice(0,22)}</td><td style="text-align:right;padding-right:12px;font:800 13px/1 var(--C);color:${p.good?"#fff":"#ff6b6b"}">${p.st}</td></tr>`).join("")}</table></div>`]
];
const SETS={S,C,P:PB};
function show(t){document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));document.getElementById("out").innerHTML=SETS[t].map((o,i)=>`<div class="opt"><div class="lab"><b>${t}${i+1}</b><span>${o[0]}</span></div><div class="m" style="font-size:12px;margin:-2px 0 10px">${o[1]}</div>${o[2]()}</div>`).join("");scrollTo(0,0)}
document.querySelector(".tabs").onclick=e=>{const b=e.target.closest("button");if(b)show(b.dataset.t)};
show((location.hash||"#S").slice(1).toUpperCase() in SETS?(location.hash||"#S").slice(1).toUpperCase():"S");
</script></body></html>
