<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Player of the Night Panels</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--c:#0C2340;--c2:#C8102E;--g:#85714D;--y:#ffc62b}
*{box-sizing:border-box}body{margin:0;background:#0b0b0d;color:#f4f4f5;font:14px -apple-system,system-ui,sans-serif}
h1{font:900 22px "Roboto Condensed";margin:18px 16px 4px}p.s{margin:0 16px 14px;color:#9a9ca2;font-size:13px}
.grid{display:flex;flex-wrap:wrap;gap:18px;padding:0 16px 40px;justify-content:center}
.ph{width:390px;max-width:100%;border-radius:22px;overflow:hidden;padding:14px 14px 10px;position:relative;
background:linear-gradient(rgba(0,0,0,.38),rgba(0,0,0,.38)),radial-gradient(ellipse 120% 75% at 22% 55%,color-mix(in srgb,#e07a5f 80%,#fff 20%) 0%,#e07a5f 32%,color-mix(in srgb,#e07a5f 45%,#0b0b0d) 62%,#0b0b0d 96%)}
.tag{position:absolute;top:10px;right:12px;font:800 11px "Roboto Condensed";background:#000;color:var(--y);padding:3px 8px;border-radius:20px;z-index:5}
.cap{font:800 12px "Roboto Condensed";letter-spacing:.12em;color:var(--y);text-transform:uppercase}
.h1{font:900 30px/1 "Roboto Condensed";text-transform:uppercase;margin:2px 0 10px}
.ring{position:relative;flex:none;width:96px;height:96px}
.ring .ci{width:96px;height:96px;border-radius:50%;overflow:hidden;background:var(--c);display:flex;align-items:flex-end;justify-content:center}
.ring .ci img{width:122%;margin-bottom:-4px}
.ring .lg{position:absolute;right:-4px;top:0;width:30px;height:30px;border-radius:50%;background:#fff;padding:3px;box-shadow:0 0 0 2px #0b0b0d}
.ring .val{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);background:#000;border-radius:8px;padding:2px 7px;font:900 16px "Roboto Condensed";color:var(--y);white-space:nowrap}
.ring .val small{font-size:9px;color:#c9cacf;margin-left:2px}
.nm{font:900 19px/1.05 "Roboto Condensed";text-transform:uppercase}.tm{font-size:12px;color:#c9cacf;margin:2px 0 7px}.tm b{color:#7cb6ff}
.bx{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}.bx>div{background:rgba(255,255,255,.08);border-radius:6px;text-align:center;padding:3px 0}
.bx b{display:block;font:800 15px/1.1 "Roboto Condensed"}.bx small{display:block;font-size:8.5px;color:#a9abb1;letter-spacing:.04em}
.row{display:flex;gap:12px;align-items:center}.row .m{flex:1;min-width:0}
.list{margin-top:12px;background:rgba(10,10,12,.62);border-radius:14px;padding:6px 10px;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.li{display:flex;align-items:center;gap:9px;padding:6px 0;border-top:1px solid rgba(255,255,255,.06);opacity:.85}.li:first-child{border:0}
.li i{width:34px;height:34px;border-radius:50%;background:#552583;overflow:hidden;display:block}.li i img{width:130%;margin-left:-15%}
.li b{flex:1;font:800 13px "Roboto Condensed"}.li span{font:900 14px "Roboto Condensed";color:var(--y)}
.lbl{font:800 12px "Roboto Condensed";color:#fff;margin:8px 2px 0;letter-spacing:.03em}.lbl span{color:#9a9ca2;font:500 12px system-ui}

/* 1 team glass */
.v1 .pan{background:linear-gradient(135deg,color-mix(in srgb,var(--c) 85%,transparent),rgba(10,10,12,.7));border-radius:16px;padding:14px 12px;box-shadow:0 0 0 1px rgba(255,255,255,.14),0 8px 22px rgba(0,0,0,.35);border-left:4px solid var(--c2)}
/* 2 spotlight */
.v2 .pan{background:radial-gradient(circle at 18% 40%,color-mix(in srgb,var(--c2) 55%,transparent) 0,transparent 45%),rgba(12,12,14,.8);border-radius:16px;padding:14px 12px;box-shadow:0 0 0 1px rgba(255,255,255,.1)}
.v2 .ring .ci{box-shadow:0 0 0 3px var(--c2),0 0 30px color-mix(in srgb,var(--c2) 70%,transparent)}
/* 3 split */
.v3 .pan{display:grid;grid-template-columns:118px 1fr;border-radius:16px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.12)}
.v3 .l{background:linear-gradient(180deg,var(--c2),var(--c));display:flex;align-items:center;justify-content:center;padding:14px 0}
.v3 .r{background:rgba(12,12,14,.85);padding:12px}
.v3 .ring .ci{background:transparent}
/* 4 gold trophy */
.v4 .pan{position:relative;background:linear-gradient(180deg,rgba(30,25,12,.85),rgba(12,12,14,.88));border-radius:16px;padding:16px 12px 14px;box-shadow:0 0 0 1.5px var(--y),0 0 24px rgba(255,198,43,.18)}
.v4 .rib{position:absolute;top:-1px;right:16px;background:var(--y);color:#111;font:900 13px "Roboto Condensed";padding:4px 9px 8px;clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%)}
.v4 .bx>div{background:rgba(255,198,43,.09)}
/* 5 jersey stripes */
.v5 .pan{background:repeating-linear-gradient(115deg,rgba(255,255,255,.035) 0 10px,transparent 10px 22px),linear-gradient(120deg,var(--c) 0%,color-mix(in srgb,var(--c) 60%,#0b0b0d) 70%);border-radius:16px;padding:14px 12px;box-shadow:inset 0 3px 0 var(--c2),0 0 0 1px rgba(255,255,255,.12)}
/* 6 watermark number */
.v6 .pan{position:relative;overflow:hidden;background:rgba(12,12,14,.82);border-radius:16px;padding:14px 12px;box-shadow:0 0 0 1px rgba(255,255,255,.12)}
.v6 .wm{position:absolute;left:-8px;bottom:-34px;font:900 130px/1 "Roboto Condensed";color:color-mix(in srgb,var(--c2) 22%,transparent);letter-spacing:-4px;pointer-events:none}
.v6 .pan>*:not(.wm){position:relative}
/* 7 banner */
.v7 .pan{border-radius:16px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.12)}
.v7 .top{position:relative;height:118px;background:linear-gradient(110deg,var(--c) 0 55%,var(--c2) 55% 58%,var(--c) 58%);display:flex;align-items:flex-end;padding:0 12px 10px}
.v7 .top img.big{position:absolute;right:4px;bottom:0;height:126px}
.v7 .top .lg{position:absolute;left:12px;top:10px;width:30px;height:30px;background:#fff;border-radius:50%;padding:3px}
.v7 .top .val{position:absolute;right:12px;top:10px;background:#000;border-radius:8px;padding:2px 8px;font:900 18px "Roboto Condensed";color:var(--y)}
.v7 .bot{background:rgba(12,12,14,.9);padding:10px 12px 12px}
/* 8 ticket */
.v8 .pan{background:rgba(14,15,18,.86);border-radius:16px;box-shadow:0 0 0 1px rgba(255,255,255,.12);overflow:hidden}
.v8 .a{padding:14px 12px 12px;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 70%,transparent),transparent)}
.v8 .perf{height:0;border-top:2px dashed rgba(255,255,255,.18);margin:0 14px;position:relative}
.v8 .perf:before,.v8 .perf:after{content:"";position:absolute;top:-9px;width:16px;height:16px;border-radius:50%;background:#2a1712}.v8 .perf:before{left:-22px}.v8 .perf:after{right:-22px}
.v8 .b{padding:10px 12px 12px}
/* 9 two-tone band */
.v9 .pan{border-radius:16px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.12)}
.v9 .band{background:var(--c);padding:12px 12px 10px;border-bottom:3px solid var(--c2)}
.v9 .low{background:rgba(12,12,14,.9);padding:10px 12px 12px}
/* 10 minimal espn */
.v10 .pan{position:relative;overflow:hidden;background:#16171a;border-radius:12px;padding:14px 12px;box-shadow:inset 0 4px 0 var(--c2)}
.v10 .wml{position:absolute;right:-30px;bottom:-30px;width:150px;opacity:.07}
.v10 .pan>*:not(.wml){position:relative}
</style></head><body>
<h1>Player of the Night — 10 panels</h1><p class="s">Jeremiah Fears (NOP) as the sample. The panel colors come from each player's NBA team, so they change every night. Background is already the new darker version.</p>
<div class="grid" id="g"></div>
<script>
const P={n:"Jeremiah Fears",min:29,tm:"Bay",val:"13.8",img:"https://a.espncdn.com/i/headshots/nba/players/full/5144091.png",lg:"https://a.espncdn.com/i/teamlogos/nba/500/scoreboard/no.png"};
const S=[["22","PTS"],["8","REB"],["13","AST"],["3","3PM"],["2","STL"],["4","BLK"],["9-16","FG"],["1-3","FT"],["3","TO"],["29","MIN"]];
const bx=`<div class="bx">${S.map(([v,k])=>`<div><b>${v}</b><small>${k}</small></div>`).join("")}</div>`;
const ring=(nolg)=>`<div class="ring"><div class="ci"><img src="${P.img}"></div>${nolg?"":`<img class="lg" src="${P.lg}">`}<div class="val">${P.val}<small>VAL</small></div></div>`;
const meta=`<div class="nm">${P.n}</div><div class="tm">${P.min} MIN · <b>${P.tm}</b></div>`;
const std=`<div class="row">${ring()}<div class="m">${meta}${bx}</div></div>`;
const L=[["Acuff","12.4","4433218"],["Okongwu","11.1","4431680"]];
const list=`<div class="list">${L.map(([n,v,id],i)=>`<div class="li"><i><img src="https://a.espncdn.com/i/headshots/nba/players/full/${id}.png" onerror="this.remove()"></i><b>${i+2} · ${n.toUpperCase()}</b><span>${v}</span></div>`).join("")}</div>`;
const V=[
["Team glass","Team color fading into dark glass, red accent edge on the left.",`<div class="pan">${std}</div>`],
["Spotlight","Dark panel, team-color glow behind the photo, ring around the headshot.",`<div class="pan">${std}</div>`],
["Split card","Left column in team colors holds the photo, right side is the stats.",`<div class="pan"><div class="l">${ring()}</div><div class="r">${meta}${bx}</div></div>`],
["Gold trophy","Gold border + #1 ribbon. Same look every night (no team color).",`<div class="pan"><div class="rib">#1</div>${std}</div>`],
["Jersey stripes","Team color with subtle diagonal jersey stripes and a red top line.",`<div class="pan">${std}</div>`],
["Big number","Dark panel with the VAL as a huge faded watermark in team color.",`<div class="pan"><div class="wm">${P.val}</div>${std}</div>`],
["Banner","Big cut-out photo on a team-color banner, box score full width below.",`<div class="pan"><div class="top"><img class="lg" src="${P.lg}"><div class="val">${P.val} <small style="font-size:9px;color:#c9cacf">VAL</small></div><img class="big" src="${P.img}"><div>${meta}</div></div><div class="bot">${bx}</div></div>`],
["Ticket","Player on top, box score on a torn-off stub below a dashed line.",`<div class="pan"><div class="a"><div class="row">${ring()}<div class="m">${meta}</div></div></div><div class="perf"></div><div class="b">${bx}</div></div>`],
["Two-tone band","Team-color band with photo + name, dark lower half for stats.",`<div class="pan"><div class="band"><div class="row">${ring()}<div class="m">${meta}</div></div></div><div class="low">${bx}</div></div>`],
["Minimal ESPN","App-style #16171a card, team-color top bar, faint team logo watermark.",`<div class="pan"><img class="wml" src="${P.lg}">${std}</div>`]];
document.getElementById("g").innerHTML=V.map(([t,d,h],i)=>`<div><div class="ph v${i+1}"><span class="tag">${i+1}</span><div class="cap">Top 10 · Thu, Oct 29</div><div class="h1">Player of the night</div>${h}${list}</div><div class="lbl">${i+1}. ${t} <span>— ${d}</span></div></div>`).join("");
</script></body></html>
