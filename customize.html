<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}</style></head><body>
<title>2K Card Customizer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: sticky live card on the left, control groups on the right; stacks on phone */
:root{--bg:#0c0d10;--panel:#16171b;--line:#26272d;--fg:#eceef2;--mut:#8b8e96;--acc:#ffc62b;color-scheme:dark;
--f:"Inter",system-ui,sans-serif;--fc:"Roboto Condensed","Arial Narrow",sans-serif}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
h1{font:800 18px var(--f);margin:0 0 2px}
.sub{color:var(--mut);font-size:12.5px;margin:0 0 14px}
.wrap{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:20px;max-width:1100px}
@media (max-width:820px){.wrap{grid-template-columns:minmax(0,1fr)}}
.stage{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);align-self:start;padding:18px 14px;border-radius:14px;background:#000;z-index:2}
@media (max-width:820px){.stage{position:static}}
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.tiers button{padding:7px 0;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:700 11px var(--f);letter-spacing:.06em;cursor:pointer}
.tiers button[aria-pressed=true]{border-color:var(--t);color:var(--t);box-shadow:inset 0 0 0 1px var(--t)}
.ctl{display:flex;flex-direction:column;gap:12px;min-width:0}
.grp{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.grp h2{font:700 11px var(--f);letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:0 0 10px}
.row{display:flex;align-items:center;gap:10px;min-height:34px;flex-wrap:wrap}
.row>label{width:120px;font-size:13px;color:#d4d6db;flex:none}
.row input[type=range]{flex:1;min-width:120px;accent-color:var(--acc)}
.row output{width:34px;text-align:right;font:700 12px var(--fc);color:var(--mut)}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{padding:6px 10px;border-radius:7px;border:1px solid var(--line);background:#1d1e23;color:#cfd1d6;font:600 12px var(--f);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--acc);color:#111;border-color:var(--acc)}
input[type=color]{width:34px;height:28px;border:1px solid var(--line);border-radius:6px;background:none;padding:0;cursor:pointer}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.sw label{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#d4d6db}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.presets button,.act button{padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:#1d1e23;color:var(--fg);font:600 12.5px var(--f);cursor:pointer}
.act{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.act .pri{background:var(--acc);color:#111;border-color:var(--acc)}
textarea{width:100%;height:90px;margin-top:8px;background:#0f1013;border:1px solid var(--line);border-radius:8px;color:#aeb1b8;font:11px ui-monospace,monospace;padding:8px;resize:vertical}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* ===== the card ===== */
.lbl{font:800 13px var(--f);letter-spacing:.14em;margin:0 0 8px 4px;color:var(--t)}
.card{--t:#b57bff;position:relative;border-radius:var(--rad);background:var(--cbg);overflow:hidden;font-family:var(--f)}
.card .hd{position:relative;display:flex;gap:16px;align-items:center;padding:20px 20px 16px}
.card .band{position:absolute;inset:0;pointer-events:none}
.hex{position:relative;flex:none;width:76px;height:86px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);display:flex;flex-direction:column;align-items:center;justify-content:center}
.hex b{font:800 34px/1 var(--fc);letter-spacing:-.01em}
.hex small{font:700 10px var(--f);letter-spacing:.14em;margin-top:2px}
.nm{position:relative;min-width:0;flex:1}
.nm h3{margin:0;font:800 26px/1.1 var(--f);color:#fff;letter-spacing:-.01em}
.nm .nk{font:800 italic 16px var(--f);letter-spacing:.08em;color:var(--nick);margin:3px 0 6px}
.nm .ar{font:700 12.5px var(--f);letter-spacing:.09em;color:#d4d6db}
.nm .ob{font:400 12.5px var(--f);color:#8e9096;margin-top:4px}
.pill{position:absolute;top:16px;right:16px;font:800 11px var(--f);letter-spacing:.12em;padding:4px 10px;border-radius:7px;color:var(--t);border:1.5px solid var(--t);background:color-mix(in srgb,var(--t) 18%,transparent)}
.div{height:1px;background:var(--line2);margin:0 20px}
.at{display:grid;grid-template-columns:1fr 1fr;gap:4px 22px;padding:14px 20px}
.al{display:grid;grid-template-columns:34px 28px 1fr;align-items:center;gap:6px;height:30px}
.al span{font:600 12px var(--f);letter-spacing:.04em;color:#c9cbd0}
.al b{font:800 19px var(--fc);color:#fff}
.sg{display:grid;grid-template-columns:repeat(10,1fr);gap:2.5px}
.sg i{height:6px;border-radius:2px;background:var(--seg0)}
.bd{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:14px 20px 18px}
.bdg{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;background:var(--tile)}
.bdg .hb{width:28px;height:32px;flex:none;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);display:grid;place-items:center}
.bdg .hb::after{content:"";width:22px;height:25px;clip-path:inherit;background:inherit;filter:brightness(1.15)}
.bdg p{margin:0;font:700 14px var(--f);color:#fff;line-height:1.2}
.bdg small{font:500 11.5px var(--f);color:#8e9096;letter-spacing:.04em}
.bdg small u{text-decoration:none;font-weight:800}
.stripe{position:absolute;left:0;top:0;bottom:0;pointer-events:none}
.cr{position:absolute;pointer-events:none;border-color:var(--crc);border-style:solid;border-width:0}
.cr.tl{top:var(--cri);left:var(--cri);border-top-width:var(--crw);border-left-width:var(--crw)}
.cr.tr{top:var(--cri);right:var(--cri);border-top-width:var(--crw);border-right-width:var(--crw)}
.cr.bl{bottom:var(--cri);left:var(--cri);border-bottom-width:var(--crw);border-left-width:var(--crw)}
.cr.br{bottom:var(--cri);right:var(--cri);border-bottom-width:var(--crw);border-right-width:var(--crw)}
.outl{position:absolute;inset:0;border-radius:inherit;pointer-events:none}
.goatfx{background-size:200% 100%!important;animation:shine 2.4s linear infinite}
@keyframes shine{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.goatfx{animation:none}}
@media (max-width:420px){.nm h3{font-size:22px}.hex{width:64px;height:72px}.hex b{font-size:28px}.at{gap:4px 14px;padding:12px 14px}.bd{padding:12px 14px 14px}.bdg{padding:8px}.bdg p{font-size:12.5px}.card .hd{padding:16px 14px 14px;gap:12px}.div{margin:0 14px}}
</style>

<h1>2K Card Customizer</h1>
<p class="sub">Changes save on this phone and show on every player card in the app right away. <b>Label above</b> only shows here. <a href="./" style="color:var(--acc);font-weight:700">← Back to app</a></p>

<div class="wrap">
  <div class="stage">
    <div class="tiers" id="tiers"></div>
    <div id="out"></div>
  </div>

  <div class="ctl">
    <div class="grp"><h2>Start from</h2>
      <div class="presets" id="presets"></div>
    </div>

    <div class="grp"><h2>Background</h2>
      <div class="row"><label for="cbg">Card color</label><input type="color" id="cbg"></div>
      <div class="row"><label>Header band</label><div class="seg" data-k="band" data-o="off,tint,gradient,full"></div></div>
      <div class="row"><label for="bandA">Band strength</label><input type="range" id="bandA" min="0" max="60"><output></output></div>
      <div class="row"><label for="wash">Card tint</label><input type="range" id="wash" min="0" max="30"><output></output></div>
      <div class="row"><label for="tile">Badge tile</label><input type="color" id="tile"></div>
    </div>

    <div class="grp"><h2>Outline</h2>
      <div class="row"><label>Style</label><div class="seg" data-k="outline" data-o="off,thin,glow,gradient"></div></div>
      <div class="row"><label for="olW">Width</label><input type="range" id="olW" min="0.5" max="6" step="0.5"><output></output></div>
      <div class="row"><label for="glow">Glow</label><input type="range" id="glow" min="0" max="40"><output></output></div>
      <div class="row"><label for="rad">Corner radius</label><input type="range" id="rad" min="0" max="28"><output></output></div>
    </div>

    <div class="grp"><h2>Corners &amp; side</h2>
      <div class="row"><label>Brackets</label><div class="seg" data-k="brk" data-o="off,on"></div></div>
      <div class="row"><label for="crS">Bracket size</label><input type="range" id="crS" min="8" max="40"><output></output></div>
      <div class="row"><label for="crW">Bracket weight</label><input type="range" id="crW" min="1" max="5"><output></output></div>
      <div class="row"><label for="crI">Bracket inset</label><input type="range" id="crI" min="0" max="16"><output></output></div>
      <div class="row"><label>Side stripe</label><div class="seg" data-k="stripe" data-o="off,solid,fade"></div></div>
      <div class="row"><label for="stW">Stripe width</label><input type="range" id="stW" min="2" max="10"><output></output></div>
    </div>

    <div class="grp"><h2>Badge &amp; labels</h2>
      <div class="row"><label>OVR hexagon</label><div class="seg" data-k="hex" data-o="white,tier,outline,dark"></div></div>
      <div class="row"><label>Tier pill</label><div class="seg" data-k="pill" data-o="off,on"></div></div>
      <div class="row"><label>Label above</label><div class="seg" data-k="above" data-o="off,on"></div></div>
      <div class="row"><label>Bar colors</label><div class="seg" data-k="bars" data-o="tier,mono"></div></div>
    </div>

    <div class="grp"><h2>All colors</h2>
      <div class="sw">
        <label><input type="color" id="c_brz">Bronze under 70</label>
        <label><input type="color" id="c_sil">Silver 70–79</label>
        <label><input type="color" id="c_gd">Gold 80–89</label>
        <label><input type="color" id="c_hof">HOF 90–94</label>
        <label><input type="color" id="c_leg">Legend 95–98</label>
        <label><input type="color" id="c_goat">GOAT 99</label>
        <label><input type="color" id="nick">Nickname</label>
        <label><input type="color" id="seg1">Bar under 80</label>
        <label><input type="color" id="seg0">Empty bar</label>
        <label><input type="color" id="line2">Dividers</label>
        <label><input type="color" id="crc">Bracket color</label>
      </div>
      <div class="row" style="margin-top:6px"><label>Bracket color</label><div class="seg" data-k="crMode" data-o="tier,custom"></div></div>
    </div>

    <div class="grp"><h2>Save</h2>
      <div class="act"><button class="pri" id="copy">Copy settings</button><button id="reset">Reset</button></div>
      <textarea id="json" readonly aria-label="Settings"></textarea>
    </div>
  </div>
</div>

<script>
const TIERS={brz:{n:"BRONZE",ovr:65},sil:{n:"SILVER",ovr:75},gd:{n:"GOLD",ovr:85},hof:{n:"HOF",ovr:92},leg:{n:"LEGEND",ovr:96},goat:{n:"GOAT",ovr:99}};
const BASE={"tier":"leg","cbg":"#1e1f24","band":"off","bandA":0,"wash":4,"tile":"#26272c","outline":"thin","olW":0.5,"glow":0,"rad":18,"brk":"off","crS":22,"crW":2,"crI":8,"stripe":"off","stW":5,"hex":"tier","pill":"off","above":"off","bars":"tier","c_brz":"#c98a55","c_sil":"#c3c8d1","c_gd":"#ffc62b","c_hof":"#b57bff","c_leg":"#e22400","c_goat":"#ff6a00","nick":"#ffc62b","seg1":"#cfd0d4","seg0":"#34353b","line2":"#2c2d33","crc":"#ff4d5e","crMode":"tier"};
const PRESETS={
 "Header band":{band:"gradient",bandA:30,outline:"off",brk:"off",stripe:"off",pill:"off",hex:"tier",rad:18},
 "Brackets":{band:"off",outline:"off",brk:"on",stripe:"off",pill:"off",hex:"tier",rad:18},
 "Glow outline":{band:"off",outline:"glow",olW:2,glow:16,brk:"off",stripe:"off",pill:"off",hex:"white",wash:6},
 "Stripe + pill":{band:"off",outline:"off",brk:"off",stripe:"fade",stW:5,pill:"on",hex:"white"},
 "All four":{band:"gradient",bandA:26,outline:"glow",olW:2,glow:12,brk:"on",stripe:"fade",pill:"on",hex:"tier"}
};
let S;try{S=Object.assign({},BASE,JSON.parse(localStorage.getItem("cc2k")||"{}"))}catch(e){S={...BASE}}
const $=id=>document.getElementById(id);
const P={PTS:86,"3PM":86,REB:27,AST:73,STL:93,BLK:54,"FG%":42,"FT%":92,TO:44};
const BADGES=[["Interceptor","STL",93],["Free-Throw Ace","FT%",92],["Volume Shooter","PTS",86],["Limitless Range","3PM",86]];
function tc(v){return v>=99?"goat":v>=95?"leg":v>=90?"hof":v>=80?"gd":null}
function col(t){return S["c_"+t]}
function a(hex,p){return `color-mix(in srgb,${hex} ${p}%,transparent)`}
function goatFill(c){return `linear-gradient(90deg,#1b1b20,${c},#1b1b20)`}

function render(){
 const T=S.tier,t=col(T),ovr=TIERS[T].ovr,goat=T==="goat";
 let band="";
 if(S.band!=="off"){const k=S.bandA;
  band=S.band==="tint"?a(t,k):S.band==="gradient"?`linear-gradient(180deg,${a(t,k*1.3)},${a(t,k*.4)})`:`linear-gradient(135deg,${a(t,k*1.8)},${a(t,k*.6)})`;}
 const bandLine=S.band!=="off"?`border-bottom:1px solid ${a(t,55)}`:"";
 // hex
 let hx="",hb="#111",hs="#4b4c52";
 if(S.hex==="white"){hx="#fff"}
 else if(S.hex==="tier"){hx=goat?goatFill(t):`linear-gradient(160deg,color-mix(in srgb,${t} 55%,#fff),${t})`;hb=goat?"#fff":"#1a0d10";hs=goat?"#ddd":a("#000",55)}
 else if(S.hex==="outline"){hx=`linear-gradient(#18191d,#18191d) padding-box,${t}`;hb=t;hs=t}
 else {hx="#0e0f12";hb="#fff";hs=t}
 const hexIn=S.hex==="outline"?`<div class="hex" style="background:${t}"><div class="hex" style="position:absolute;inset:3px;width:auto;height:auto;background:var(--cbg)"></div><b style="position:relative;color:${t}">${ovr}</b><small style="position:relative;color:${t}">OVR</small></div>`
  :`<div class="hex ${goat&&S.hex==="tier"?"goatfx":""}" style="background:${hx}"><b style="color:${hb}">${ovr}</b><small style="color:${hs}">OVR</small></div>`;
 // bars
 const bar=(c,v)=>{const k=tc(v),on=Math.round(v/10);const fill=S.bars==="mono"||!k?S.seg1:col(k);
  const isG=k==="goat"&&S.bars!=="mono";
  return `<div class="al"><span>${c}</span><b style="color:${S.bars!=="mono"&&k?(k==="goat"?"#fff":col(k)):"#fff"}">${v}</b><div class="sg">${Array.from({length:10},(_,i)=>`<i class="${i<on&&isG?"goatfx":""}" style="${i<on?`background:${isG?goatFill(fill):fill}`:""}"></i>`).join("")}</div></div>`};
 const attrs=Object.entries(P).map(([c,v])=>bar(c,v)).join("");
 const bdg=BADGES.map(([n,c,v])=>{const k=tc(v),cc=col(k);return `<div class="bdg"><div class="hb" style="background:${k==="goat"?goatFill(cc):cc}"></div><div><p>${n}</p><small>${c} · <u style="color:${k==="goat"?"#fff":cc}">${TIERS[k].n}</u></small></div></div>`}).join("");
 // outline
 let ol="",shadow="";
 if(S.outline==="thin")ol=`border:${S.olW}px solid ${a(t,70)}`;
 if(S.outline==="glow"){ol=`border:${S.olW}px solid ${a(t,80)}`;shadow=`box-shadow:0 0 ${S.glow}px ${a(t,55)}`}
 if(S.outline==="gradient"){ol=`border:${S.olW}px solid transparent;background:linear-gradient(135deg,${t},${a(t,10)},${t}) border-box;-webkit-mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude`}
 const crc=S.crMode==="tier"?t:S.crc;
 const crs=S.brk==="on"?["tl","tr","bl","br"].map(p=>`<i class="cr ${p}" style="width:${S.crS}px;height:${S.crS}px"></i>`).join(""):"";
 const stripe=S.stripe==="off"?"":`<i class="stripe ${goat?"goatfx":""}" style="width:${S.stW}px;background:${S.stripe==="solid"?(goat?goatFill(t):t):`linear-gradient(180deg,${t},${a(t,15)})`}"></i>`;
 const wash=S.wash?`linear-gradient(180deg,${a(t,S.wash)},transparent 70%),`:"";
 $("out").innerHTML=`${S.above==="on"?`<p class="lbl" style="--t:${goat?"#fff":t}">${TIERS[T].n} · OVR ${ovr}</p>`:""}
 <div class="card" style="--t:${t};--rad:${S.rad}px;--cbg:${S.cbg};--nick:${S.nick};--seg0:${S.seg0};--line2:${S.line2};--tile:${S.tile};--crc:${crc};--crw:${S.crW}px;--cri:${S.crI}px;background:${wash}${S.cbg};${shadow}">
  <div class="hd"><div class="band" style="${band?`background:${band};`:""}${bandLine}"></div>${hexIn}
   <div class="nm"><h3>Tyrese Maxey</h3><div class="nk">“FLASH”</div><div class="ar">TWO-WAY GUARD · STL · PTS</div><div class="ob">OVR from last season + projection · #6 proj</div></div>
   ${S.pill==="on"?`<span class="pill" style="${goat?"color:#fff;border-color:#fff":""}">${TIERS[T].n}</span>`:""}</div>
  ${S.band==="off"?'<div class="div"></div>':""}
  <div class="at">${attrs}</div><div class="div"></div><div class="bd">${bdg}</div>
  ${stripe}${crs}<i class="outl" style="${ol}"></i>
 </div>`;
 sync();
}
function sync(){
 document.querySelectorAll("[data-k]").forEach(el=>el.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===S[el.dataset.k])));
 document.querySelectorAll("input[type=range],input[type=color]").forEach(i=>{if(i.value!==String(S[i.id]))i.value=S[i.id];const o=i.nextElementSibling;if(o&&o.tagName==="OUTPUT")o.textContent=S[i.id]});
 $("tiers").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.t===S.tier));
 const out={...S};$("json").value=JSON.stringify(out);
 try{localStorage.setItem("cc2k",JSON.stringify(S))}catch(e){}
}
// build controls
$("tiers").innerHTML=Object.entries(TIERS).map(([k,v])=>`<button data-t="${k}" style="--t:${k==="goat"?"#fff":S["c_"+k]}">${v.n} ${v.ovr}</button>`).join("");
$("tiers").onclick=e=>{const b=e.target.closest("button");if(b){S.tier=b.dataset.t;render()}};
document.querySelectorAll("[data-k]").forEach(el=>{el.innerHTML=el.dataset.o.split(",").map(v=>`<button data-v="${v}">${v[0].toUpperCase()+v.slice(1)}</button>`).join("");
 el.onclick=e=>{const b=e.target.closest("button");if(b){S[el.dataset.k]=b.dataset.v;render()}}});
document.querySelectorAll("input[type=range],input[type=color]").forEach(i=>i.oninput=()=>{S[i.id]=i.type==="range"?+i.value:i.value;
 if(i.id==="crc")S.crMode="custom";
 if(i.id.startsWith("c_"))$("tiers").querySelector(`[data-t="${i.id.slice(2)}"]`).style.setProperty("--t",i.id==="c_goat"?"#fff":i.value);
 render()});
$("presets").innerHTML=Object.keys(PRESETS).map(k=>`<button data-p="${k}">${k}</button>`).join("");
$("presets").onclick=e=>{const b=e.target.closest("button");if(b){Object.assign(S,PRESETS[b.dataset.p]);render()}};
$("reset").onclick=()=>{S={...BASE};render()};
$("copy").onclick=()=>{const t=$("json").value,b=$("copy");
 const done=()=>{b.textContent="Copied";setTimeout(()=>b.textContent="Copy settings",1500)};
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done,()=>{$("json").select();b.textContent="Selected, copy it"});
 else{$("json").select();b.textContent="Selected, copy it"}};
render();
</script>

</body></html>
